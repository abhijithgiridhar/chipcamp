<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Facilitators · Chip Camp</title>
<style>
@import url("https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Nunito:wght@600;800;900&family=JetBrains+Mono:wght@400;700&display=swap");
:root{
  --ink:#2b2f4a; --ink-soft:#69709a; --bg:#e8f0ff; --card:#ffffff; --line:#d3def6; --line-soft:#e6edfb;
  --purple:#7c4dff; --blue:#4c97ff; --green:#3fb950; --green-d:#2c8f3b; --events:#FFBF00;
  --font-d:"Fredoka","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --font-b:"Nunito","Segoe UI","Trebuchet MS",system-ui,sans-serif;
  --font-m:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --nh:6px; --nx:16px; --nw:26px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-b);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
[hidden]{display:none!important}

/* ---------- top bar ---------- */
.topbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 18px;background:linear-gradient(90deg,#7c4dff,#4c97ff);color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.12);}
.brand{font-family:var(--font-d);font-size:24px;font-weight:600;letter-spacing:.2px;display:flex;align-items:center;gap:8px;margin-right:6px}
.brand .logo{display:inline-grid;grid-template-columns:repeat(2,12px);gap:3px;transform:rotate(-8deg)}
.brand .logo i{width:12px;height:12px;border-radius:4px;display:block}
.ptabs{display:flex;gap:8px;flex-wrap:wrap}
.ptab{border:0;cursor:pointer;font-family:var(--font-d);font-size:17px;font-weight:500;padding:8px 16px;border-radius:16px;background:rgba(255,255,255,.2);color:#fff;display:flex;align-items:center;gap:7px;transition:transform .12s, background .15s;}
.ptab:hover{background:rgba(255,255,255,.32);transform:translateY(-1px)}
.ptab[aria-selected="true"]{background:#fff;color:var(--pc);box-shadow:0 4px 0 rgba(0,0,0,.18);transform:translateY(-1px)}
.ptab .em{font-size:20px}
.spacer{flex:1}
.viewtabs{display:flex;background:rgba(0,0,0,.18);border-radius:18px;padding:4px;gap:4px}
.vtab{border:0;cursor:pointer;font-family:var(--font-d);font-size:17px;padding:8px 18px;border-radius:14px;background:transparent;color:#fff;display:flex;align-items:center;gap:6px}
.vtab[aria-selected="true"]{background:#fff;color:var(--purple);box-shadow:0 3px 0 rgba(0,0,0,.18)}

.btn{border:0;cursor:pointer;font-family:var(--font-d);font-weight:500;font-size:15px;padding:8px 14px;border-radius:14px;background:#fff;color:var(--ink);box-shadow:0 3px 0 #c9d6f2;border:2px solid #d3def6;display:inline-flex;align-items:center;gap:6px;transition:transform .08s, box-shadow .08s;white-space:nowrap}
.btn:hover{transform:translateY(-1px);box-shadow:0 4px 0 #c9d6f2}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #c9d6f2}
.btn.go{background:var(--green);border-color:var(--green-d);color:#fff;box-shadow:0 4px 0 var(--green-d)}
.btn.go:hover{box-shadow:0 5px 0 var(--green-d)}
.btn.go:active{box-shadow:0 1px 0 var(--green-d)}
.btn.stop{background:#ff6680;border-color:#d94a63;color:#fff;box-shadow:0 4px 0 #d94a63}
.btn.big{font-size:19px;padding:12px 22px;border-radius:18px}
.btn.small{font-size:13px;padding:5px 10px;border-radius:11px}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* ---------- blocks ---------- */
.blk{--c:#9966FF;position:relative;filter:drop-shadow(0 2px 0 rgba(0,0,0,.2));user-select:none;touch-action:none}
.dz>.blk+.blk,.blk+.blk{margin-top:calc(var(--nh) * -1)}
.blk>.row,.blk>.foot{background:var(--c);color:#fff;font-family:var(--font-d);font-weight:500;font-size:15px;text-shadow:0 1px 0 rgba(0,0,0,.18)}
.blk>.row{display:flex;align-items:center;flex-wrap:wrap;gap:6px;min-height:46px;padding:8px 10px calc(8px + var(--nh)) 12px;
  clip-path:polygon(0 0,var(--nx) 0,calc(var(--nx) + 4px) var(--nh),calc(var(--nx) + var(--nw) - 4px) var(--nh),calc(var(--nx) + var(--nw)) 0,100% 0,100% calc(100% - var(--nh)),calc(var(--nx) + var(--nw)) calc(100% - var(--nh)),calc(var(--nx) + var(--nw) - 4px) 100%,calc(var(--nx) + 4px) 100%,var(--nx) calc(100% - var(--nh)),0 calc(100% - var(--nh)));
  cursor:grab}
.blk.c>.row{clip-path:polygon(0 0,var(--nx) 0,calc(var(--nx) + 4px) var(--nh),calc(var(--nx) + var(--nw) - 4px) var(--nh),calc(var(--nx) + var(--nw)) 0,100% 0,100% 100%,0 100%);padding-bottom:8px;border-radius:12px 12px 0 0}
.blk.c>.row.else{clip-path:none;border-radius:0;min-height:34px;padding-top:6px;padding-bottom:6px}
.blk:not(.c)>.row{border-radius:12px 12px 12px 12px}
.blk>.foot{height:calc(26px + var(--nh));border-radius:0 0 12px 12px;display:flex;align-items:center;padding:0 12px var(--nh) 12px;gap:8px;
  clip-path:polygon(0 0,100% 0,100% calc(100% - var(--nh)),calc(var(--nx) + var(--nw)) calc(100% - var(--nh)),calc(var(--nx) + var(--nw) - 4px) 100%,calc(var(--nx) + 4px) 100%,var(--nx) calc(100% - var(--nh)),0 calc(100% - var(--nh)))}
.cslot{display:flex;background:var(--c)}
.cslot::before{content:"";width:16px;flex:none;background:var(--c)}
.cslot>.dz{flex:1;background:#f7f9ff;border-radius:10px 0 0 10px;min-height:44px;margin:0;box-shadow:inset 0 3px 0 rgba(0,0,0,.08)}
.blk .x{margin-left:auto;border:0;background:rgba(255,255,255,.28);color:#fff;width:22px;height:22px;border-radius:50%;cursor:pointer;font-size:12px;line-height:1;padding:0;opacity:.0;transition:opacity .12s}
.blk:hover>.row .x,.blk>.row .x:focus-visible{opacity:1}
.blk .x:hover{background:rgba(255,255,255,.5)}
.blk .tag{font-size:11px;font-weight:700;background:rgba(0,0,0,.16);border-radius:10px;padding:2px 8px;font-family:var(--font-b);text-shadow:none}
.elsebtn{border:0;cursor:pointer;background:rgba(255,255,255,.28);color:#fff;font-family:var(--font-d);font-size:13px;border-radius:10px;padding:3px 10px}
.elsebtn:hover{background:rgba(255,255,255,.45)}
.blk.running>.row,.blk.running>.foot{animation:glow .6s ease-in-out infinite alternate}
@keyframes glow{from{filter:brightness(1)}to{filter:brightness(1.35) saturate(1.2)}}
.blk.pop{animation:pop .38s cubic-bezier(.3,1.7,.5,1)}
@keyframes pop{0%{transform:scale(.6) rotate(-4deg);opacity:.2}100%{transform:scale(1) rotate(0);opacity:1}}
.blk.lifting{opacity:.3}
.ghost{position:fixed;z-index:1000;pointer-events:none;transform:rotate(2deg) scale(1.04);filter:drop-shadow(0 10px 12px rgba(40,40,80,.35));opacity:.96}
.ghost .x{display:none}

/* parameter fields (Scratch style) */
.pill{display:inline-flex;align-items:center;border-radius:16px;background:#fff;color:var(--ink);text-shadow:none;font-family:var(--font-b);font-weight:800;font-size:14px;padding:0;overflow:hidden;box-shadow:inset 0 -2px 0 rgba(0,0,0,.1)}
.pill input{border:0;background:transparent;outline:0;font-weight:800;color:var(--ink);padding:3px 9px;min-width:0;text-align:center;font-family:var(--font-b)}
.pill input[type=number]{width:58px;-moz-appearance:textfield}
.pill input[type=number]::-webkit-outer-spin-button,.pill input[type=number]::-webkit-inner-spin-button{opacity:.55}
.pill input[type=text]{width:116px}
.pill:focus-within{outline:3px solid rgba(255,255,255,.75);outline-offset:1px}
.drop{display:inline-flex;align-items:center;border-radius:14px;background:rgba(0,0,0,.2);color:#fff;font-family:var(--font-b);font-weight:800;font-size:14px;text-shadow:none;padding:0;position:relative}
.drop select{appearance:none;-webkit-appearance:none;border:0;background:transparent;color:#fff;font-weight:800;padding:4px 24px 4px 10px;cursor:pointer;outline:0;border-radius:14px;font-family:var(--font-b)}
.drop select option{color:var(--ink);background:#fff}
.drop::after{content:"▾";position:absolute;right:9px;pointer-events:none;font-size:12px}
.drop:focus-within{outline:3px solid rgba(255,255,255,.75);outline-offset:1px}
.static{display:inline-flex;align-items:center;border-radius:14px;padding:2px 9px;font-weight:800;font-size:13px;font-family:var(--font-b);text-shadow:none}
.static.p{background:#fff;color:var(--ink)}
.static.d{background:rgba(0,0,0,.2);color:#fff}
.palette-blk{margin-bottom:10px;cursor:grab}
.palette-blk>.row{cursor:grab}
.palette-blk.c>.foot{height:calc(18px + var(--nh))}

.dz{display:flex;flex-direction:column;min-height:40px;position:relative}
.dz.over{outline:3px dashed var(--purple);outline-offset:-3px;border-radius:12px;background:rgba(124,77,255,.07)}
.dz:empty::before,.dz.empty::before{content:"drop blocks here";display:flex;align-items:center;justify-content:center;min-height:44px;color:#9aa4c7;font-weight:800;font-size:13px;border-radius:10px;border:2px dashed #cfd9f3;margin:4px}
.dropline{height:0;position:relative;z-index:5}
.dropline::after{content:"";position:absolute;left:-2px;right:-2px;top:-3px;height:6px;border-radius:4px;background:var(--purple);box-shadow:0 0 0 2px #fff}
/* ---------- misc ---------- */
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:#2b2f4a;color:#fff;font-family:var(--font-d);padding:10px 18px;border-radius:16px;opacity:0;pointer-events:none;transition:all .25s;z-index:3000;box-shadow:0 8px 20px rgba(0,0,0,.25)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.modalback{position:fixed;inset:0;background:rgba(43,47,74,.5);display:grid;place-items:center;z-index:2000;padding:16px}
.modal{background:#fff;border-radius:22px;width:min(560px,100%);max-height:86vh;overflow:auto;padding:18px 20px;box-shadow:0 20px 50px rgba(0,0,0,.3);border:3px solid var(--line)}
.modal h2{font-family:var(--font-d);font-weight:500;margin:0 0 10px;font-size:22px}
.modal textarea{width:100%;height:120px;border:2px solid var(--line);border-radius:12px;padding:8px;font-family:var(--font-m);font-size:12px}
.saverow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:2px solid var(--line-soft)}
.saverow .who{flex:1;font-weight:800}
.saverow .who small{display:block;font-weight:600;color:var(--ink-soft)}
.conf{position:fixed;z-index:2500;font-size:26px;pointer-events:none;animation:conf 1.1s ease-out forwards}
@keyframes conf{0%{transform:translate(0,0) rotate(0) scale(.6);opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(var(--r)) scale(1.2);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

.homebtn{display:inline-grid;place-items:center;width:42px;height:42px;border-radius:14px;background:rgba(255,255,255,.22);color:#fff;text-decoration:none;font-size:21px;box-shadow:0 3px 0 rgba(0,0,0,.14);transition:transform .12s,background .15s;flex:none}
.homebtn:hover{background:rgba(255,255,255,.36);transform:translateY(-1px)}
.homebtn:focus-visible{outline:3px solid #fff;outline-offset:2px}
a.btn{text-decoration:none}

/* ---------- the step bar ---------- */
.flow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 18px;background:#fff;border-bottom:2px solid var(--line-soft)}
.fstep{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink-soft);font-family:var(--font-d);font-size:16px;padding:5px 14px 5px 6px;border-radius:999px;border:2px solid var(--line);background:#fff;transition:transform .12s}
.fstep:hover{transform:translateY(-1px)}
.fstep i{width:26px;height:26px;border-radius:50%;background:#e6edfb;display:grid;place-items:center;font-style:normal;font-size:14px;color:var(--ink-soft)}
.fstep small{font-family:var(--font-b);font-weight:800;font-size:11px;background:#fff1c9;color:#7a5b00;border-radius:8px;padding:1px 6px}
.fstep.done{border-color:#9bdca4;background:#effbf1;color:#23702f}
.fstep.done i{background:var(--green);color:#fff}
.fstep.cur{border-color:var(--purple);color:var(--purple);box-shadow:0 0 0 3px rgba(124,77,255,.18);background:#fff}
.fstep.cur i{background:var(--purple);color:#fff}
.fstep.lock{opacity:.55;pointer-events:none}
@media (max-width:760px){.flow{padding:8px 10px}.fstep{font-size:14px}}

/* Facilitator area */
.card{background:var(--card);border:2px solid var(--line);border-radius:20px;box-shadow:0 4px 0 var(--line)}
.lock{display:grid;place-items:center;padding:40px 16px}
.lockcard{width:min(420px,100%);padding:26px 24px 22px;text-align:center}
.lockico{font-size:44px}
.lockcard h1{font-family:var(--font-d);font-weight:500;font-size:26px;margin:6px 0 4px}
.lockcard p{margin:0 0 14px;color:var(--ink-soft);font-weight:700}
.lockcard label{display:block;text-align:left;font-weight:800;font-size:12px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.lockcard input{width:100%;border:3px solid var(--line);border-radius:14px;padding:11px 14px;font-size:22px;font-weight:800;letter-spacing:.3em;text-align:center;margin-bottom:14px}
.lockcard input:focus{outline:3px solid rgba(124,77,255,.35);border-color:var(--purple)}
.lockmsg{min-height:22px;margin-top:10px;font-weight:800;color:#d94a63}
.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}

.plans{display:grid;grid-template-columns:240px minmax(0,1fr);gap:14px;padding:14px 18px 50px;max-width:1300px;margin:0 auto;align-items:start}
.plannav{position:sticky;top:12px;padding:10px;display:flex;flex-direction:column;gap:4px}
.plannav a{display:block;text-decoration:none;color:var(--ink);font-family:var(--font-d);font-size:16px;padding:8px 12px;border-radius:12px}
.plannav a:hover{background:#f0f4ff}
.plannav a[aria-current="true"]{background:var(--purple);color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.15)}
.plannav .sep{font-size:11px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-soft);padding:8px 12px 2px}
.planbody{padding:22px 26px 30px;font-size:16px;line-height:1.55;min-width:0}
.planbody h1{font-family:var(--font-d);font-weight:500;font-size:32px;margin:0 0 8px}
.planbody h2{font-family:var(--font-d);font-weight:500;font-size:23px;margin:26px 0 8px;padding-bottom:4px;border-bottom:3px solid var(--line-soft)}
.planbody h3{font-family:var(--font-d);font-weight:500;font-size:19px;margin:20px 0 6px;color:#4b3fb5}
.planbody p{margin:8px 0}
.planbody ul,.planbody ol{margin:8px 0;padding-left:24px}
.planbody li{margin:3px 0}
.planbody li.todo{list-style:none;margin-left:-20px}
.planbody a{color:#4b3fb5;font-weight:800}
.planbody code{font-family:var(--font-m);font-size:.88em;background:#f1f4ff;border-radius:6px;padding:1px 6px}
.planbody pre{background:#f6f8ff;border:2px solid var(--line-soft);border-radius:12px;padding:12px;overflow:auto}
.planbody pre code{background:none;padding:0}
.planbody blockquote{margin:12px 0;padding:10px 16px;border-left:6px solid var(--purple);background:#f4f1ff;border-radius:0 12px 12px 0;font-weight:700}
.planbody hr{border:0;border-top:3px solid var(--line-soft);margin:22px 0}
.tw{overflow-x:auto;margin:10px 0}
.planbody table{border-collapse:collapse;width:100%;font-size:14.5px}
.planbody th{background:#eef2ff;text-align:left;font-family:var(--font-d);font-weight:500;padding:8px 10px;border:2px solid var(--line)}
.planbody td{padding:7px 10px;border:2px solid var(--line-soft);vertical-align:top}
.planbody tbody tr:nth-child(even){background:#fafbff}
@media (max-width:820px){.plans{grid-template-columns:1fr;padding:10px}.plannav{position:static;flex-direction:row;flex-wrap:wrap}.planbody{padding:16px}}
@media print{.topbar,.plannav{display:none!important}.plans{display:block;padding:0}.planbody{border:0;box-shadow:0}body{background:#fff}}

</style>
</head>
<body>
<header class="topbar">
  <a class="homebtn" href="index.html" title="Back to the Chip Camp welcome screen" aria-label="Home">🏠</a>
  <div class="brand"><span class="logo" aria-hidden="true"><i style="background:#FFBF00"></i><i style="background:#4C97FF"></i><i style="background:#CF63CF"></i><i style="background:#59C059"></i></span>Facilitators</div>
  <div class="spacer"></div>
  <a class="btn small" id="slidesBtn" href="slides.html" hidden>🎞 Presentations</a>
  <button class="btn small" id="day2Btn" hidden></button>
  <button class="btn small" id="proBtn" hidden></button>
  <button class="btn small" id="lockBtn" hidden>🔒 Lock</button>
</header>

<main class="lock" id="lockView">
  <form class="lockcard card" id="lockForm" autocomplete="off">
    <div class="lockico" aria-hidden="true">🔒</div>
    <h1>Facilitator area</h1>
    <p>Session plans and presentations for the camp team.</p>
    <label for="pin">Password</label>
    <input id="pin" type="password" inputmode="numeric" autocomplete="off" autofocus>
    <button class="btn go big" type="submit">Unlock</button>
    <div class="lockmsg" id="lockMsg" role="status" aria-live="polite"></div>
  </form>
</main>

<div class="plans" id="plansView" hidden>
  <nav class="plannav card" id="planNav" aria-label="Documents"></nav>

<script>
/* Chip Camp: what each student has chosen and finished, shared by every page (kept in this browser only). */
(function (root) {
  'use strict';
  const KEY = 'chipcamp.v1';
  const ROBOTS = ['chipbot', 'peeko', 'jarvis'];
  function read() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } }
  function write(d) { try { localStorage.setItem(KEY, JSON.stringify(d)); } catch (e) { /* private window: just don't remember */ } }
  function clean(s) { return String(s == null ? '' : s).replace(/[^A-Za-z0-9 .,!?'_-]/g, '').replace(/\s+/g, ' ').trim().slice(0, 16); }

  root.ChipCamp = {
    ROBOTS,
    get() {
      const d = read();
      return { name: clean(d.name), robot: ROBOTS.indexOf(d.robot) >= 0 ? d.robot : null, levels: d.levels || {}, circuits: d.circuits || {}, code: d.code || {}, tests: d.tests || {}, copied: d.copied || {} };
    },
    design(robot) { const d = read(); return (d.designs && d.designs[robot]) || null; },
    setDesign(robot, design) { if (ROBOTS.indexOf(robot) < 0) return; const d = read(); d.designs = d.designs || {}; d.designs[robot] = design; write(d); },
    testDone(robot, on) { const d = read(); d.tests = d.tests || {}; d.tests[robot] = on !== false; write(d); },
    codeCopied(robot) { const d = read(); d.copied = d.copied || {}; d.copied[robot] = true; write(d); },
    proUnlocked() { try { return !!localStorage.getItem('chipcamp.prokey'); } catch (e) { return false; } },
    day2() { return !!read().day2; },
    setDay2(on) { const d = read(); d.day2 = !!on; write(d); },
    robotOrDefault() { return this.get().robot || 'chipbot'; },
    setName(n) { const d = read(); d.name = clean(n); write(d); },
    setRobot(r) { if (ROBOTS.indexOf(r) < 0) return; const d = read(); d.robot = r; write(d); },
    levelDone(level, stars) { const d = read(); d.levels = d.levels || {}; d.levels[level] = Math.max(d.levels[level] || 0, stars || 1); write(d); },
    circuitDone(robot) { const d = read(); d.circuits = d.circuits || {}; d.circuits[robot] = true; write(d); },
    codeBlocks(robot, n) { const d = read(); d.code = d.code || {}; d.code[robot] = n; write(d); },
    levelsCompleted() { const l = this.get().levels; return Object.keys(l).filter((k) => l[k] > 0).length; }
  };

  // the home button on every page goes back to the student's robot page
  if (typeof document !== 'undefined') {
    document.addEventListener('DOMContentLoaded', function () {
      var r = root.ChipCamp.get().robot, b = document.querySelector('.homebtn');
      if (b && r) b.setAttribute('href', 'index.html#' + r);
    });
  }
})(typeof self !== 'undefined' ? self : this);

</script>
<script>
/* Facilitator area. The page only holds the encrypted plans; the password decrypts them here. */
(function () {
  'use strict';
  const $ = (s) => document.querySelector(s);
  const P = window.PLANS_PAYLOAD;
  const b64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  let docs = null, currentPin = '';
  const PRO = 'chipcamp.prokey';
  async function proKey(pin) {
    const enc = (s) => new TextEncoder().encode(s);
    const km = await crypto.subtle.importKey('raw', enc(pin + ':pro'), 'PBKDF2', false, ['deriveBits']);
    const bits = await crypto.subtle.deriveBits({ name: 'PBKDF2', salt: enc('chipcamp-pro-v1'), iterations: 250000, hash: 'SHA-256' }, km, 256);
    return btoa(String.fromCharCode.apply(null, new Uint8Array(bits)));
  }
  const hasPro = () => { try { return !!localStorage.getItem(PRO); } catch (e) { return false; } };
  function proLabel() { $('#proBtn').textContent = hasPro() ? '✓ Pro code is unlocked on this laptop (tap to lock)' : '🔓 Unlock the Pro code on this laptop'; }
  $('#proBtn').onclick = async () => { try { if (hasPro()) localStorage.removeItem(PRO); else localStorage.setItem(PRO, await proKey(currentPin)); } catch (e) { /* fine */ } proLabel(); };

  async function decrypt(pin) {
    const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pin), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64(P.s), iterations: P.n, hash: 'SHA-256' }, km, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
    const buf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64(P.i) }, key, b64(P.c));
    return JSON.parse(new TextDecoder().decode(buf));
  }
  function show() {
    const ids = docs.map((d) => d.id);
    const m = location.hash.match(/^#doc=([\w-]+)/);
    const cur = m && ids.indexOf(m[1]) >= 0 ? m[1] : ids[0];
    const nav = $('#planNav'); nav.innerHTML = '';
    docs.forEach((d) => {
      const a = document.createElement('a'); a.href = '#doc=' + d.id; a.textContent = d.title; a.setAttribute('aria-current', d.id === cur ? 'true' : 'false'); nav.appendChild(a);
    });
    $('#planBody').innerHTML = docs.find((d) => d.id === cur).html;
    document.title = docs.find((d) => d.id === cur).title + ' · Chip Camp facilitators';
    window.scrollTo(0, 0);
  }
  function day2Label() { $('#day2Btn').textContent = ChipCamp.day2() ? '✓ Day 2 tools are unlocked on this laptop (tap to lock)' : '🔓 Unlock day 2 tools on this laptop'; }
  $('#day2Btn').onclick = () => { ChipCamp.setDay2(!ChipCamp.day2()); day2Label(); };
  function open(d) {
    docs = d; $('#lockView').hidden = true; $('#plansView').hidden = false; $('#lockBtn').hidden = false; $('#day2Btn').hidden = false; $('#proBtn').hidden = false; $('#slidesBtn').hidden = false; day2Label(); proLabel(); show();
  }
  async function attempt(pin, quiet) {
    const msg = $('#lockMsg');
    if (!window.crypto || !crypto.subtle) { msg.textContent = 'This browser cannot unlock the page here. Open it over https or in a current Chrome, Edge or Safari.'; return; }
    try {
      open(await decrypt(pin)); currentPin = pin;
      try { sessionStorage.setItem('chipcamp.plans', pin); } catch (e) { /* fine */ }
    } catch (e) {
      try { sessionStorage.removeItem('chipcamp.plans'); } catch (e2) { /* fine */ }
      if (quiet) return;
      msg.textContent = 'That is not the password.';
      const card = $('#lockForm'); card.classList.remove('shake'); void card.offsetWidth; card.classList.add('shake');
      $('#pin').select();
    }
  }
  $('#lockForm').onsubmit = (e) => { e.preventDefault(); $('#lockMsg').textContent = ''; attempt($('#pin').value.trim()); };
  $('#lockBtn').onclick = () => { docs = null; try { sessionStorage.removeItem('chipcamp.plans'); } catch (e) { /* fine */ } $('#plansView').hidden = true; $('#lockView').hidden = false; $('#lockBtn').hidden = true; $('#day2Btn').hidden = true; $('#proBtn').hidden = true; $('#slidesBtn').hidden = true; currentPin = ''; $('#planBody').innerHTML = ''; $('#pin').value = ''; $('#pin').focus(); };
  window.addEventListener('hashchange', () => { if (docs) show(); });
  let saved = null; try { saved = sessionStorage.getItem('chipcamp.plans'); } catch (e) { /* fine */ }
  if (saved) attempt(saved, true);
})();

</script>
