<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Echo Lab · Chip Camp</title>
<style>
@import url("https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Nunito:wght@600;800;900&family=JetBrains+Mono:wght@400;700&display=swap");
:root{
  --ink:#2b2f4a; --ink-soft:#69709a; --bg:#e8f0ff; --card:#ffffff; --line:#d3def6; --line-soft:#e6edfb;
  --purple:#7c4dff; --blue:#4c97ff; --green:#3fb950; --green-d:#2c8f3b; --events:#FFBF00;
  --font-d:"Fredoka","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --font-b:"Nunito","Segoe UI","Trebuchet MS",system-ui,sans-serif;
  --font-m:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --nh:6px; --nx:16px; --nw:26px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-b);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
[hidden]{display:none!important}

/* ---------- top bar ---------- */
.topbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 18px;background:linear-gradient(90deg,#7c4dff,#4c97ff);color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.12);}
.brand{font-family:var(--font-d);font-size:24px;font-weight:600;letter-spacing:.2px;display:flex;align-items:center;gap:8px;margin-right:6px}
.brand .logo{display:inline-grid;grid-template-columns:repeat(2,12px);gap:3px;transform:rotate(-8deg)}
.brand .logo i{width:12px;height:12px;border-radius:4px;display:block}
.ptabs{display:flex;gap:8px;flex-wrap:wrap}
.ptab{border:0;cursor:pointer;font-family:var(--font-d);font-size:17px;font-weight:500;padding:8px 16px;border-radius:16px;background:rgba(255,255,255,.2);color:#fff;display:flex;align-items:center;gap:7px;transition:transform .12s, background .15s;}
.ptab:hover{background:rgba(255,255,255,.32);transform:translateY(-1px)}
.ptab[aria-selected="true"]{background:#fff;color:var(--pc);box-shadow:0 4px 0 rgba(0,0,0,.18);transform:translateY(-1px)}
.ptab .em{font-size:20px}
.spacer{flex:1}
.viewtabs{display:flex;background:rgba(0,0,0,.18);border-radius:18px;padding:4px;gap:4px}
.vtab{border:0;cursor:pointer;font-family:var(--font-d);font-size:17px;padding:8px 18px;border-radius:14px;background:transparent;color:#fff;display:flex;align-items:center;gap:6px}
.vtab[aria-selected="true"]{background:#fff;color:var(--purple);box-shadow:0 3px 0 rgba(0,0,0,.18)}

.btn{border:0;cursor:pointer;font-family:var(--font-d);font-weight:500;font-size:15px;padding:8px 14px;border-radius:14px;background:#fff;color:var(--ink);box-shadow:0 3px 0 #c9d6f2;border:2px solid #d3def6;display:inline-flex;align-items:center;gap:6px;transition:transform .08s, box-shadow .08s;white-space:nowrap}
.btn:hover{transform:translateY(-1px);box-shadow:0 4px 0 #c9d6f2}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #c9d6f2}
.btn.go{background:var(--green);border-color:var(--green-d);color:#fff;box-shadow:0 4px 0 var(--green-d)}
.btn.go:hover{box-shadow:0 5px 0 var(--green-d)}
.btn.go:active{box-shadow:0 1px 0 var(--green-d)}
.btn.stop{background:#ff6680;border-color:#d94a63;color:#fff;box-shadow:0 4px 0 #d94a63}
.btn.big{font-size:19px;padding:12px 22px;border-radius:18px}
.btn.small{font-size:13px;padding:5px 10px;border-radius:11px}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* ---------- blocks ---------- */
.blk{--c:#9966FF;position:relative;filter:drop-shadow(0 2px 0 rgba(0,0,0,.2));user-select:none;touch-action:none}
.dz>.blk+.blk,.blk+.blk{margin-top:calc(var(--nh) * -1)}
.blk>.row,.blk>.foot{background:var(--c);color:#fff;font-family:var(--font-d);font-weight:500;font-size:15px;text-shadow:0 1px 0 rgba(0,0,0,.18)}
.blk>.row{display:flex;align-items:center;flex-wrap:wrap;gap:6px;min-height:46px;padding:8px 10px calc(8px + var(--nh)) 12px;
  clip-path:polygon(0 0,var(--nx) 0,calc(var(--nx) + 4px) var(--nh),calc(var(--nx) + var(--nw) - 4px) var(--nh),calc(var(--nx) + var(--nw)) 0,100% 0,100% calc(100% - var(--nh)),calc(var(--nx) + var(--nw)) calc(100% - var(--nh)),calc(var(--nx) + var(--nw) - 4px) 100%,calc(var(--nx) + 4px) 100%,var(--nx) calc(100% - var(--nh)),0 calc(100% - var(--nh)));
  cursor:grab}
.blk.c>.row{clip-path:polygon(0 0,var(--nx) 0,calc(var(--nx) + 4px) var(--nh),calc(var(--nx) + var(--nw) - 4px) var(--nh),calc(var(--nx) + var(--nw)) 0,100% 0,100% 100%,0 100%);padding-bottom:8px;border-radius:12px 12px 0 0}
.blk.c>.row.else{clip-path:none;border-radius:0;min-height:34px;padding-top:6px;padding-bottom:6px}
.blk:not(.c)>.row{border-radius:12px 12px 12px 12px}
.blk>.foot{height:calc(26px + var(--nh));border-radius:0 0 12px 12px;display:flex;align-items:center;padding:0 12px var(--nh) 12px;gap:8px;
  clip-path:polygon(0 0,100% 0,100% calc(100% - var(--nh)),calc(var(--nx) + var(--nw)) calc(100% - var(--nh)),calc(var(--nx) + var(--nw) - 4px) 100%,calc(var(--nx) + 4px) 100%,var(--nx) calc(100% - var(--nh)),0 calc(100% - var(--nh)))}
.cslot{display:flex;background:var(--c)}
.cslot::before{content:"";width:16px;flex:none;background:var(--c)}
.cslot>.dz{flex:1;background:#f7f9ff;border-radius:10px 0 0 10px;min-height:44px;margin:0;box-shadow:inset 0 3px 0 rgba(0,0,0,.08)}
.blk .x{margin-left:auto;border:0;background:rgba(255,255,255,.28);color:#fff;width:22px;height:22px;border-radius:50%;cursor:pointer;font-size:12px;line-height:1;padding:0;opacity:.0;transition:opacity .12s}
.blk:hover>.row .x,.blk>.row .x:focus-visible{opacity:1}
.blk .x:hover{background:rgba(255,255,255,.5)}
.blk .tag{font-size:11px;font-weight:700;background:rgba(0,0,0,.16);border-radius:10px;padding:2px 8px;font-family:var(--font-b);text-shadow:none}
.elsebtn{border:0;cursor:pointer;background:rgba(255,255,255,.28);color:#fff;font-family:var(--font-d);font-size:13px;border-radius:10px;padding:3px 10px}
.elsebtn:hover{background:rgba(255,255,255,.45)}
.blk.running>.row,.blk.running>.foot{animation:glow .6s ease-in-out infinite alternate}
@keyframes glow{from{filter:brightness(1)}to{filter:brightness(1.35) saturate(1.2)}}
.blk.pop{animation:pop .38s cubic-bezier(.3,1.7,.5,1)}
@keyframes pop{0%{transform:scale(.6) rotate(-4deg);opacity:.2}100%{transform:scale(1) rotate(0);opacity:1}}
.blk.lifting{opacity:.3}
.ghost{position:fixed;z-index:1000;pointer-events:none;transform:rotate(2deg) scale(1.04);filter:drop-shadow(0 10px 12px rgba(40,40,80,.35));opacity:.96}
.ghost .x{display:none}

/* parameter fields (Scratch style) */
.pill{display:inline-flex;align-items:center;border-radius:16px;background:#fff;color:var(--ink);text-shadow:none;font-family:var(--font-b);font-weight:800;font-size:14px;padding:0;overflow:hidden;box-shadow:inset 0 -2px 0 rgba(0,0,0,.1)}
.pill input{border:0;background:transparent;outline:0;font-weight:800;color:var(--ink);padding:3px 9px;min-width:0;text-align:center;font-family:var(--font-b)}
.pill input[type=number]{width:58px;-moz-appearance:textfield}
.pill input[type=number]::-webkit-outer-spin-button,.pill input[type=number]::-webkit-inner-spin-button{opacity:.55}
.pill input[type=text]{width:116px}
.pill:focus-within{outline:3px solid rgba(255,255,255,.75);outline-offset:1px}
.drop{display:inline-flex;align-items:center;border-radius:14px;background:rgba(0,0,0,.2);color:#fff;font-family:var(--font-b);font-weight:800;font-size:14px;text-shadow:none;padding:0;position:relative}
.drop select{appearance:none;-webkit-appearance:none;border:0;background:transparent;color:#fff;font-weight:800;padding:4px 24px 4px 10px;cursor:pointer;outline:0;border-radius:14px;font-family:var(--font-b)}
.drop select option{color:var(--ink);background:#fff}
.drop::after{content:"▾";position:absolute;right:9px;pointer-events:none;font-size:12px}
.drop:focus-within{outline:3px solid rgba(255,255,255,.75);outline-offset:1px}
.static{display:inline-flex;align-items:center;border-radius:14px;padding:2px 9px;font-weight:800;font-size:13px;font-family:var(--font-b);text-shadow:none}
.static.p{background:#fff;color:var(--ink)}
.static.d{background:rgba(0,0,0,.2);color:#fff}
.palette-blk{margin-bottom:10px;cursor:grab}
.palette-blk>.row{cursor:grab}
.palette-blk.c>.foot{height:calc(18px + var(--nh))}

.dz{display:flex;flex-direction:column;min-height:40px;position:relative}
.dz.over{outline:3px dashed var(--purple);outline-offset:-3px;border-radius:12px;background:rgba(124,77,255,.07)}
.dz:empty::before,.dz.empty::before{content:"drop blocks here";display:flex;align-items:center;justify-content:center;min-height:44px;color:#9aa4c7;font-weight:800;font-size:13px;border-radius:10px;border:2px dashed #cfd9f3;margin:4px}
.dropline{height:0;position:relative;z-index:5}
.dropline::after{content:"";position:absolute;left:-2px;right:-2px;top:-3px;height:6px;border-radius:4px;background:var(--purple);box-shadow:0 0 0 2px #fff}
/* ---------- misc ---------- */
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:#2b2f4a;color:#fff;font-family:var(--font-d);padding:10px 18px;border-radius:16px;opacity:0;pointer-events:none;transition:all .25s;z-index:3000;box-shadow:0 8px 20px rgba(0,0,0,.25)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.modalback{position:fixed;inset:0;background:rgba(43,47,74,.5);display:grid;place-items:center;z-index:2000;padding:16px}
.modal{background:#fff;border-radius:22px;width:min(560px,100%);max-height:86vh;overflow:auto;padding:18px 20px;box-shadow:0 20px 50px rgba(0,0,0,.3);border:3px solid var(--line)}
.modal h2{font-family:var(--font-d);font-weight:500;margin:0 0 10px;font-size:22px}
.modal textarea{width:100%;height:120px;border:2px solid var(--line);border-radius:12px;padding:8px;font-family:var(--font-m);font-size:12px}
.saverow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:2px solid var(--line-soft)}
.saverow .who{flex:1;font-weight:800}
.saverow .who small{display:block;font-weight:600;color:var(--ink-soft)}
.conf{position:fixed;z-index:2500;font-size:26px;pointer-events:none;animation:conf 1.1s ease-out forwards}
@keyframes conf{0%{transform:translate(0,0) rotate(0) scale(.6);opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(var(--r)) scale(1.2);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

.homebtn{display:inline-grid;place-items:center;width:42px;height:42px;border-radius:14px;background:rgba(255,255,255,.22);color:#fff;text-decoration:none;font-size:21px;box-shadow:0 3px 0 rgba(0,0,0,.14);transition:transform .12s,background .15s;flex:none}
.homebtn:hover{background:rgba(255,255,255,.36);transform:translateY(-1px)}
.homebtn:focus-visible{outline:3px solid #fff;outline-offset:2px}
a.btn{text-decoration:none}

/* ---------- the step bar ---------- */
.flow{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 18px;background:#fff;border-bottom:2px solid var(--line-soft)}
.fstep{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink-soft);font-family:var(--font-d);font-size:16px;padding:5px 14px 5px 6px;border-radius:999px;border:2px solid var(--line);background:#fff;transition:transform .12s}
.fstep:hover{transform:translateY(-1px)}
.fstep i{width:26px;height:26px;border-radius:50%;background:#e6edfb;display:grid;place-items:center;font-style:normal;font-size:14px;color:var(--ink-soft)}
.fstep small{font-family:var(--font-b);font-weight:800;font-size:11px;background:#fff1c9;color:#7a5b00;border-radius:8px;padding:1px 6px}
.fstep.done{border-color:#9bdca4;background:#effbf1;color:#23702f}
.fstep.done i{background:var(--green);color:#fff}
.fstep.cur{border-color:var(--purple);color:var(--purple);box-shadow:0 0 0 3px rgba(124,77,255,.18);background:#fff}
.fstep.cur i{background:var(--purple);color:#fff}
.fstep.lock{opacity:.55;pointer-events:none}
@media (max-width:760px){.flow{padding:8px 10px}.fstep{font-size:14px}}

/* Echo Lab */
:root{--cs:52px;--fog:#dfe7fb;--floor:#dff5e7;--wall:#1f3a52;--foam:#ffd966}
body{background:var(--bg);margin:0}
.lvls{display:flex;gap:6px;flex-wrap:wrap}
.lvl{border:0;cursor:pointer;width:42px;height:42px;border-radius:14px;background:rgba(255,255,255,.2);color:#fff;font-family:var(--font-d);font-size:18px;display:grid;place-items:center;position:relative}
.lvl:hover{background:rgba(255,255,255,.34)}
.lvl[aria-current="true"]{background:#fff;color:var(--purple);box-shadow:0 4px 0 rgba(0,0,0,.18)}
.lvl.done::after{content:"★";position:absolute;right:-3px;top:-6px;font-size:15px;color:#ffd93b;text-shadow:0 1px 0 rgba(0,0,0,.35)}
.eg{display:grid;grid-template-columns:300px minmax(380px,1fr) 340px;gap:14px;padding:14px 18px 36px;max-width:1500px;margin:0 auto;align-items:start}
@media (max-width:1100px){.eg{grid-template-columns:280px 1fr}.controls{grid-column:1/-1}}
@media (max-width:720px){.eg{grid-template-columns:1fr;padding:10px}}
.card{background:#fff;border:2px solid var(--line);border-radius:20px;padding:14px;box-shadow:0 4px 0 var(--line)}
.mtop{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.num{font-family:var(--font-d);background:var(--purple);color:#fff;border-radius:12px;padding:2px 12px;font-size:16px}
.concept{font-size:12px;font-weight:900;letter-spacing:.06em;text-transform:uppercase;background:#ffefa8;color:#6a5600;border-radius:10px;padding:3px 9px}
.mission h1{font-family:var(--font-d);font-weight:500;font-size:26px;margin:8px 0 4px}
.mission p{margin:6px 0;font-size:15.5px;font-weight:700;color:#38406a}
.worked{background:#eef6ff;border:2px dashed #a9c9ff;border-radius:14px;padding:8px 12px;font-size:14.5px;margin:8px 0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.stat{background:#f4f7ff;border:2px solid var(--line);border-radius:14px;text-align:center;padding:6px 4px}
.stat small{display:block;color:var(--ink-soft);font-weight:800;font-size:11px;text-transform:uppercase;letter-spacing:.05em}
.stat b{font-family:var(--font-d);font-size:22px;font-weight:500}
.stat b.low{color:#d94a63}
.tip{background:#fff3d6;border:2px solid #f5c25a;border-radius:14px;padding:8px 12px}
.legend{display:flex;gap:10px;flex-wrap:wrap;font-size:12.5px;font-weight:800;color:var(--ink-soft);margin-top:10px}
.legend .k{display:inline-block;width:14px;height:14px;border-radius:4px;margin-right:4px;vertical-align:-2px;border:1px solid rgba(0,0,0,.2)}
.k.fog{background:var(--fog)}.k.floor{background:var(--floor)}.k.wall{background:var(--wall)}.k.foam{background:var(--foam)}
.boardwrap{display:grid;place-items:center;padding:6px;background:radial-gradient(#d2dcf3 1.1px,transparent 1.1px) 0 0/22px 22px,#fbfdff;border-radius:16px}
#board{max-width:100%;height:auto;display:block}
.msg{margin-top:10px;min-height:46px;background:#f4f7ff;border:2px solid var(--line);border-radius:14px;padding:8px 12px;font-weight:800;color:#38406a}
.msg.bad{background:#ffe9ee;border-color:#f3a5b6}.msg.good{background:#e2f7e6;border-color:#9fdcab}
.pad{display:grid;gap:10px}
.pad .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn.big{font-size:18px;padding:12px 14px;border-radius:18px;justify-content:center}
.btn.ping{background:#ffbf00;border-color:#d39b00;color:#4a3a00;box-shadow:0 4px 0 #d39b00}
.echo{margin-top:14px;background:#fffbe9;border:3px solid #ffbf00;border-radius:18px;padding:12px;animation:pop .25s}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:none;opacity:1}}
.echoh{font-family:var(--font-d);font-size:18px}
.echot{font-family:var(--font-m);font-weight:700;font-size:30px;margin:6px 0;color:#7a5a00}
.echo label{font-weight:800;font-size:14px}
.ansrow{display:flex;gap:8px;margin:6px 0}
.ansrow input{width:90px;font-size:24px;font-family:var(--font-d);border:3px solid var(--line);border-radius:12px;padding:4px 10px;text-align:center}
.ansrow input.shake{animation:shake .35s;border-color:#f06d8a}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.linkbtn{border:0;background:none;color:var(--purple);font-weight:800;cursor:pointer;padding:2px 0;text-decoration:underline}
.how{background:#fff;border-radius:12px;padding:8px 10px;margin-top:6px;font-size:14px;line-height:1.55}
.how b{font-family:var(--font-m)}
.notebook{margin-top:14px}.notebook h3{font-family:var(--font-d);font-weight:500;margin:0 0 6px;font-size:17px}
.log{max-height:170px;overflow:auto;font-family:var(--font-m);font-size:13px;display:grid;gap:4px}
.log div{background:#f4f7ff;border-radius:8px;padding:3px 8px}.muted{color:var(--ink-soft);font-family:var(--font-b)}
.keys{font-size:12px;color:var(--ink-soft);margin:10px 0 0}
.over{position:fixed;inset:0;background:rgba(43,47,74,.5);display:grid;place-items:center;z-index:50;padding:16px}
.overcard{background:#fff;border-radius:26px;padding:26px 30px;max-width:460px;text-align:center;box-shadow:0 10px 0 rgba(0,0,0,.18);animation:pop .3s}
.overcard h2{font-family:var(--font-d);font-weight:500;font-size:30px;margin:6px 0}
.stars{font-size:46px;letter-spacing:6px;color:#ffbf00;text-shadow:0 3px 0 rgba(0,0,0,.15)}
.stars .off{color:#d3def6}
.orow{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.cell{transition:fill .25s}
.pulse{fill:none;stroke:#ffbf00;stroke-width:4;opacity:0;animation:ring .9s ease-out forwards}
@keyframes ring{from{opacity:.9;transform:scale(.4)}to{opacity:0;transform:scale(2.4)}}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#2b2f4a;color:#fff;border-radius:14px;padding:10px 18px;font-weight:800;opacity:0;pointer-events:none;transition:.25s;z-index:60}
.toast.show{opacity:1;transform:translateX(-50%)}

</style>
</head>
<body>
<header class="topbar">
  <a class="homebtn" href="index.html" title="Back to the Chip Camp welcome screen" aria-label="Home">🏠</a>
  <div class="brand"><span class="logo" aria-hidden="true"><i style="background:#4C97FF"></i><i style="background:#FFAB19"></i><i style="background:#59C059"></i><i style="background:#CF63CF"></i></span>Echo Lab</div>
  <nav class="lvls" id="lvls" aria-label="Levels"></nav>
  <div class="spacer"></div>
  <button class="btn small" id="muteBtn" aria-pressed="false" title="Sound on or off">🔇 Sound off</button>
</header>

<main class="eg">
  <section class="card mission" aria-label="Mission">
    <div class="mtop"><span class="num" id="mNum">1</span><span class="concept" id="mConcept"></span></div>
    <h1 id="mTitle"></h1>
    <p id="mSay"></p>
    <div class="worked" id="mWorked" hidden></div>
    <div class="stats">
      <div class="stat"><small>Pings left</small><b id="sPings"></b></div>
      <div class="stat"><small>Bumps</small><b id="sBumps">0</b></div>
      <div class="stat"><small>Par</small><b id="sPar"></b></div>
    </div>
    <p class="tip" id="mHint" hidden></p>
    <div class="legend"><span><i class="k fog"></i>unknown</span><span><i class="k floor"></i>floor</span><span><i class="k wall"></i>wall</span><span><i class="k foam"></i>foam</span><span>🚩 goal</span></div>
  </section>

  <section class="card boardcard" aria-label="The room">
    <div class="boardwrap"><svg id="board" role="img" aria-label="Map of the room. Most of it is hidden."></svg></div>
    <div class="msg" id="msg" role="status" aria-live="polite"></div>
  </section>

  <section class="card controls" aria-label="Controls">
    <div class="pad">
      <button class="btn big ping" id="pingBtn">📡 Ping</button>
      <div class="row">
        <button class="btn big" id="leftBtn" title="Turn left (←)">⟲ Turn left</button>
        <button class="btn big" id="rightBtn" title="Turn right (→)">Turn right ⟳</button>
      </div>
      <button class="btn big go" id="walkBtn" title="Walk one step (↑)">⬆ Walk 1 step</button>
      <button class="btn small" id="restartBtn">↺ Restart this level</button>
    </div>
    <div class="echo" id="echoBox" hidden>
      <div class="echoh">📡 An echo came back!</div>

  const STEP_CM = 20;      // one step of Chip Bot, and one grid square

  const US_PER_CM = 58;    // sound goes there and back: 58 microseconds for each centimetre of distance

      worked: 'Example: an echo of 3,000 µs. Sound travels there and back, so 3,000 ÷ 58 = about 52 cm. The sensor starts 10 cm from the wall of its own square, so 52 − 10 = 42. One step is 20 cm, so 42 ÷ 20 = about 2 steps.'

      say: 'Every straight stretch of the path is a "leg". A good robot spends about one ping per leg.'
    },
    {
      id: 4, title: 'Foam!', concept: 'Why sensors fail', dir: 1, extra: 4,
      map: ['#########', '#S..~..G#', '#.......#', '#########'],

      map: ['#########', '#S#.....#', '#.#.###.#', '#.#.#G..#', '#.#.#.###', '#...#...#', '#########'],

    {

      map: ['#########', '#S..#...#', '#.#.#.#.#', '#.#...#.#', '#.#####.#', '#......G#', '#########'],

    },
    {

      map: ['#########', '#S......#', '#.#.#.#.#', '#.......#', '#.#.#.#.#', '#......G#', '#########'],

      map: ['#########', '#S...~..#', '#.###.#.#', '#...#.#.#', '#.#.#...#', '#.#....G#', '#########'],

    if (g.status !== 'play') return;
    if (g.pending) { say('Answer the echo first: how many steps? (Or walk or turn to ignore it.)', 'bad'); $('#ans').focus(); return; }
    const r = g.ping();
    if (!r.ok) { say(r.why === 'empty' ? 'No pings left!' : '', 'bad'); return; }
    sPing(); pulse();
    if (!r.echo) { say('Silence… NO echo. A wall always bounces sound back. So something soft is soaking it up. Careful!', 'bad'); renderStats(); renderLog(); afterMove({}); return; }
    say('Echo received. Work out the steps and type the number.'); renderStats(); renderLog(); renderEcho();
  }
  function doAnswer() {
    const p = g.pending; if (!p) return;
    const v = $('#ans').value; if (v === '') { $('#ans').focus(); return; }
    const r = g.answer(v);
    if (r.ok) {
      g.log[g.log.length - 1].steps = r.steps; sOk(); say(r.steps === 0 ? 'A wall right in front. Zero free steps. Turn!' : 'Yes! ' + r.steps + ' free step' + (r.steps === 1 ? '' : 's') + '. The squares light up.', 'good');
      draw(); renderLog(); renderEcho(); renderStats();
    } else {
      sBad(); const a = $('#ans'); a.classList.remove('shake'); void a.offsetWidth; a.classList.add('shake');
      say(g.wrong >= 2 ? 'Not quite. Here is the working:' : 'Not quite. Check the steps: ÷ 58, then − 10, then ÷ 20.', 'bad');
      if (g.wrong >= 2) { const how = $('#how'); how.innerHTML = howText(p.us); how.hidden = false; }
    }
  }
  function doTurn(dir) { if (g.status !== 'play') return; g.turn(dir); say('Chip Bot is now facing ' + NAME[g.d] + '.'); draw(); renderEcho(); }
  function doWalk() {
    if (g.status !== 'play') return;
    const r = g.forward();
    if (!r.moved) {
      sBump(); say(r.bump === '~' ? 'Squish! That is foam. You bumped into it. It is now marked on the map.' : 'Bonk! A wall. It is now marked on the map.', 'bad');
      draw(); renderStats(); renderEcho(); afterMove(r); return;
    }
    say(''); draw(); renderEcho(); afterMove(r);
  }

  function showOver(won) {
    const o = $('#over'); o.hidden = false;
    const st = won ? g.stars() : 0;
    $('#oStars').innerHTML = [1, 2, 3].map((n) => '<span class="' + (n <= st ? '' : 'off') + '">★</span>').join('');
    $('#oTitle').textContent = won ? (st === 3 ? 'Perfect run!' : 'You found the flag!') : 'Out of pings';
    const par = E.par(g.level);
    $('#oText').textContent = won
      ? 'You used ' + g.pingsUsed + ' ping' + (g.pingsUsed === 1 ? '' : 's') + ' and ' + g.bumps + ' bump' + (g.bumps === 1 ? '' : 's') + '. The best possible is ' + par + ' ping' + (par === 1 ? '' : 's') + (st < 3 ? ', with no bumps. Can you beat it?' : '. You matched it.')
      : 'Chip Bot ran out of battery for pings. Think about where each straight stretch ends before you press the button.';
    $('#oNext').textContent = idx < E.LEVELS.length - 1 ? 'Next level ➜' : 'You did them all!';
    $('#oNext').hidden = !won; $('#oNext').disabled = idx >= E.LEVELS.length - 1;
  }
  function win() {
    const st = g.stars(); prog.levels[g.level.id] = Math.max(prog.levels[g.level.id] || 0, st); save(); sWin();
    say('🎉 Chip Bot reached the flag!', 'good'); renderLevels(); setTimeout(() => showOver(true), 450);
  }

  /* ---------- wiring ---------- */
  $('#pingBtn').onclick = doPing; $('#walkBtn').onclick = doWalk; $('#leftBtn').onclick = () => doTurn('left'); $('#rightBtn').onclick = () => doTurn('right');
  $('#ansBtn').onclick = doAnswer; $('#ans').onkeydown = (e) => { if (e.key === 'Enter') { e.preventDefault(); doAnswer(); } };
  $('#helpBtn').onclick = () => { if (!g.pending) return; const how = $('#how'); how.innerHTML = howText(g.pending.us); how.hidden = false; helped = true; };
  $('#oAgain').onclick = () => start(idx); $('#restartBtn').onclick = () => start(idx);
  $('#oNext').onclick = () => { if (idx < E.LEVELS.length - 1) start(idx + 1); };
  $('#muteBtn').onclick = () => setMute(!prog.muted);
  document.addEventListener('keydown', (e) => {
    if (e.target && e.target.tagName === 'INPUT') return;
    if (!$('#over').hidden) return;
    if (e.key === 'p' || e.key === 'P') doPing();
    else if (e.key === 'ArrowLeft') { e.preventDefault(); doTurn('left'); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); doTurn('right'); }
    else if (e.key === 'ArrowUp') { e.preventDefault(); doWalk(); }
  });

  setMute(prog.muted !== false);
  let first = 0; while (first < E.LEVELS.length - 1 && prog.levels[E.LEVELS[first].id]) first++;
  start(first);
  window.__echo = { get g() { return g; }, start, doPing, doAnswer, doWalk, doTurn };
})();

</script>
</body>
</html>
