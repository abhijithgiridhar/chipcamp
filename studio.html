<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Studio · Chip Camp</title>
<style>
@import url("https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Nunito:wght@600;800;900&family=JetBrains+Mono:wght@400;700&display=swap");
:root{
  --ink:#2b2f4a; --ink-soft:#69709a; --bg:#e8f0ff; --card:#ffffff; --line:#d3def6; --line-soft:#e6edfb;
  --purple:#7c4dff; --blue:#4c97ff; --green:#3fb950; --green-d:#2c8f3b; --events:#FFBF00;
  --font-d:"Fredoka","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --font-b:"Nunito","Segoe UI","Trebuchet MS",system-ui,sans-serif;
  --font-m:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --nh:6px; --nx:16px; --nw:26px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-b);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
[hidden]{display:none!important}

/* ---------- top bar ---------- */
.topbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 18px;background:linear-gradient(90deg,#7c4dff,#4c97ff);color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.12);}
.brand{font-family:var(--font-d);font-size:24px;font-weight:600;letter-spacing:.2px;display:flex;align-items:center;gap:8px;margin-right:6px}
.brand .logo{display:inline-grid;grid-template-columns:repeat(2,12px);gap:3px;transform:rotate(-8deg)}
.brand .logo i{width:12px;height:12px;border-radius:4px;display:block}
.ptabs{display:flex;gap:8px;flex-wrap:wrap}
.ptab{border:0;cursor:pointer;font-family:var(--font-d);font-size:17px;font-weight:500;padding:8px 16px;border-radius:16px;background:rgba(255,255,255,.2);color:#fff;display:flex;align-items:center;gap:7px;transition:transform .12s, background .15s;}
.ptab:hover{background:rgba(255,255,255,.32);transform:translateY(-1px)}
.ptab[aria-selected="true"]{background:#fff;color:var(--pc);box-shadow:0 4px 0 rgba(0,0,0,.18);transform:translateY(-1px)}
.ptab .em{font-size:20px}
.spacer{flex:1}
.viewtabs{display:flex;background:rgba(0,0,0,.18);border-radius:18px;padding:4px;gap:4px}
.vtab{border:0;cursor:pointer;font-family:var(--font-d);font-size:17px;padding:8px 18px;border-radius:14px;background:transparent;color:#fff;display:flex;align-items:center;gap:6px}
.vtab[aria-selected="true"]{background:#fff;color:var(--purple);box-shadow:0 3px 0 rgba(0,0,0,.18)}

.btn{border:0;cursor:pointer;font-family:var(--font-d);font-weight:500;font-size:15px;padding:8px 14px;border-radius:14px;background:#fff;color:var(--ink);box-shadow:0 3px 0 #c9d6f2;border:2px solid #d3def6;display:inline-flex;align-items:center;gap:6px;transition:transform .08s, box-shadow .08s;white-space:nowrap}
.btn:hover{transform:translateY(-1px);box-shadow:0 4px 0 #c9d6f2}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #c9d6f2}
.btn.go{background:var(--green);border-color:var(--green-d);color:#fff;box-shadow:0 4px 0 var(--green-d)}
.btn.go:hover{box-shadow:0 5px 0 var(--green-d)}
.btn.go:active{box-shadow:0 1px 0 var(--green-d)}
.btn.stop{background:#ff6680;border-color:#d94a63;color:#fff;box-shadow:0 4px 0 #d94a63}
.btn.big{font-size:19px;padding:12px 22px;border-radius:18px}
.btn.small{font-size:13px;padding:5px 10px;border-radius:11px}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* ---------- blocks ---------- */
.blk{--c:#9966FF;position:relative;filter:drop-shadow(0 2px 0 rgba(0,0,0,.2));user-select:none;touch-action:none}
.dz>.blk+.blk,.blk+.blk{margin-top:calc(var(--nh) * -1)}
.blk>.row,.blk>.foot{background:var(--c);color:#fff;font-family:var(--font-d);font-weight:500;font-size:15px;text-shadow:0 1px 0 rgba(0,0,0,.18)}
.blk>.row{display:flex;align-items:center;flex-wrap:wrap;gap:6px;min-height:46px;padding:8px 10px calc(8px + var(--nh)) 12px;
  clip-path:polygon(0 0,var(--nx) 0,calc(var(--nx) + 4px) var(--nh),calc(var(--nx) + var(--nw) - 4px) var(--nh),calc(var(--nx) + var(--nw)) 0,100% 0,100% calc(100% - var(--nh)),calc(var(--nx) + var(--nw)) calc(100% - var(--nh)),calc(var(--nx) + var(--nw) - 4px) 100%,calc(var(--nx) + 4px) 100%,var(--nx) calc(100% - var(--nh)),0 calc(100% - var(--nh)));
  cursor:grab}
.blk.c>.row{clip-path:polygon(0 0,var(--nx) 0,calc(var(--nx) + 4px) var(--nh),calc(var(--nx) + var(--nw) - 4px) var(--nh),calc(var(--nx) + var(--nw)) 0,100% 0,100% 100%,0 100%);padding-bottom:8px;border-radius:12px 12px 0 0}
.blk.c>.row.else{clip-path:none;border-radius:0;min-height:34px;padding-top:6px;padding-bottom:6px}
.blk:not(.c)>.row{border-radius:12px 12px 12px 12px}
.blk>.foot{height:calc(26px + var(--nh));border-radius:0 0 12px 12px;display:flex;align-items:center;padding:0 12px var(--nh) 12px;gap:8px;
  clip-path:polygon(0 0,100% 0,100% calc(100% - var(--nh)),calc(var(--nx) + var(--nw)) calc(100% - var(--nh)),calc(var(--nx) + var(--nw) - 4px) 100%,calc(var(--nx) + 4px) 100%,var(--nx) calc(100% - var(--nh)),0 calc(100% - var(--nh)))}
.cslot{display:flex;background:var(--c)}
.cslot::before{content:"";width:16px;flex:none;background:var(--c)}
.cslot>.dz{flex:1;background:#f7f9ff;border-radius:10px 0 0 10px;min-height:44px;margin:0;box-shadow:inset 0 3px 0 rgba(0,0,0,.08)}
.blk .x{margin-left:auto;border:0;background:rgba(255,255,255,.28);color:#fff;width:22px;height:22px;border-radius:50%;cursor:pointer;font-size:12px;line-height:1;padding:0;opacity:.0;transition:opacity .12s}
.blk:hover>.row .x,.blk>.row .x:focus-visible{opacity:1}
.blk .x:hover{background:rgba(255,255,255,.5)}
.blk .tag{font-size:11px;font-weight:700;background:rgba(0,0,0,.16);border-radius:10px;padding:2px 8px;font-family:var(--font-b);text-shadow:none}
.elsebtn{border:0;cursor:pointer;background:rgba(255,255,255,.28);color:#fff;font-family:var(--font-d);font-size:13px;border-radius:10px;padding:3px 10px}
.elsebtn:hover{background:rgba(255,255,255,.45)}
.blk.running>.row,.blk.running>.foot{animation:glow .6s ease-in-out infinite alternate}
@keyframes glow{from{filter:brightness(1)}to{filter:brightness(1.35) saturate(1.2)}}
.blk.pop{animation:pop .38s cubic-bezier(.3,1.7,.5,1)}
@keyframes pop{0%{transform:scale(.6) rotate(-4deg);opacity:.2}100%{transform:scale(1) rotate(0);opacity:1}}
.blk.lifting{opacity:.3}
.ghost{position:fixed;z-index:1000;pointer-events:none;transform:rotate(2deg) scale(1.04);filter:drop-shadow(0 10px 12px rgba(40,40,80,.35));opacity:.96}
.ghost .x{display:none}

/* parameter fields (Scratch style) */
.pill{display:inline-flex;align-items:center;border-radius:16px;background:#fff;color:var(--ink);text-shadow:none;font-family:var(--font-b);font-weight:800;font-size:14px;padding:0;overflow:hidden;box-shadow:inset 0 -2px 0 rgba(0,0,0,.1)}
.pill input{border:0;background:transparent;outline:0;font-weight:800;color:var(--ink);padding:3px 9px;min-width:0;text-align:center;font-family:var(--font-b)}
.pill input[type=number]{width:58px;-moz-appearance:textfield}
.pill input[type=number]::-webkit-outer-spin-button,.pill input[type=number]::-webkit-inner-spin-button{opacity:.55}
.pill input[type=text]{width:116px}
.pill:focus-within{outline:3px solid rgba(255,255,255,.75);outline-offset:1px}
.drop{display:inline-flex;align-items:center;border-radius:14px;background:rgba(0,0,0,.2);color:#fff;font-family:var(--font-b);font-weight:800;font-size:14px;text-shadow:none;padding:0;position:relative}
.drop select{appearance:none;-webkit-appearance:none;border:0;background:transparent;color:#fff;font-weight:800;padding:4px 24px 4px 10px;cursor:pointer;outline:0;border-radius:14px;font-family:var(--font-b)}
.drop select option{color:var(--ink);background:#fff}
.drop::after{content:"▾";position:absolute;right:9px;pointer-events:none;font-size:12px}
.drop:focus-within{outline:3px solid rgba(255,255,255,.75);outline-offset:1px}
.static{display:inline-flex;align-items:center;border-radius:14px;padding:2px 9px;font-weight:800;font-size:13px;font-family:var(--font-b);text-shadow:none}
.static.p{background:#fff;color:var(--ink)}
.static.d{background:rgba(0,0,0,.2);color:#fff}
.palette-blk{margin-bottom:10px;cursor:grab}
.palette-blk>.row{cursor:grab}
.palette-blk.c>.foot{height:calc(18px + var(--nh))}

.dz{display:flex;flex-direction:column;min-height:40px;position:relative}
.dz.over{outline:3px dashed var(--purple);outline-offset:-3px;border-radius:12px;background:rgba(124,77,255,.07)}
.dz:empty::before,.dz.empty::before{content:"drop blocks here";display:flex;align-items:center;justify-content:center;min-height:44px;color:#9aa4c7;font-weight:800;font-size:13px;border-radius:10px;border:2px dashed #cfd9f3;margin:4px}
.dropline{height:0;position:relative;z-index:5}
.dropline::after{content:"";position:absolute;left:-2px;right:-2px;top:-3px;height:6px;border-radius:4px;background:var(--purple);box-shadow:0 0 0 2px #fff}
/* ---------- misc ---------- */
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:#2b2f4a;color:#fff;font-family:var(--font-d);padding:10px 18px;border-radius:16px;opacity:0;pointer-events:none;transition:all .25s;z-index:3000;box-shadow:0 8px 20px rgba(0,0,0,.25)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.modalback{position:fixed;inset:0;background:rgba(43,47,74,.5);display:grid;place-items:center;z-index:2000;padding:16px}
.modal{background:#fff;border-radius:22px;width:min(560px,100%);max-height:86vh;overflow:auto;padding:18px 20px;box-shadow:0 20px 50px rgba(0,0,0,.3);border:3px solid var(--line)}
.modal h2{font-family:var(--font-d);font-weight:500;margin:0 0 10px;font-size:22px}
.modal textarea{width:100%;height:120px;border:2px solid var(--line);border-radius:12px;padding:8px;font-family:var(--font-m);font-size:12px}
.saverow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:2px solid var(--line-soft)}
.saverow .who{flex:1;font-weight:800}
.saverow .who small{display:block;font-weight:600;color:var(--ink-soft)}
.conf{position:fixed;z-index:2500;font-size:26px;pointer-events:none;animation:conf 1.1s ease-out forwards}
@keyframes conf{0%{transform:translate(0,0) rotate(0) scale(.6);opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(var(--r)) scale(1.2);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

.homebtn{display:inline-grid;place-items:center;width:42px;height:42px;border-radius:14px;background:rgba(255,255,255,.22);color:#fff;text-decoration:none;font-size:21px;box-shadow:0 3px 0 rgba(0,0,0,.14);transition:transform .12s,background .15s;flex:none}
.homebtn:hover{background:rgba(255,255,255,.36);transform:translateY(-1px)}
.homebtn:focus-visible{outline:3px solid #fff;outline-offset:2px}
a.btn{text-decoration:none}

/* ---------- stage ---------- */
.stagecard{overflow:hidden;position:sticky;top:12px}
.stagehead{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:2px solid var(--line-soft);background:#f6f9ff;flex-wrap:wrap}
.stagehead h2{font-family:var(--font-d);font-size:17px;font-weight:500;margin:0;margin-right:auto}
.speedsel{display:flex;border-radius:12px;overflow:hidden;border:2px solid var(--line)}
.speedsel button{border:0;background:#fff;padding:3px 9px;font-weight:800;font-size:12px;cursor:pointer;color:var(--ink-soft)}
.speedsel button[aria-pressed="true"]{background:var(--purple);color:#fff}
.scene{position:relative;overflow:hidden}
.sliders{padding:10px 14px;display:flex;flex-direction:column;gap:8px;border-top:2px solid var(--line-soft)}
.slider{display:grid;grid-template-columns:1fr auto;gap:2px 8px;font-weight:800;font-size:13px}
.slider input{grid-column:1/-1;accent-color:var(--purple);width:100%}
.slider output{font-family:var(--font-m);color:var(--purple);grid-row:1;grid-column:2}
.serial{margin:0 14px 14px;border:2px dashed var(--line);border-radius:14px;background:#fcfdff;font-family:var(--font-m);font-size:12px;padding:8px 10px;height:94px;overflow:auto;color:#3d4668}
.serial b{font-family:var(--font-b);color:var(--ink-soft);font-size:11px;text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:3px}
.serial div{white-space:pre-wrap}
.notes{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.fnote{position:absolute;bottom:26%;font-size:30px;font-weight:900;animation:floatup 1.3s ease-out forwards;text-shadow:0 2px 0 rgba(255,255,255,.7)}
@keyframes floatup{0%{transform:translateY(0) scale(.6);opacity:0}15%{opacity:1}100%{transform:translateY(-130px) scale(1.15) rotate(12deg);opacity:0}}

/* Peeko */
.pk-scene{position:relative;height:292px;display:grid;place-items:end center;background:linear-gradient(#ffe9d6,#ffd1e0);padding-bottom:26px}
.pk-bot{--tilt:0deg;transform:rotate(var(--tilt));transform-origin:50% 100%;transition:transform .22s cubic-bezier(.3,1.5,.5,1)}
.pk-antenna{width:8px;height:30px;background:#d94c40;margin:0 auto -2px;border-radius:4px;position:relative}
.pk-antenna::after{content:"";position:absolute;top:-12px;left:-8px;width:24px;height:24px;border-radius:50%;background:#ffd93b;border:4px solid #e0a800}
.pk-head{width:262px;height:176px;border-radius:58px;background:linear-gradient(#ff8c80,#ff6b5e);border:7px solid #d94c40;box-shadow:0 8px 0 #b73c32,0 18px 24px rgba(120,40,40,.25);display:grid;place-items:center}
.pk-screen{width:210px;height:106px;border-radius:20px;background:#050b14;border:6px solid #1b2236;overflow:hidden;box-shadow:inset 0 0 18px rgba(130,200,255,.18)}
.pk-screen canvas{width:100%;height:100%;display:block}

/* Chip Bot */
.cb-scene{--T:1s;position:relative;height:292px;background:linear-gradient(#bfe6ff,#e9f8ff 70%)}
.cb-sun{position:absolute;right:26px;top:22px;width:54px;height:54px;border-radius:50%;background:#ffd93b;box-shadow:0 0 0 10px rgba(255,217,59,.3)}
.cb-ground{position:absolute;left:0;right:0;bottom:0;height:76px;background:#7bd389;border-top:6px solid #5cbf6e;overflow:hidden}
.cb-track{position:absolute;inset:auto 0 18px 0;height:8px;background:repeating-linear-gradient(90deg,#fff 0 28px,transparent 28px 60px);opacity:.85;background-size:60px 8px}
.moving-f .cb-track{animation:trackf var(--T) linear infinite}
.moving-b .cb-track{animation:trackb var(--T) linear infinite}
@keyframes trackf{to{background-position:-60px 0}}
@keyframes trackb{to{background-position:60px 0}}
.cb-obstacle{position:absolute;bottom:70px;font-size:50px;transition:left .35s ease;transform:translateX(-50%)}
.cb-bot{position:absolute;left:17%;bottom:58px;width:92px;display:flex;flex-direction:column;align-items:center;transform-origin:50% 100%}
.cb-body{width:88px;height:78px;border-radius:26px;background:linear-gradient(#3fd0bf,#2bb3a3);border:5px solid #1e8e80;box-shadow:0 5px 0 #17756a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.cb-eyes{display:flex;gap:14px}
.cb-eyes i{width:22px;height:22px;border-radius:50%;background:#fff;border:3px solid #17756a;display:block;position:relative}
.cb-eyes i::after{content:"";position:absolute;width:8px;height:8px;border-radius:50%;background:#17302d;left:5px;top:5px}
.cb-mouth{width:26px;height:8px;border-radius:0 0 14px 14px;border:3px solid #17756a;border-top:0}
.cb-legs{display:flex;gap:18px;margin-top:-2px}
.cb-leg{width:20px;height:26px;border-radius:8px 8px 12px 12px;background:#1e8e80;display:block;transform-origin:50% 0}
.walking .cb-leg.l{animation:legL var(--T) ease-in-out infinite}
.walking .cb-leg.r{animation:legR var(--T) ease-in-out infinite}
.moving-b .walking .cb-leg.l{animation-direction:reverse}
@keyframes legL{0%,100%{transform:rotate(22deg)}50%{transform:rotate(-22deg)}}
@keyframes legR{0%,100%{transform:rotate(-22deg)}50%{transform:rotate(22deg)}}
.walking .cb-body{animation:bob calc(var(--T) / 2) ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.turn-l{animation:turnl var(--T) ease-in-out infinite}
.turn-r{animation:turnr var(--T) ease-in-out infinite}
@keyframes turnl{0%,100%{transform:rotate(0)}50%{transform:rotate(-14deg) scaleX(.82)}}
@keyframes turnr{0%,100%{transform:rotate(0)}50%{transform:rotate(14deg) scaleX(.82)}}
.dancing .cb-body{animation:dance0 var(--T) ease-in-out infinite}
.dancing.dance-1 .cb-body{animation-name:dance1}
.dancing.dance-2 .cb-body{animation-name:dance2}
.dancing.dance-3 .cb-body{animation-name:dance3}
.dancing .cb-leg.l{animation:legL calc(var(--T) / 2) ease-in-out infinite}
.dancing .cb-leg.r{animation:legR calc(var(--T) / 2) ease-in-out infinite}
@keyframes dance0{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
@keyframes dance1{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
@keyframes dance2{0%,100%{transform:rotate(-10deg) translateX(-6px)}50%{transform:rotate(10deg) translateX(6px)}}
@keyframes dance3{0%,100%{transform:scale(1)}25%{transform:scale(1.08,.92)}75%{transform:scale(.94,1.06)}}
.cb-dist{position:absolute;left:12px;top:12px;background:#fff;border:2px solid #cfe6f7;border-radius:14px;padding:3px 10px;font-weight:800;font-size:13px}

/* Jarvis */
.jv-scene{position:relative;height:292px;background:linear-gradient(#d9f4ff,#fff6d6)}
.jv-scene svg{width:100%;height:100%;display:block}
.jv-scene .plant{transition:transform .5s ease}
.jv-scene .soil{transition:fill .5s ease}
.jv-scene .jv-sun{transition:opacity .4s, transform .4s}

/* Face / Dance / Light Studio */
.card{background:var(--card);border:2px solid var(--line);border-radius:20px;box-shadow:0 4px 0 var(--line)}
.studio{display:grid;grid-template-columns:minmax(420px,1fr) 372px;gap:14px;padding:14px 18px 40px;align-items:start;max-width:1500px;margin:0 auto}
@media (max-width:1000px){.studio{grid-template-columns:1fr}.stagecard{position:static}}
@media (max-width:760px){.studio{padding:10px}}
.edcard{padding:16px 16px 18px}
.edhead h1{font-family:var(--font-d);font-weight:500;font-size:26px;margin:0}
.edhead p{margin:4px 0 14px;font-weight:700;color:#38406a;font-size:15.5px}
.cta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:16px}
.cta .note{color:var(--ink-soft);font-weight:800;font-size:13px}

/* one card per moment / move / rule */
.stack{display:flex;flex-direction:column;gap:12px}
.mom{--c:#9966FF;background:#fbfaff;border:3px solid var(--c);border-radius:18px;overflow:hidden;box-shadow:0 3px 0 rgba(0,0,0,.08)}
.momhead{display:flex;align-items:center;gap:8px;background:var(--c);color:#fff;font-family:var(--font-d);font-weight:500;padding:6px 8px 6px 10px;text-shadow:0 1px 0 rgba(0,0,0,.18)}
.momhead .num{background:#fff;color:var(--c);border-radius:11px;min-width:26px;text-align:center;padding:0 7px;font-size:15px;text-shadow:none}
.momhead .sp{flex:1}
.momhead button{border:0;cursor:pointer;background:rgba(255,255,255,.28);color:#fff;border-radius:10px;padding:2px 9px;font-family:var(--font-d);font-size:14px;line-height:1.5}
.momhead button:hover:not(:disabled){background:rgba(255,255,255,.5)}
.momhead button:disabled{opacity:.35;cursor:default}
.mombody{padding:10px 12px 12px;display:flex;flex-direction:column;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{border:3px solid var(--line);background:#fff;border-radius:16px;cursor:pointer;padding:5px 11px;font-family:var(--font-d);font-size:15px;display:inline-flex;align-items:center;gap:6px;transition:transform .08s}
.chip:hover{transform:translateY(-1px);border-color:var(--c)}
.chip[aria-pressed="true"]{background:var(--c);border-color:var(--c);color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.18);transform:translateY(-1px)}
.chip .e{font-size:20px;line-height:1}
.swatch{width:46px;height:46px;border-radius:50%;padding:0;border:4px solid #fff;box-shadow:0 0 0 3px var(--line),0 3px 0 rgba(0,0,0,.15);cursor:pointer;position:relative}
.swatch[aria-pressed="true"]{box-shadow:0 0 0 4px var(--c),0 3px 0 rgba(0,0,0,.2);transform:scale(1.1)}
.swatch.off{background-image:repeating-linear-gradient(45deg,#6b7280 0 6px,#59606e 6px 12px)}
.swatches{display:flex;flex-wrap:wrap;gap:12px;align-items:center}

<script>
/* Chip Camp: what each student has chosen and finished, shared by every page (kept in this browser only). */
(function (root) {
  'use strict';
  const KEY = 'chipcamp.v1';
  const ROBOTS = ['chipbot', 'peeko', 'jarvis'];
  function read() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } }
  function write(d) { try { localStorage.setItem(KEY, JSON.stringify(d)); } catch (e) { /* private window: just don't remember */ } }
  function clean(s) { return String(s == null ? '' : s).replace(/[^A-Za-z0-9 .,!?'_-]/g, '').replace(/\s+/g, ' ').trim().slice(0, 16); }

  root.ChipCamp = {
    ROBOTS,
    get() {
      const d = read();
      return { name: clean(d.name), robot: ROBOTS.indexOf(d.robot) >= 0 ? d.robot : null, levels: d.levels || {}, circuits: d.circuits || {}, code: d.code || {} };
    },
    design(robot) { const d = read(); return (d.designs && d.designs[robot]) || null; },
    setDesign(robot, design) { if (ROBOTS.indexOf(robot) < 0) return; const d = read(); d.designs = d.designs || {}; d.designs[robot] = design; write(d); },
    day2() { return !!read().day2; },
    setDay2(on) { const d = read(); d.day2 = !!on; write(d); },
    robotOrDefault() { return this.get().robot || 'chipbot'; },
    setName(n) { const d = read(); d.name = clean(n); write(d); },
    setRobot(r) { if (ROBOTS.indexOf(r) < 0) return; const d = read(); d.robot = r; write(d); },
    levelDone(level, stars) { const d = read(); d.levels = d.levels || {}; d.levels[level] = Math.max(d.levels[level] || 0, stars || 1); write(d); },
    circuitDone(robot) { const d = read(); d.circuits = d.circuits || {}; d.circuits[robot] = true; write(d); },
    codeBlocks(robot, n) { const d = read(); d.code = d.code || {}; d.code[robot] = n; write(d); },
    levelsCompleted() { const l = this.get().levels; return Object.keys(l).filter((k) => l[k] > 0).length; }
  };

  // the home button on every page goes back to the student's robot page
  if (typeof document !== 'undefined') {
    document.addEventListener('DOMContentLoaded', function () {
      var r = root.ChipCamp.get().robot, b = document.querySelector('.homebtn');
      if (b && r) b.setAttribute('href', 'index.html#' + r);
    });
  }
})(typeof self !== 'undefined' ? self : this);

</script>
<script>
/* Code Builder core: block definitions and the sketch generator.
   The base sketches are in ../firmware/*.base.ino. This file only fills in the student parts. */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory(require('fs'), require('path'));
  else root.CampCore = factory(null, null);
})(typeof self !== 'undefined' ? self : this, function (fs, path) {
  'use strict';

  const MARK_S = '', MARK_E = '';           // wraps every value a student chose
  const V = (x) => MARK_S + x + MARK_E;
  const stripMarks = (s) => s.split(MARK_S).join('').split(MARK_E).join('');

  const TEMPLATES = (typeof CAMP_TEMPLATES !== 'undefined') ? CAMP_TEMPLATES : (function () {
    const out = {};
    if (!fs) return out;   // pages that never generate code (the Studio) don't carry the base sketches
    ['peeko', 'chipbot', 'jarvis'].forEach(function (id) {
      out[id] = fs.readFileSync(path.join(__dirname, '..', 'firmware', id + '.base.ino'), 'utf8');
    });
    return out;
  })();

  /* ---------- parameter helpers ---------- */
  const num = (id, d, min, max, step) => ({ id, t: 'num', d, min, max, step });
  const choice = (id, d, opts) => ({ id, t: 'choice', d, opts });
  const text = (id, d, max) => ({ id, t: 'text', d, max });

  function cleanText(s, max, fallback) {
    let t = String(s == null ? '' : s).replace(/[^A-Za-z0-9 .,!?'_-]/g, '').replace(/\s+/g, ' ').trim();
    if (max) t = t.slice(0, max).trim();
    return t || fallback || '';
  }
  function norm(def, p) {
    const o = {};
    def.params.forEach(function (prm) {
      let v = p ? p[prm.id] : undefined;
      if (prm.t === 'num') {
        v = Number(v);
        if (!isFinite(v)) v = prm.d;
        v = Math.min(prm.max, Math.max(prm.min, v));
        if (prm.step) v = Math.round(v / prm.step) * prm.step;
        v = Math.round(v * 1000) / 1000;
      } else if (prm.t === 'choice') {
        if (!prm.opts.some((x) => x[0] === v)) v = prm.d;
      } else if (prm.t === 'text') {
        v = cleanText(v, prm.max, prm.d);
      }
      o[prm.id] = v;
    });
    return o;
  }
  const fmtF = (n) => { const s = String(Math.round(n * 100) / 100); return s.indexOf('.') >= 0 ? s : s + '.0'; };
  const optLabel = (prm, v) => { const o = prm.opts.find((x) => x[0] === v); return o ? o[1] : v; };
  const LOOP_VARS = ['i', 'j', 'k', 'm', 'n'];

  function B(type, cat, parts, extra) {
    const def = Object.assign({ type, cat, shape: 'stack', parts }, extra);
    def.params = parts.filter((x) => typeof x === 'object');
    return def;
  }

  /* ---------- shared blocks ---------- */
  const NOTES = [['C', 'C', 262], ['D', 'D', 294], ['E', 'E', 330], ['F', 'F', 349], ['G', 'G', 392], ['A', 'A', 440], ['B', 'B', 494], ['C2', 'high C', 523]];
  const noteHz = (n) => (NOTES.find((x) => x[0] === n) || NOTES[0])[2];
  const noteName = (n) => (NOTES.find((x) => x[0] === n) || NOTES[0])[1];

  const WAIT = B('wait', 'control', ['wait ', num('secs', 1, 0.1, 30, 0.1), ' seconds'], {
    code: (p) => ['waitSecs(' + V(fmtF(p.secs)) + ');']
  });
  const REPEAT = B('repeat', 'control', ['repeat ', num('times', 3, 1, 20, 1), ' times'], {
    shape: 'c',
    head: (p, c) => 'for (int ' + c.v + ' = 0; ' + c.v + ' < ' + V(p.times) + '; ' + c.v + '++) {'
  });
  const noteBlock = (fn, who) => B('note', 'sound', [who, choice('note', 'C', NOTES.map((n) => [n[0], n[1]])), ' for ', num('secs', 0.3, 0.1, 3, 0.1), ' seconds'], {
    code: (p) => [fn + '(' + noteHz(p.note) + ', ' + V(fmtF(p.secs)) + ');  // ' + V(noteName(p.note))]
  });
  // flash = true when the name constants live in PROGMEM (Peeko), which needs the cast to print
  const helloBlock = (cat, flash) => {
    const nm = (x) => (flash ? '(const __FlashStringHelper*)' + x : x);
    return B('hello', cat, ['say hello in the Serial Monitor'], {
      code: () => ['Serial.print(F("Hi! I\'m "));', 'Serial.print(' + nm('ROBOT_NAME') + ');', 'Serial.print(F(", built by "));', 'Serial.println(' + nm('BUILDER_NAME') + ');']
    });
  };

  /* ---------- the three projects ---------- */
  const PROJECTS = {
    peeko: {
      id: 'peeko', name: 'Peeko', emoji: '👀', color: '#ff6b5e',
      tagline: 'The robot with expressive eyes',
      robotLabel: "Peeko's name", robotDefault: 'Peeko',
      foldBlurb: 'faces, sounds, head moves and listening to the computer',
      cats: [
        { id: 'looks', label: 'Looks', color: '#9966FF' },
        { id: 'sound', label: 'Sound', color: '#CF63CF' },
        { id: 'control', label: 'Control', color: '#FFAB19' },
        { id: 'chance', label: 'Chance', color: '#59C059' }
      ],
      blocks: [
        B('act', 'looks', ['Peeko feels ', choice('face', 'happy', [['happy', '😊 happy'], ['sad', '😢 sad'], ['surprised', '😲 surprised'], ['angry', '😠 angry'], ['sleepy', '😴 sleepy'], ['neutral', '😐 neutral'], ['celebrate', '🎉 celebrate']])], {
          code: (p) => ['runCommand(F("' + V(p.face) + '"));']
        }),
        B('look', 'looks', ['Peeko looks ', choice('dir', 'left', [['left', '⬅️ left'], ['right', '➡️ right']])], {
          code: (p) => ['runCommand(F("' + V(p.dir) + '"));']
        }),
        B('say_name', 'looks', ['say ', choice('who', 'robot', [['robot', "my robot's name"], ['me', 'my name']]), ' for ', num('secs', 2, 0.5, 10, 0.5), ' seconds'], {
          code: (p) => ['sayText(' + V(p.who === 'robot' ? 'ROBOT_NAME' : 'BUILDER_NAME') + ', ' + V(fmtF(p.secs)) + ');']
        }),
        B('say_text', 'looks', ['write ', text('words', 'Hello!', 20), ' for ', num('secs', 2, 0.5, 10, 0.5), ' seconds'], {
          code: (p) => ['sayText(PSTR("' + V(p.words) + '"), ' + V(fmtF(p.secs)) + ');']
        }),
        B('head', 'looks', ['turn head to ', num('deg', 90, 40, 140, 5), ' degrees'], {
          code: (p) => ['headServo.write(' + V(p.deg) + ');']
        }),
        noteBlock('playNote', 'play note '),
        helloBlock('looks', true),
        WAIT, REPEAT,
        B('if_coin', 'chance', ['if coin flip lands ', choice('side', 'heads', [['heads', 'heads'], ['tails', 'tails']])], {
          shape: 'c', canElse: true,
          head: (p) => 'if (random(2) == ' + V(p.side === 'heads' ? 0 : 1) + ') {'
        }),
        B('if_dice', 'chance', ['if dice roll is ', choice('cmp', 'more', [['more', 'more than'], ['less', 'less than'], ['exactly', 'exactly']]), ' ', num('n', 3, 1, 6, 1)], {
          shape: 'c', canElse: true,
          head: (p) => 'if (random(1, 7) ' + V(p.cmp === 'more' ? '>' : p.cmp === 'less' ? '<' : '==') + ' ' + V(p.n) + ') {'
        })
      ],
      story: [
        { id: 'name', title: 'Name it', say: 'Every robot needs a name! Type yours in the name tag, and watch it appear in the code.', done: (s) => !!s.robot.trim() },
        { id: 'wake', title: 'Wake up', say: 'What is the very first thing Peeko does when it switches on? Put it under "when Peeko wakes up". This runs once.', done: (s) => s.wake.length > 0 },
        { id: 'forever', title: 'Forever', say: 'Robots keep going. Everything inside "forever" runs again and again. What should Peeko keep doing?', done: (s) => s.forever.length > 0 },
        { id: 'wait', title: 'Add time', say: 'Without waiting, Peeko would flicker through everything instantly. Add a wait so we can see each thing.', done: (s) => countType(s, 'wait') > 0 },
        { id: 'choice', title: 'Make a choice', say: 'Robots decide! Flip a coin: heads Peeko is happy, tails Peeko is sad. That is an "if / else".', done: (s) => countType(s, /^if_/) > 0 },
        { id: 'repeat', title: 'Repeat', say: 'Want Peeko to do something 3 times? Use "repeat" instead of copying blocks.', done: (s) => countType(s, 'repeat') > 0 }
      ],
      example: function (n) {
        return {
          wake: [n('say_name', { who: 'robot', secs: 2 }), n('act', { face: 'happy' })],
          forever: [
            n('if_coin', { side: 'heads' }, [n('act', { face: 'happy' }), n('repeat', { times: 2 }, [n('note', { note: 'E', secs: 0.2 }), n('note', { note: 'G', secs: 0.2 })])], [n('act', { face: 'sad' })]),
            n('wait', { secs: 3 })
          ]
        };
      }
    },

    chipbot: {
      id: 'chipbot', name: 'Chip Bot', emoji: '🤖', color: '#2bb3a3',
      tagline: 'The walking, dancing biped',
      robotLabel: "Chip Bot's name", robotDefault: 'Chip Bot',
      foldBlurb: 'walking, turning, dancing, servo control and the distance sensor',
      cats: [
        { id: 'motion', label: 'Motion', color: '#4C97FF' },
        { id: 'sound', label: 'Sound', color: '#CF63CF' },
        { id: 'talk', label: 'Talk', color: '#9966FF' },
        { id: 'control', label: 'Control', color: '#FFAB19' },
        { id: 'sensing', label: 'Sensing', color: '#3FB8DE' }
      ],
      blocks: [
        B('walk', 'motion', ['walk ', choice('dir', 'fwd', [['fwd', 'forward'], ['back', 'backward']]), ' ', num('steps', 4, 1, 10, 1), ' steps'], {
          code: (p) => ['doWalk(' + V(p.dir === 'fwd' ? 0 : 1) + ', ' + V(p.steps) + ');']
        }),
        B('turn', 'motion', ['turn ', choice('dir', 'left', [['left', 'left'], ['right', 'right']]), ' ', num('steps', 3, 1, 10, 1), ' steps'], {
          code: (p) => ['doTurn(' + V(p.dir === 'left' ? 0 : 1) + ', ' + V(p.steps) + ');']
        }),
        B('dance', 'motion', ['dance ', choice('move', '0', [['0', 'swing'], ['1', 'tiptoe swing'], ['2', 'up and down'], ['3', 'jitter'], ['4', 'moonwalk left'], ['5', 'moonwalk right'], ['6', 'flapping'], ['7', 'shake right leg'], ['8', 'shake left leg'], ['9', 'bend right'], ['10', 'bend left']]), ' ', num('reps', 2, 1, 8, 1), ' times'], {
          code: (p) => ['doDance(' + V(p.move) + ', ' + V(p.reps) + ');']
        }),
        B('centre', 'motion', ['hold the legs at 90° for ', num('secs', 20, 5, 60, 5), ' seconds'], { code: (p) => ['centreServos(' + V(p.secs) + ');   // fit the servo horns now'] }),
        B('stand', 'motion', ['stand still'], { code: () => ['doRest();'] }),
        B('speed', 'motion', ['walk speed ', choice('level', '1', [['0', 'slow'], ['1', 'normal'], ['2', 'fast']])], {
          code: (p) => ['doSpeed(' + V(p.level) + ');']
        }),
        noteBlock('beepNote', 'beep note '),
        helloBlock('talk'),
        WAIT, REPEAT,
        B('if_dist', 'sensing', ['if distance is ', choice('cmp', 'less', [['less', 'less than'], ['more', 'more than']]), ' ', num('cm', 15, 3, 50, 1), ' cm'], {
          shape: 'c', canElse: true,
          head: (p) => 'if (readDistance() ' + V(p.cmp === 'less' ? '<' : '>') + ' ' + V(p.cm) + ') {'
        })
      ],
      story: [
        { id: 'name', title: 'Name it', say: 'Give your Chip Bot a name and put your own name on it. Watch both appear in the code.', done: (s) => !!s.robot.trim() },
        { id: 'wake', title: 'Wake up', say: 'What does Chip Bot do the moment it switches on? Say hello? Beep? Put it under "when Chip Bot wakes up".', done: (s) => s.wake.length > 0 },
        { id: 'forever', title: 'Forever', say: 'Now the main behaviour. Everything inside "forever" repeats again and again.', done: (s) => s.forever.length > 0 },
        { id: 'wait', title: 'Add time', say: 'Robots need rests. Add a wait so Chip Bot does not rush from one move to the next.', done: (s) => countType(s, 'wait') > 0 },
        { id: 'choice', title: 'Make a choice', say: 'Chip Bot has eyes (the distance sensor). If something is close, turn away. Otherwise keep walking. That is an "if / else".', done: (s) => countType(s, /^if_/) > 0 },
        { id: 'repeat', title: 'Repeat', say: 'A dance with 3 wiggles? Use "repeat" instead of copying blocks.', done: (s) => countType(s, 'repeat') > 0 }
      ],
      example: function (n) {
        return {
          wake: [n('hello'), n('repeat', { times: 2 }, [n('note', { note: 'C2', secs: 0.2 }), n('wait', { secs: 0.1 })])],
          forever: [
            n('if_dist', { cmp: 'less', cm: 15 }, [n('turn', { dir: 'left', steps: 3 }), n('note', { note: 'G', secs: 0.2 })], [n('walk', { dir: 'fwd', steps: 4 })]),
            n('wait', { secs: 0.5 })
          ]
        };
      }
    },

    jarvis: {
      id: 'jarvis', name: 'Jarvis', emoji: '🌱', color: '#8b7fe8',
      tagline: 'The terrarium buddy that senses soil and light',
      robotLabel: "Plant buddy's name", robotDefault: 'Jarvis',
      foldBlurb: 'sensor readings, the LED and the buzzer',
      settingsDefault: { soilDry: 520, soilWet: 280, ledAnode: false, lightHigh: true },
      cats: [
        { id: 'looks', label: 'Looks', color: '#9966FF' },
        { id: 'sound', label: 'Sound', color: '#CF63CF' },
        { id: 'control', label: 'Control', color: '#FFAB19' },
        { id: 'sensing', label: 'Sensing', color: '#3FB8DE' }
      ],
      blocks: [
        B('light', 'looks', ['set light to ', choice('color', 'green', [['red', '🔴 red'], ['green', '🟢 green'], ['blue', '🔵 blue'], ['yellow', '🟡 yellow'], ['cyan', '🩵 cyan'], ['purple', '🟣 purple'], ['white', '⚪ white'], ['off', '⚫ off']])], {
          code: (p) => {
            const rgb = { red: '1, 0, 0', green: '0, 1, 0', blue: '0, 0, 1', yellow: '1, 1, 0', cyan: '0, 1, 1', purple: '1, 0, 1', white: '1, 1, 1', off: '0, 0, 0' }[p.color];
            return ['setColor(' + rgb + ');  // ' + V(p.color)];
          }
        }),
        helloBlock('looks'),
        noteBlock('playNote', 'play note '),
        WAIT, REPEAT,
        B('print', 'sensing', ['print sensor readings'], { code: () => ['printSensors();'] }),
        B('if_soil', 'sensing', ['if soil wetness is ', choice('cmp', 'below', [['below', 'below'], ['above', 'above']]), ' ', num('pct', 40, 0, 100, 5), ' %'], {
          shape: 'c', canElse: true,
          head: (p) => 'if (soilPercent() ' + V(p.cmp === 'below' ? '<' : '>') + ' ' + V(p.pct) + ') {'
        }),
        B('if_light', 'sensing', ['if brightness is ', choice('cmp', 'below', [['below', 'below'], ['above', 'above']]), ' ', num('pct', 30, 0, 100, 5), ' %'], {
          shape: 'c', canElse: true,
          head: (p) => 'if (lightPercent() ' + V(p.cmp === 'below' ? '<' : '>') + ' ' + V(p.pct) + ') {'
        })
      ],
      story: [
        { id: 'name', title: 'Name it', say: 'Name your plant buddy and put your own name on it. Both appear in the code.', done: (s) => !!s.robot.trim() },
        { id: 'wake', title: 'Wake up', say: 'What does Jarvis do the moment it switches on? Say hello? Show a colour? Put it under "when Jarvis wakes up".', done: (s) => s.wake.length > 0 },
        { id: 'forever', title: 'Forever', say: 'A plant buddy never stops watching. Everything inside "forever" repeats again and again.', done: (s) => s.forever.length > 0 },
        { id: 'wait', title: 'Add time', say: 'Soil does not change every millisecond. Add a wait so Jarvis checks every couple of seconds.', done: (s) => countType(s, 'wait') > 0 },
        { id: 'choice', title: 'Make a choice', say: 'If the soil is dry, show red. Otherwise show green. That is an "if / else", and it is how every smart device decides.', done: (s) => countType(s, /^if_/) > 0 },
        { id: 'repeat', title: 'Repeat', say: 'Make an alarm that beeps 3 times. Use "repeat" instead of copying blocks.', done: (s) => countType(s, 'repeat') > 0 }
      ],
      example: function (n) {
        return {
          wake: [n('hello'), n('light', { color: 'green' })],
          forever: [
            n('if_soil', { cmp: 'below', pct: 40 }, [n('light', { color: 'red' }), n('repeat', { times: 3 }, [n('note', { note: 'C', secs: 0.2 }), n('wait', { secs: 0.2 })])], [n('light', { color: 'green' })]),
            n('print'),
            n('wait', { secs: 2 })
          ]
        };
      }
    }
  };
  Object.keys(PROJECTS).forEach(function (id) {
    const P = PROJECTS[id];
    P.blockMap = {};
    P.blocks.forEach((b) => { P.blockMap[b.type] = b; });
    P.catMap = {};
    P.cats.forEach((c) => { P.catMap[c.id] = c; });
  });

  /* ---------- state + tree helpers ---------- */

    const builder = cleanText(state.builder, 16, 'a CHIP Camp student');
    const builderConst = cleanText(state.builder, 16, 'Friend');
    const date = cleanText(state.date, 24, '');

    const rule = '// ============================================================';
    const header = [
      rule,
      '//  ' + P.name.toUpperCase() + ' - built by ' + V(builder),
      '//  Robot name: ' + V(robot),
      '//  Made with Camp Blocks' + (date ? ' · ' + V(date) : ''),
      rule
    ];
    const constants = P.id === 'peeko'
      ? ['const char BUILDER_NAME[] PROGMEM = "' + V(builderConst) + '";   // who built this robot', 'const char ROBOT_NAME[]   PROGMEM = "' + V(robot) + '";   // what this robot is called']
      : ['const char BUILDER_NAME[] = "' + V(builderConst) + '";   // who built this robot', 'const char ROBOT_NAME[]   = "' + V(robot) + '";   // what this robot is called'];
    const settingsLines = P.id === 'jarvis' ? [
      'const bool LED_COMMON_ANODE      = ' + (settings.ledAnode ? 'true' : 'false') + ';   // true if the RGB LED\'s long leg goes to 5V',
      'const int  SOIL_DRY              = ' + Math.round(settings.soilDry) + ';   // raw reading with the probe in dry air',
      'const int  SOIL_WET              = ' + Math.round(settings.soilWet) + ';   // raw reading with the probe in a glass of water',
      'const bool LIGHT_BRIGHT_IS_HIGH  = ' + (settings.lightHigh ? 'true' : 'false') + ';   // false if brighter light gives a smaller number'
    ] : [];

    const lines = [];
    let keep = false;
    TEMPLATES[projId].split('\n').forEach(function (ln) {
      const m = ln.trim();
      if (m === '//@@KEEP+') { keep = true; return; }
      if (m === '//@@KEEP-') { keep = false; return; }
      if (m === '//@@HEADER@@') { header.forEach((t) => lines.push({ t, src: 'student', cat: 'name', keep: true })); return; }
      if (m === '//@@CONSTANTS@@') { constants.forEach((t) => lines.push({ t, src: 'student', cat: 'name', keep: true })); return; }
      if (m === '//@@SETTINGS@@') { settingsLines.forEach((t) => lines.push({ t, src: 'settings', keep: false })); return; }
      if (m === '//@@WAKE@@') { (wakeOut.length ? wakeOut : empty('wake-up')).forEach((l) => lines.push(l)); return; }
      if (m === '//@@FOREVER@@') { (foreverOut.length ? foreverOut : empty('forever')).forEach((l) => lines.push(l)); return; }
      lines.push({ t: ln, src: 'base', keep });
    });
    const textOut = stripMarks(lines.map((l) => l.t).join('\n'));
    return { lines, text: textOut, robot, builder: builderConst };
  }

  return {
    PROJECTS, TEMPLATES, MARK_S, MARK_E, stripMarks,
    norm, cleanText, fmtF, noteHz, NOTES,
    newState, exampleState, mkNode, defaults, walk, countType, countBlocks, generate, uid, LOOP_VARS
  };
});

<script>
/* Code Builder runtime: runs the blocks on the on-screen robot so students can watch the logic before they upload. */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory(require('./core.js'));
  else root.CampRuntime = factory(root.CampCore);
})(typeof self !== 'undefined' ? self : this, function (Core) {
  'use strict';
  const STOP = { stop: true };

  // c = context: { stage, sleep(sec), sensors:{distance,soil,light}, names:{robot,builder}, settings, speedLevel }
  const COMMON = {
    wait: async (p, c) => { await c.sleep(p.secs); },
    note: async (p, c) => { c.stage.note(Core.noteHz(p.note), p.secs); await c.sleep(p.secs); },
    hello: async (p, c) => { c.stage.print("Hi! I'm " + c.names.robot + ', built by ' + c.names.builder); }
  };

  const RUN = {
    peeko: Object.assign({}, COMMON, {
      act: (p, c) => c.stage.react(p.face, c.sleep),
      look: (p, c) => c.stage.react(p.dir, c.sleep),
      say_name: (p, c) => c.stage.say(p.who === 'robot' ? c.names.robot : c.names.builder, p.secs, c.sleep),
      say_text: (p, c) => c.stage.say(p.words, p.secs, c.sleep),
      head: async (p, c) => { c.stage.head(p.deg); },
      cond_if_coin: (p) => (Math.random() < 0.5 ? 'heads' : 'tails') === p.side,
      cond_if_dice: (p) => { const r = 1 + Math.floor(Math.random() * 6); return p.cmp === 'more' ? r > p.n : p.cmp === 'less' ? r < p.n : r === p.n; }
    }),

    chipbot: Object.assign({}, COMMON, {
      walk: async (p, c) => {
        const T = c.stepSeconds();
        for (let i = 0; i < p.steps; i++) {
          c.stage.walk(p.dir, T);
          await c.sleep(T + (i === 0 ? 0.12 : 0));
          c.sensors.set('distance', p.dir === 'fwd' ? Math.max(3, c.sensors.distance - 3) : Math.min(50, c.sensors.distance + 3));
        }
        c.stage.idle();
      },
      turn: async (p, c) => {
        const T = c.stepSeconds();
        for (let i = 0; i < p.steps; i++) { c.stage.turn(p.dir, T); await c.sleep(T + (i === 0 ? 0.12 : 0)); }
        c.stage.idle();
        c.sensors.set('distance', p.steps >= 2 ? 50 : Math.min(50, c.sensors.distance + 15));
      },
      dance: async (p, c) => {
        const T = c.stepSeconds(), m = Number(p.move);
        const per = (m === 7 || m === 8) ? 2.9 : (m === 9 || m === 10) ? 0.9 + T * 0.8 + 0.5 : T;
        for (let i = 0; i < p.reps; i++) { c.stage.dance(m, per); await c.sleep(per); }
        c.stage.idle();
      },
      centre: async (p, c) => { c.stage.idle(); await c.sleep(p.secs); },
      stand: async (p, c) => { c.stage.idle(); await c.sleep(0.5); },
      speed: async (p, c) => { c.speedLevel = Number(p.level); },
      cond_if_dist: (p, c) => (p.cmp === 'less' ? c.sensors.distance < p.cm : c.sensors.distance > p.cm)
    }),

    jarvis: Object.assign({}, COMMON, {
      light: async (p, c) => { c.stage.led(p.color); },
      print: async (p, c) => {
        const s = c.settings;
        const rawSoil = Math.round(s.soilDry + (s.soilWet - s.soilDry) * c.sensors.soil / 100);
        const rawLight = Math.round((s.lightHigh ? c.sensors.light : 100 - c.sensors.light) * 10.23);
        c.stage.print('Soil: ' + Math.round(c.sensors.soil) + '% (raw ' + rawSoil + ')   Light: ' + Math.round(c.sensors.light) + '% (raw ' + rawLight + ')');

    const P = Core.PROJECTS[projId];

      if (c.stopped()) throw STOP;
      const def = P.blockMap[node.type];
      if (!def) continue;
      const p = Core.norm(def, node.p);
      c.onNode(node.id, true);
      try {
        if (def.type === 'repeat') {
          for (let t = 0; t < p.times; t++) { if (c.stopped()) throw STOP; await runList(projId, node.kids, c); }
        } else if (def.shape === 'c') {

          if (yes) await runList(projId, node.kids, c);
          else if (node.els) await runList(projId, node.els, c);

          const fn = RUN[projId][def.type];

      }

      if (e !== STOP) throw e;
    }
  }

    const oMouth = (cx, cy, r) => { d.drawCircle(cx, cy, r); d.drawCircle(cx, cy, r - 1); };
    const F = {
      neutral() { d.clear(); eyes(9); },
      closed() { d.clear(); d.rect(31, 26, 18, 4); d.rect(79, 26, 18, 4); },
      happy1() { d.clear(); eyes(9); },
      happy2() { d.clear(); happyEye(40, 28); happyEye(88, 28); smile(46, 12); },
      happy3() { d.clear(); happyEye(40, 28); happyEye(88, 28); smile(44, 20); },
      sad2() { d.clear(); sadEye(40, 28); sadEye(88, 28); frown(54, 18); },
      sad3() { d.clear(); sadEye(40, 28); sadEye(88, 28); frown(54, 18); d.fillCircle(34, 40, 3); },
      surprised2() { d.clear(); eyes(15); oMouth(64, 50, 6); },
      angry2() { d.clear(); angryEye(40, 28); angryEye(88, 28); frown(52, 14); }
    };

    let busy = 0, lastActive = performance.now(), stage;
    const tilt = (angle) => { bot.style.setProperty('--tilt', ((angle - 90) * 0.4) + 'deg'); };
    const note = (hz, secs) => { floatNote(notes, hz); Sound.beep(hz, secs); };
    const happyFace = async (sleep) => { F.happy1(); await sleep(0.15); F.happy2(); await sleep(0.15); F.happy3(); };

    stage = {
      reset() { busy = 0; F.neutral(); tilt(90); notes.innerHTML = ''; lastActive = performance.now(); },
      note, print: (t) => sensors.print(t),
      head(angle) { tilt(angle); },
      async say(text, secs, sleep) {
        busy++;
        try { d.clear(); d.text(text); await sleep(secs); F.neutral(); } finally { busy--; lastActive = performance.now(); }
      },
      async react(cmd, sleep) {
        busy++;
        try {
          const C = 90, L = 50, R = 130;
          switch (cmd) {
            case 'happy': await happyFace(sleep); tilt(C + 15); note(523, 0.15); await sleep(0.16); note(659, 0.15); await sleep(0.16); note(784, 0.25); await sleep(0.26); tilt(C); break;
            case 'sad': F.happy1(); await sleep(0.15); F.sad2(); await sleep(0.2); F.sad3(); tilt(C - 20); note(400, 0.3); await sleep(0.32); note(300, 0.3); await sleep(0.32); note(200, 0.5); await sleep(0.52); tilt(C); break;
            case 'surprised': F.happy1(); await sleep(0.1); F.surprised2(); tilt(C - 25); note(1200, 0.12); await sleep(0.13); await sleep(0.2); tilt(C); break;
            case 'angry': F.happy1(); await sleep(0.1); F.angry2(); for (let i = 0; i < 3; i++) { tilt(L + 20); await sleep(0.08); tilt(R - 20); await sleep(0.08); } tilt(C); note(150, 0.4); await sleep(0.42); break;
            case 'sleepy': F.closed(); await sleep(0.6); F.neutral(); break;
            case 'left': tilt(L); await sleep(0.4); tilt(C); break;
            case 'right': tilt(R); await sleep(0.4); tilt(C); break;
            case 'neutral': F.neutral(); tilt(C); break;
            case 'celebrate':
              for (let i = 0; i < 2; i++) { await happyFace(sleep); tilt(L + 20); note(784, 0.1); await sleep(0.12); tilt(R - 20); note(988, 0.1); await sleep(0.12); }
              tilt(C); break;
          }
        } finally { busy--; lastActive = performance.now(); }
      }
    };
    F.neutral(); tilt(90);
    const blink = setInterval(() => {
      if (!mount.isConnected) { clearInterval(blink); return; }
      if (busy === 0 && performance.now() - lastActive > 4000) { F.closed(); setTimeout(() => { if (busy === 0) F.neutral(); }, 150); lastActive = performance.now(); }
    }, 500);
    return { stage, controls: '' };
  }

  /* ---------- Chip Bot ---------- */
  function chipbot(mount, sensors) {
    mount.innerHTML =
      '<div class="cb-scene"><div class="cb-sun"></div><div class="cb-ground"><div class="cb-track"></div></div>' +
      '<div class="cb-obstacle"><span>📦</span></div>' +
      '<div class="cb-bot"><div class="cb-body"><div class="cb-eyes"><i></i><i></i></div><div class="cb-mouth"></div></div>' +
      '<div class="cb-legs"><b class="cb-leg l"></b><b class="cb-leg r"></b></div></div>' +
      '<div class="cb-dist">📏 <b>50</b> cm</div><div class="notes"></div></div>';
    const scene = $(mount, '.cb-scene'), bot = $(mount, '.cb-bot'), notes = $(mount, '.notes');
    const obs = $(mount, '.cb-obstacle'), distEl = $(mount, '.cb-dist b');
    const apply = () => {
      const dcm = sensors.distance;
      distEl.textContent = Math.round(dcm);
      obs.style.left = (30 + (dcm / 50) * 52) + '%';
    };
    sensors.on('distance', apply); apply();
    const clear = () => { scene.className = 'cb-scene'; bot.className = 'cb-bot'; };
    const stage = {
      reset() { clear(); notes.innerHTML = ''; scene.style.setProperty('--T', '1s'); },
      idle() { clear(); },
      walk(dir, T) { clear(); scene.style.setProperty('--T', T + 's'); scene.classList.add(dir === 'fwd' ? 'moving-f' : 'moving-b'); bot.classList.add('walking'); },
      turn(dir, T) { clear(); scene.style.setProperty('--T', T + 's'); bot.classList.add(dir === 'left' ? 'turn-l' : 'turn-r'); },
      dance(m, per) { clear(); scene.style.setProperty('--T', Math.max(0.5, per) + 's'); bot.classList.add('dancing', 'dance-' + (Number(m) % 4)); },
      note(hz, secs) { floatNote(notes, hz); Sound.beep(hz, secs); },
      print: (t) => sensors.print(t)
    };
    const controls = '<label class="slider"><span>📏 Something in front of Chip Bot</span><input type="range" min="3" max="50" step="1" data-s="distance"><output></output></label>';
    return { stage, controls };
  }

  /* ---------- Jarvis ---------- */
  const LED = { red: '#ff3b3b', green: '#35d07f', blue: '#3b82ff', yellow: '#ffd93b', cyan: '#2de2e6', purple: '#b06bff', white: '#ffffff', off: '#59606e' };
  function jarvis(mount, sensors) {
    mount.innerHTML =
      '<div class="jv-scene"><svg viewBox="0 0 320 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Terrarium">' +
      '<defs><filter id="jvglow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="9"/></filter></defs>' +
      '<g class="jv-sun"><circle cx="58" cy="52" r="26" fill="#ffd93b"/><g stroke="#ffd93b" stroke-width="5" stroke-linecap="round">' +
      '<path d="M58 8v10M58 86v10M14 52h10M92 52h10M27 21l7 7M82 76l7 7M89 21l-7 7M34 76l-7 7"/></g></g>' +
      '<g class="jv-lamp"><rect x="244" y="26" width="10" height="30" rx="4" fill="#b8bfd0"/><circle class="glow" cx="249" cy="30" r="26" fill="#59606e" filter="url(#jvglow)" opacity="0"/>' +
      '<circle class="bulb" cx="249" cy="30" r="15" fill="#59606e" stroke="#fff" stroke-width="3"/></g>' +
      '<path d="M70 120h180c8 0 12 5 12 12v112c0 14-10 24-24 24H82c-14 0-24-10-24-24V132c0-7 4-12 12-12z" fill="#e6f6ff" fill-opacity=".55" stroke="#9cc4e4" stroke-width="5"/>' +
      '<rect class="soil" x="62" y="204" width="196" height="60" rx="14" fill="#8a5a2b"/>' +
      '<g class="plant"><path class="stem" d="M160 210 C160 180 160 160 160 140" stroke="#3aa85c" stroke-width="7" fill="none" stroke-linecap="round"/>' +
      '<g class="leafL"><ellipse cx="136" cy="152" rx="26" ry="12" fill="#43c06b"/></g><g class="leafR"><ellipse cx="184" cy="148" rx="26" ry="12" fill="#43c06b"/></g>' +
      '<ellipse class="leafT" cx="160" cy="132" rx="12" ry="22" fill="#4fd079"/></g>' +
      '<text class="jv-buzz" x="286" y="152" font-size="26" opacity="0">🔔</text></svg><div class="notes"></div></div>';
    const q = (s) => mount.querySelector(s), notes = $(mount, '.notes');
    const soilEl = q('.soil'), plant = q('.plant'), sun = q('.jv-sun'), bulb = q('.bulb'), glow = q('.glow');
    const leaves = mount.querySelectorAll('.leafL ellipse,.leafR ellipse,.leafT');
    const lerp = (a, b, t) => Math.round(a + (b - a) * t);
    const mix = (c1, c2, t) => 'rgb(' + c1.map((v, i) => lerp(v, c2[i], t)).join(',') + ')';
    const update = () => {
      const w = sensors.soil / 100, l = sensors.light / 100;
      soilEl.setAttribute('fill', mix([201, 162, 106], [96, 60, 30], w));
      const leafCol = mix([196, 172, 70], [67, 192, 107], Math.min(1, w * 1.4));
      leaves.forEach((e) => e.setAttribute('fill', leafCol));
      plant.style.transformOrigin = '160px 210px';
      plant.style.transform = 'rotate(' + ((1 - w) * 12) + 'deg) scaleY(' + (0.8 + w * 0.2) + ')';
      sun.style.opacity = 0.2 + l * 0.8;
      sun.style.transformOrigin = '58px 52px';
      sun.style.transform = 'scale(' + (0.8 + l * 0.35) + ')';
    };
    sensors.on('soil', update); sensors.on('light', update); update();
    let buzzT = 0;
    const stage = {
      reset() { stage.led('off'); notes.innerHTML = ''; },
      led(color) { const c = LED[color] || LED.off; bulb.setAttribute('fill', c); glow.setAttribute('fill', c); glow.setAttribute('opacity', color === 'off' ? 0 : 0.85); },
      note(hz, secs) {
        floatNote(notes, hz); Sound.beep(hz, secs);
        const b = q('.jv-buzz'); b.setAttribute('opacity', 1); clearTimeout(buzzT); buzzT = setTimeout(() => b.setAttribute('opacity', 0), secs * 1000 + 100);
      },
      print: (t) => sensors.print(t)
    };
    stage.led('off');
    const controls =
      '<label class="slider"><span>🌱 Soil wetness</span><input type="range" min="0" max="100" step="1" data-s="soil"><output></output></label>' +
      '<label class="slider"><span>☀️ Light</span><input type="range" min="0" max="100" step="1" data-s="light"><output></output></label>';
    return { stage, controls };
  }

  return { make: { peeko, chipbot, jarvis }, Sound };
});

</script>
<script>
/* Camp Studio UI: Face Studio (Peeko), Dance Studio (Chip Bot), Light Studio (Jarvis). */
(function () {
  'use strict';
  const Core = CampCore, Studio = CampStudio, Runtime = CampRuntime, Stages = CampStages;
  const PROJECTS = Core.PROJECTS, ORDER = ['peeko', 'chipbot', 'jarvis'];
  const $ = (s, r) => (r || document).querySelector(s);
  const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
  const esc = (s) => String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  const el = (tag, cls, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; };

  const META = {
    peeko: { studio: 'Face Studio', title: "Design Peeko's face show", say: 'Each card is one moment. Pick a face, a head move, some words, a sound, and how long to hold it. Peeko plays your moments in order, forever.', add: '+ Add a moment', noun: 'moment' },
    chipbot: { studio: 'Dance Studio', title: "Design Chip Bot's routine", say: 'Each card is one move. Chip Bot does them in order, forever. Switch on the safety check and it turns away when something gets close.', add: '+ Add a move', noun: 'move' },
    jarvis: { studio: 'Light Studio', title: "Design Jarvis's plant light", say: 'Jarvis checks the soil and the light over and over. Pick a colour for each situation, then move the sliders on the right to test your rules.', add: '', noun: 'rule' }
  };
  const COLORCSS = { red: '#ff3b3b', green: '#35d07f', blue: '#3b82ff', yellow: '#ffd93b', cyan: '#2de2e6', purple: '#b06bff', white: '#ffffff', off: '#59606e' };
  const colorOpts = PROJECTS.jarvis.blockMap.light.params[0].opts;
  const faceOpts = PROJECTS.peeko.blockMap.act.params[0].opts;
  const moveOpts = PROJECTS.chipbot.blockMap.dance.params[0].opts;
  const noteOpts = [['none', 'no sound']].concat(Core.NOTES.map((n) => [n[0], 'note ' + n[1]]));
  const KIND_LABEL = { walk: ['🚶', 'Walk'], turn: ['↩️', 'Turn'], dance: ['💃', 'Dance'], stand: ['🧍', 'Stand still'] };
  const num = (proj, type, id, v) => Core.norm(PROJECTS[proj].blockMap[type], { [id]: v })[id];

  const S = { proj: ChipCamp.robotOrDefault(), design: null, speed: 1 };
  let toastT = 0;
  function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('show'), 2200); }

  /* ---------- design storage ---------- */
  function loadDesign() { S.design = Studio.clean(S.proj, ChipCamp.design(S.proj) || Studio.defaults(S.proj)); }
  function save() { ChipCamp.setDesign(S.proj, Studio.clean(S.proj, S.design)); }
  function changed(rerender) { save(); if (rerender) renderEditor(); }

  /* ---------- small builders ---------- */
  function field(label, node) { const l = el('label'); l.appendChild(document.createTextNode(label)); l.appendChild(node); return l; }
  function select(opts, value, onchange) {
    const s = el('select'); opts.forEach((o) => { const op = el('option'); op.value = o[0]; op.textContent = o[1]; s.appendChild(op); });
    s.value = value; s.onchange = () => onchange(s.value); return s;
  }
  function numberIn(value, min, max, step, onchange) {
    const i = el('input'); i.type = 'number'; i.min = min; i.max = max; i.step = step; i.value = value;
    i.onchange = () => onchange(i.value); return i;
  }
  function chip(html, pressed, onclick, cls) { const b = el('button', cls || 'chip', html); b.type = 'button'; b.setAttribute('aria-pressed', pressed ? 'true' : 'false'); b.onclick = onclick; return b; }
  function cardHead(num, label, list, i, onPlay) {
    const h = el('div', 'momhead', '<span class="num">' + num + '</span><b>' + esc(label) + '</b><span class="sp"></span>');
    if (onPlay) { const p = el('button', null, '▶'); p.title = 'Try just this ' + META[S.proj].noun; p.onclick = onPlay; h.appendChild(p); }
    if (list) {
      const up = el('button', null, '↑'), dn = el('button', null, '↓'), rm = el('button', null, '✕');
      up.title = 'Move up'; dn.title = 'Move down'; rm.title = 'Remove';
      up.disabled = i === 0; dn.disabled = i === list.length - 1;
      up.onclick = () => { list.splice(i - 1, 0, list.splice(i, 1)[0]); changed(true); };
      dn.onclick = () => { list.splice(i + 1, 0, list.splice(i, 1)[0]); changed(true); };
      rm.onclick = () => { list.splice(i, 1); changed(true); };
      h.appendChild(up); h.appendChild(dn); h.appendChild(rm);
    }
    return h;
  }
  function addRow(list, make) {
    const r = el('div', 'addrow'), max = Studio.MAX_STEPS;
    const b = el('button', 'btn', META[S.proj].add); b.disabled = list.length >= max;
    b.onclick = () => { list.push(make()); changed(true); };
    r.appendChild(b);
    r.appendChild(el('span', 'note', list.length >= max ? 'That is the most (' + max + ').' : list.length + ' of ' + max));
    return r;
  }

  /* ---------- Face Studio (Peeko) ---------- */
  function editPeeko(root) {
    const list = S.design.moments, stack = el('div', 'stack');
    if (!list.length) stack.appendChild(el('p', 'note', 'No moments yet. Add one to start your show.'));
    list.forEach((m, i) => {
      const card = el('div', 'mom'); card.style.setProperty('--c', '#9966FF');
      card.appendChild(cardHead(i + 1, 'Moment', list, i, () => playPart(i)));
      const body = el('div', 'mombody');
      const faces = el('div', 'chips');
      faceOpts.forEach((o) => { const [emoji, ...rest] = o[1].split(' '); faces.appendChild(chip('<span class="e">' + emoji + '</span>' + esc(rest.join(' ')), m.face === o[0], () => { m.face = o[0]; changed(true); })); });
      body.appendChild(faces);
      const f = el('div', 'fields');
      f.appendChild(field('Head', select([['none', 'stays still'], ['left', '⬅️ looks left'], ['right', '➡️ looks right']], m.look, (v) => { m.look = v; changed(); })));
      const words = el('input'); words.type = 'text'; words.maxLength = 20; words.placeholder = 'optional'; words.value = m.words;
      words.oninput = () => { m.words = words.value; save(); };
      words.onchange = () => { m.words = Core.cleanText(words.value, 20, ''); words.value = m.words; changed(); };
      f.appendChild(field('Words on screen', words));
      f.appendChild(field('Sound', select(noteOpts, m.note, (v) => { m.note = v; changed(); })));
      f.appendChild(field('Then wait (sec)', numberIn(m.wait, 0.1, 30, 0.1, (v) => { m.wait = num('peeko', 'wait', 'secs', v); changed(true); })));
      body.appendChild(f); card.appendChild(body); stack.appendChild(card);
    });
    root.appendChild(stack);
    root.appendChild(addRow(list, () => ({ face: 'happy', look: 'none', words: '', note: 'none', wait: 2 })));
  }

  /* ---------- Dance Studio (Chip Bot) ---------- */
  function editChipbot(root) {
    const d = S.design, list = d.moves;
    const guard = el('div', 'mom guard');
    guard.appendChild(el('div', 'momhead', '<span class="num">🛡</span><b>Safety check</b>'));
    const gb = el('div', 'mombody'), row = el('label', 'check');
    const cb = el('input'); cb.type = 'checkbox'; cb.checked = d.safe; cb.onchange = () => { d.safe = cb.checked; changed(true); };
    row.appendChild(cb); row.appendChild(document.createTextNode('If something is closer than'));
    const cm = numberIn(d.safeCm, 3, 50, 1, (v) => { d.safeCm = num('chipbot', 'if_dist', 'cm', v); changed(true); }); cm.disabled = !d.safe;
    row.appendChild(cm); row.appendChild(document.createTextNode('cm, turn away instead of doing the routine'));
    gb.appendChild(row); guard.appendChild(gb); root.appendChild(guard);
    root.appendChild(el('div', 'flow', d.safe ? '↓ otherwise, Chip Bot does this routine ↓' : '↓ Chip Bot does this routine ↓'));

    const stack = el('div', 'stack');
    if (!list.length) stack.appendChild(el('p', 'note', 'No moves yet. Add one to start your routine.'));
    list.forEach((m, i) => {
      const card = el('div', 'mom'); card.style.setProperty('--c', '#4C97FF');
      card.appendChild(cardHead(i + 1, KIND_LABEL[m.kind][1], list, i, () => playPart(i)));
      const body = el('div', 'mombody'), kinds = el('div', 'chips');
      Studio.KINDS.forEach((k) => kinds.appendChild(chip('<span class="e">' + KIND_LABEL[k][0] + '</span>' + KIND_LABEL[k][1], m.kind === k, () => {
        m.kind = k; m.dir = k === 'turn' ? 'left' : 'fwd'; m.n = k === 'dance' ? 2 : k === 'turn' ? 3 : 4; changed(true);
      })));
      body.appendChild(kinds);
      const f = el('div', 'fields');
      if (m.kind === 'walk') {
        f.appendChild(field('Direction', select([['fwd', 'forward'], ['back', 'backward']], m.dir, (v) => { m.dir = v; changed(); })));
        f.appendChild(field('Steps', numberIn(m.n, 1, 10, 1, (v) => { m.n = num('chipbot', 'walk', 'steps', v); changed(true); })));
      } else if (m.kind === 'turn') {
        f.appendChild(field('Direction', select([['left', 'left'], ['right', 'right']], m.dir, (v) => { m.dir = v; changed(); })));
        f.appendChild(field('Steps', numberIn(m.n, 1, 10, 1, (v) => { m.n = num('chipbot', 'turn', 'steps', v); changed(true); })));
      } else if (m.kind === 'dance') {
        f.appendChild(field('Dance move', select(moveOpts, m.move, (v) => { m.move = v; changed(); })));
        f.appendChild(field('Times', numberIn(m.n, 1, 8, 1, (v) => { m.n = num('chipbot', 'dance', 'reps', v); changed(true); })));
      }
      f.appendChild(field('Beep after', select(noteOpts, m.beep, (v) => { m.beep = v; changed(); })));
      body.appendChild(f); card.appendChild(body); stack.appendChild(card);
    });
    root.appendChild(stack);
    root.appendChild(addRow(list, () => ({ kind: 'walk', dir: 'fwd', n: 4, move: '0', beep: 'none' })));
  }

  /* ---------- Light Studio (Jarvis) ---------- */
  function swatches(current, onpick) {
    const wrap = el('div', 'swatches');
    colorOpts.forEach((o) => {
      const b = el('button', 'swatch' + (o[0] === 'off' ? ' off' : '')); b.type = 'button';
      if (o[0] !== 'off') b.style.background = COLORCSS[o[0]];
      b.title = o[1].replace(/^\S+\s/, ''); b.setAttribute('aria-label', b.title); b.setAttribute('aria-pressed', o[0] === current ? 'true' : 'false');
      b.onclick = () => { onpick(o[0]); changed(true); };
      wrap.appendChild(b);
    });
    return wrap;
  }
  function editJarvis(root) {
    const d = S.design;
    const rule = (cls, num, title, color, onpick, extra) => {
      const card = el('div', 'mom rule ' + cls);
      const head = el('div', 'momhead', '<span class="num">' + num + '</span><b>' + title + '</b>'); card.appendChild(head);
      const body = el('div', 'mombody'); body.appendChild(swatches(color, onpick));
      body.appendChild(el('div', 'swlabel', 'LED colour: ' + (colorOpts.find((o) => o[0] === color) || ['', color])[1].replace(/^\S+\s/, '')));
      if (extra) body.appendChild(extra);
      card.appendChild(body); return card;
    };
    const dryExtra = el('div', 'fields');
    dryExtra.appendChild(field('Dry means below (%)', numberIn(d.dryPct, 0, 100, 5, (v) => { d.dryPct = num('jarvis', 'if_soil', 'pct', v); changed(true); })));
    const al = el('label', 'check'); const acb = el('input'); acb.type = 'checkbox'; acb.checked = d.dryAlarm; acb.onchange = () => { d.dryAlarm = acb.checked; changed(); };
    al.appendChild(acb); al.appendChild(document.createTextNode('🔔 Beep 3 times to ask for water')); dryExtra.appendChild(al);
    root.appendChild(rule('r1', 1, 'If the soil is dry', d.dryColor, (c) => { d.dryColor = c; }, dryExtra));
    root.appendChild(el('div', 'flow', '↓ if not ↓'));
    const darkExtra = el('div', 'fields');
    darkExtra.appendChild(field('Dark means below (%)', numberIn(d.darkPct, 0, 100, 5, (v) => { d.darkPct = num('jarvis', 'if_light', 'pct', v); changed(true); })));
    root.appendChild(rule('r2', 2, 'Else, if it is dark', d.darkColor, (c) => { d.darkColor = c; }, darkExtra));
    root.appendChild(el('div', 'flow', '↓ if not ↓'));
    root.appendChild(rule('r3', 3, 'Otherwise, all is well', d.okColor, (c) => { d.okColor = c; }));
    const f = el('div', 'fields'); f.style.marginTop = '14px';
    f.appendChild(field('Check the plant every (sec)', numberIn(d.checkSecs, 0.1, 30, 0.1, (v) => { d.checkSecs = num('jarvis', 'wait', 'secs', v); changed(true); })));
    root.appendChild(f);
  }

  function renderEditor() {
    const m = META[S.proj], root = $('#editor'); root.innerHTML = '';
    $('#brandName').textContent = m.studio; $('#edTitle').textContent = m.title; $('#edSay').textContent = m.say;
    document.title = m.studio + ' · Chip Camp';
    if (S.proj === 'peeko') editPeeko(root); else if (S.proj === 'chipbot') editChipbot(root); else editJarvis(root);
    $('#edNote').textContent = 'Your design is saved on this laptop as you go.';
  }

  /* ---------- tabs ---------- */
  function renderTabs() {
    const nav = $('#ptabs'); nav.innerHTML = '';
    ORDER.forEach((id) => {
      const p = PROJECTS[id];
      const b = el('button', 'ptab', '<span class="em">' + p.emoji + '</span>' + esc(p.name));
      b.setAttribute('aria-selected', id === S.proj ? 'true' : 'false'); b.style.setProperty('--pc', p.color);
      b.onclick = () => { if (id === S.proj) return; stopRun(); S.proj = id; ChipCamp.setRobot(id); loadDesign(); renderAll(); };
      nav.appendChild(b);
    });
  }

  /* ---------- the stage (same on-screen robots as the Code Builder) ---------- */
  const sensors = {
    distance: 50, soil: 35, light: 70, _l: {},
    on(k, f) { (this._l[k] = this._l[k] || []).push(f); },
    set(k, v) { this[k] = v; (this._l[k] || []).forEach((f) => f()); const i = $('#sliders input[data-s="' + k + '"]'); if (i) { i.value = v; const o = i.parentElement.querySelector('output'); if (o) o.textContent = Math.round(v); } },
    print(t) { const s = $('#serial'), d = el('div'); d.textContent = t; s.appendChild(d); while (s.children.length > 40) s.children[1].remove(); s.scrollTop = s.scrollHeight; }
  };
  let stageApi = null, running = false, stopFlag = false;
  function mountStage() {
    sensors._l = {};
    const made = Stages.make[S.proj]($('#scene'), sensors);
    stageApi = made.stage;
    const sl = $('#sliders'); sl.innerHTML = made.controls; sl.hidden = !made.controls;
    $$('input[data-s]', sl).forEach((i) => {
      const k = i.dataset.s, o = i.parentElement.querySelector('output');
      i.value = sensors[k]; o.textContent = Math.round(sensors[k]);
      i.oninput = () => { sensors.set(k, Number(i.value)); };
    });
    $('#serial').innerHTML = '<b>Serial Monitor</b>';
  }
  function stopRun() { if (running) stopFlag = true; }
  function makeCtx() {
    const P = PROJECTS[S.proj], name = ChipCamp.get().name;
    return {
      stage: stageApi, sensors, settings: Object.assign({}, P.settingsDefault || {}), speedLevel: 1,
      names: { robot: P.robotDefault, builder: Core.cleanText(name, 16, 'Friend') },
      stepSeconds() { return [1.4, 1.0, 0.7][this.speedLevel] || 1; },
      stopped: () => stopFlag,
      onNode: () => {},
      sleep: async (sec) => { let left = sec * 1000 / S.speed; while (left > 0) { if (stopFlag) throw Runtime.STOP; const dt = Math.min(left, 40); await new Promise((r) => setTimeout(r, dt)); left -= dt; } }
    };
  }
  async function exec(fn) {
    if (running) { stopFlag = true; await new Promise((r) => setTimeout(r, 120)); }
    running = true; stopFlag = false;
    $('#runBtn').hidden = true; $('#stopBtn').hidden = false; $('#serial').innerHTML = '<b>Serial Monitor</b>';
    try { await fn(makeCtx()); }
    catch (e) { if (e !== Runtime.STOP) { console.error(e); toast('The preview hit a problem'); } }
    running = false; $('#runBtn').hidden = false; $('#stopBtn').hidden = true;
  }
  function currentState() { return Studio.toState(S.proj, S.design, { builder: ChipCamp.get().name, robot: '' }); }
  $('#runBtn').onclick = () => { save(); exec((c) => Runtime.runProgram(S.proj, currentState(), c)); };
  $('#stopBtn').onclick = () => { stopFlag = true; };
  // try just one card: the same blocks the Code Builder will get, run once
  function playPart(i) {
    const d = JSON.parse(JSON.stringify(S.design));
    if (S.proj === 'peeko') d.moments = [d.moments[i]]; else d.moves = [d.moves[i]], d.safe = false;
    const b = Studio.toBlocks(S.proj, d);
    exec((c) => { c.stage.reset(); return Runtime.runList(S.proj, b.forever, c); });
  }
  $$('#speedsel button').forEach((b) => { b.onclick = () => { S.speed = Number(b.dataset.sp); $$('#speedsel button').forEach((x) => x.setAttribute('aria-pressed', x === b ? 'true' : 'false')); }; });
  $('#soundBtn').onclick = () => { Stages.Sound.on = !Stages.Sound.on; $('#soundBtn').textContent = Stages.Sound.on ? '🔊' : '🔇'; $('#soundBtn').setAttribute('aria-pressed', Stages.Sound.on); if (Stages.Sound.on) Stages.Sound.beep(660, 0.12); };

  $('#toBuilder').onclick = () => { stopRun(); save(); location.href = 'blocks.html#design'; };

  function renderAll() { renderTabs(); renderEditor(); mountStage(); }
  loadDesign(); renderAll();
  window.__studio = { S, Studio, renderAll };
})();

</script>
</body>
</html>
