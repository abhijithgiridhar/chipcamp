<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Presentations · Chip Camp</title>
<style>
@import url("https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Nunito:wght@600;800;900&family=JetBrains+Mono:wght@400;700&display=swap");
:root{
  --ink:#2b2f4a; --ink-soft:#69709a; --bg:#e8f0ff; --card:#ffffff; --line:#d3def6; --line-soft:#e6edfb;
  --purple:#7c4dff; --blue:#4c97ff; --green:#3fb950; --green-d:#2c8f3b; --events:#FFBF00;
  --font-d:"Fredoka","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --font-b:"Nunito","Segoe UI","Trebuchet MS",system-ui,sans-serif;
  --font-m:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --nh:6px; --nx:16px; --nw:26px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-b);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
[hidden]{display:none!important}

/* ---------- top bar ---------- */
.topbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 18px;background:linear-gradient(90deg,#7c4dff,#4c97ff);color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.12);}
.brand{font-family:var(--font-d);font-size:24px;font-weight:600;letter-spacing:.2px;display:flex;align-items:center;gap:8px;margin-right:6px}
.brand .logo{display:inline-grid;grid-template-columns:repeat(2,12px);gap:3px;transform:rotate(-8deg)}
.brand .logo i{width:12px;height:12px;border-radius:4px;display:block}
.ptabs{display:flex;gap:8px;flex-wrap:wrap}
.ptab{border:0;cursor:pointer;font-family:var(--font-d);font-size:17px;font-weight:500;padding:8px 16px;border-radius:16px;background:rgba(255,255,255,.2);color:#fff;display:flex;align-items:center;gap:7px;transition:transform .12s, background .15s;}
.ptab:hover{background:rgba(255,255,255,.32);transform:translateY(-1px)}
.ptab[aria-selected="true"]{background:#fff;color:var(--pc);box-shadow:0 4px 0 rgba(0,0,0,.18);transform:translateY(-1px)}
.ptab .em{font-size:20px}
.spacer{flex:1}
.viewtabs{display:flex;background:rgba(0,0,0,.18);border-radius:18px;padding:4px;gap:4px}
.vtab{border:0;cursor:pointer;font-family:var(--font-d);font-size:17px;padding:8px 18px;border-radius:14px;background:transparent;color:#fff;display:flex;align-items:center;gap:6px}
.vtab[aria-selected="true"]{background:#fff;color:var(--purple);box-shadow:0 3px 0 rgba(0,0,0,.18)}

.btn{border:0;cursor:pointer;font-family:var(--font-d);font-weight:500;font-size:15px;padding:8px 14px;border-radius:14px;background:#fff;color:var(--ink);box-shadow:0 3px 0 #c9d6f2;border:2px solid #d3def6;display:inline-flex;align-items:center;gap:6px;transition:transform .08s, box-shadow .08s;white-space:nowrap}
.btn:hover{transform:translateY(-1px);box-shadow:0 4px 0 #c9d6f2}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #c9d6f2}
.btn.go{background:var(--green);border-color:var(--green-d);color:#fff;box-shadow:0 4px 0 var(--green-d)}
.btn.go:hover{box-shadow:0 5px 0 var(--green-d)}
.btn.go:active{box-shadow:0 1px 0 var(--green-d)}
.btn.stop{background:#ff6680;border-color:#d94a63;color:#fff;box-shadow:0 4px 0 #d94a63}
.btn.big{font-size:19px;padding:12px 22px;border-radius:18px}
.btn.small{font-size:13px;padding:5px 10px;border-radius:11px}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* ---------- blocks ---------- */
.blk{--c:#9966FF;position:relative;filter:drop-shadow(0 2px 0 rgba(0,0,0,.2));user-select:none;touch-action:none}
.dz>.blk+.blk,.blk+.blk{margin-top:calc(var(--nh) * -1)}
.blk>.row,.blk>.foot{background:var(--c);color:#fff;font-family:var(--font-d);font-weight:500;font-size:15px;text-shadow:0 1px 0 rgba(0,0,0,.18)}
.blk>.row{display:flex;align-items:center;flex-wrap:wrap;gap:6px;min-height:46px;padding:8px 10px calc(8px + var(--nh)) 12px;
  clip-path:polygon(0 0,var(--nx) 0,calc(var(--nx) + 4px) var(--nh),calc(var(--nx) + var(--nw) - 4px) var(--nh),calc(var(--nx) + var(--nw)) 0,100% 0,100% calc(100% - var(--nh)),calc(var(--nx) + var(--nw)) calc(100% - var(--nh)),calc(var(--nx) + var(--nw) - 4px) 100%,calc(var(--nx) + 4px) 100%,var(--nx) calc(100% - var(--nh)),0 calc(100% - var(--nh)));
  cursor:grab}
.blk.c>.row{clip-path:polygon(0 0,var(--nx) 0,calc(var(--nx) + 4px) var(--nh),calc(var(--nx) + var(--nw) - 4px) var(--nh),calc(var(--nx) + var(--nw)) 0,100% 0,100% 100%,0 100%);padding-bottom:8px;border-radius:12px 12px 0 0}
.blk.c>.row.else{clip-path:none;border-radius:0;min-height:34px;padding-top:6px;padding-bottom:6px}
.blk:not(.c)>.row{border-radius:12px 12px 12px 12px}
.blk>.foot{height:calc(26px + var(--nh));border-radius:0 0 12px 12px;display:flex;align-items:center;padding:0 12px var(--nh) 12px;gap:8px;
  clip-path:polygon(0 0,100% 0,100% calc(100% - var(--nh)),calc(var(--nx) + var(--nw)) calc(100% - var(--nh)),calc(var(--nx) + var(--nw) - 4px) 100%,calc(var(--nx) + 4px) 100%,var(--nx) calc(100% - var(--nh)),0 calc(100% - var(--nh)))}
.cslot{display:flex;background:var(--c)}
.cslot::before{content:"";width:16px;flex:none;background:var(--c)}
.cslot>.dz{flex:1;background:#f7f9ff;border-radius:10px 0 0 10px;min-height:44px;margin:0;box-shadow:inset 0 3px 0 rgba(0,0,0,.08)}
.blk .x{margin-left:auto;border:0;background:rgba(255,255,255,.28);color:#fff;width:22px;height:22px;border-radius:50%;cursor:pointer;font-size:12px;line-height:1;padding:0;opacity:.0;transition:opacity .12s}
.blk:hover>.row .x,.blk>.row .x:focus-visible{opacity:1}
.blk .x:hover{background:rgba(255,255,255,.5)}
.blk .tag{font-size:11px;font-weight:700;background:rgba(0,0,0,.16);border-radius:10px;padding:2px 8px;font-family:var(--font-b);text-shadow:none}
.elsebtn{border:0;cursor:pointer;background:rgba(255,255,255,.28);color:#fff;font-family:var(--font-d);font-size:13px;border-radius:10px;padding:3px 10px}
.elsebtn:hover{background:rgba(255,255,255,.45)}
.blk.running>.row,.blk.running>.foot{animation:glow .6s ease-in-out infinite alternate}
@keyframes glow{from{filter:brightness(1)}to{filter:brightness(1.35) saturate(1.2)}}
.blk.pop{animation:pop .38s cubic-bezier(.3,1.7,.5,1)}
@keyframes pop{0%{transform:scale(.6) rotate(-4deg);opacity:.2}100%{transform:scale(1) rotate(0);opacity:1}}
.blk.lifting{opacity:.3}
.ghost{position:fixed;z-index:1000;pointer-events:none;transform:rotate(2deg) scale(1.04);filter:drop-shadow(0 10px 12px rgba(40,40,80,.35));opacity:.96}
.ghost .x{display:none}

/* parameter fields (Scratch style) */
.pill{display:inline-flex;align-items:center;border-radius:16px;background:#fff;color:var(--ink);text-shadow:none;font-family:var(--font-b);font-weight:800;font-size:14px;padding:0;overflow:hidden;box-shadow:inset 0 -2px 0 rgba(0,0,0,.1)}
.pill input{border:0;background:transparent;outline:0;font-weight:800;color:var(--ink);padding:3px 9px;min-width:0;text-align:center;font-family:var(--font-b)}
.pill input[type=number]{width:58px;-moz-appearance:textfield}
.pill input[type=number]::-webkit-outer-spin-button,.pill input[type=number]::-webkit-inner-spin-button{opacity:.55}
.pill input[type=text]{width:116px}
.pill:focus-within{outline:3px solid rgba(255,255,255,.75);outline-offset:1px}
.drop{display:inline-flex;align-items:center;border-radius:14px;background:rgba(0,0,0,.2);color:#fff;font-family:var(--font-b);font-weight:800;font-size:14px;text-shadow:none;padding:0;position:relative}
.drop select{appearance:none;-webkit-appearance:none;border:0;background:transparent;color:#fff;font-weight:800;padding:4px 24px 4px 10px;cursor:pointer;outline:0;border-radius:14px;font-family:var(--font-b)}
.drop select option{color:var(--ink);background:#fff}
.drop::after{content:"▾";position:absolute;right:9px;pointer-events:none;font-size:12px}
.drop:focus-within{outline:3px solid rgba(255,255,255,.75);outline-offset:1px}
.static{display:inline-flex;align-items:center;border-radius:14px;padding:2px 9px;font-weight:800;font-size:13px;font-family:var(--font-b);text-shadow:none}
.static.p{background:#fff;color:var(--ink)}
.static.d{background:rgba(0,0,0,.2);color:#fff}
.palette-blk{margin-bottom:10px;cursor:grab}
.palette-blk>.row{cursor:grab}
.palette-blk.c>.foot{height:calc(18px + var(--nh))}

.dz{display:flex;flex-direction:column;min-height:40px;position:relative}
.dz.over{outline:3px dashed var(--purple);outline-offset:-3px;border-radius:12px;background:rgba(124,77,255,.07)}
.dz:empty::before,.dz.empty::before{content:"drop blocks here";display:flex;align-items:center;justify-content:center;min-height:44px;color:#9aa4c7;font-weight:800;font-size:13px;border-radius:10px;border:2px dashed #cfd9f3;margin:4px}
.dropline{height:0;position:relative;z-index:5}
.dropline::after{content:"";position:absolute;left:-2px;right:-2px;top:-3px;height:6px;border-radius:4px;background:var(--purple);box-shadow:0 0 0 2px #fff}
/* ---------- misc ---------- */
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:#2b2f4a;color:#fff;font-family:var(--font-d);padding:10px 18px;border-radius:16px;opacity:0;pointer-events:none;transition:all .25s;z-index:3000;box-shadow:0 8px 20px rgba(0,0,0,.25)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.modalback{position:fixed;inset:0;background:rgba(43,47,74,.5);display:grid;place-items:center;z-index:2000;padding:16px}
.modal{background:#fff;border-radius:22px;width:min(560px,100%);max-height:86vh;overflow:auto;padding:18px 20px;box-shadow:0 20px 50px rgba(0,0,0,.3);border:3px solid var(--line)}
.modal h2{font-family:var(--font-d);font-weight:500;margin:0 0 10px;font-size:22px}
.modal textarea{width:100%;height:120px;border:2px solid var(--line);border-radius:12px;padding:8px;font-family:var(--font-m);font-size:12px}
.saverow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:2px solid var(--line-soft)}
.saverow .who{flex:1;font-weight:800}
.saverow .who small{display:block;font-weight:600;color:var(--ink-soft)}
.conf{position:fixed;z-index:2500;font-size:26px;pointer-events:none;animation:conf 1.1s ease-out forwards}
@keyframes conf{0%{transform:translate(0,0) rotate(0) scale(.6);opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(var(--r)) scale(1.2);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

.homebtn{display:inline-grid;place-items:center;width:42px;height:42px;border-radius:14px;background:rgba(255,255,255,.22);color:#fff;text-decoration:none;font-size:21px;box-shadow:0 3px 0 rgba(0,0,0,.14);transition:transform .12s,background .15s;flex:none}
.homebtn:hover{background:rgba(255,255,255,.36);transform:translateY(-1px)}
.homebtn:focus-visible{outline:3px solid #fff;outline-offset:2px}
a.btn{text-decoration:none}

/* ---------- stage ---------- */
.stagecard{overflow:hidden;position:sticky;top:12px}
.stagehead{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:2px solid var(--line-soft);background:#f6f9ff;flex-wrap:wrap}
.stagehead h2{font-family:var(--font-d);font-size:17px;font-weight:500;margin:0;margin-right:auto}
.speedsel{display:flex;border-radius:12px;overflow:hidden;border:2px solid var(--line)}
.speedsel button{border:0;background:#fff;padding:3px 9px;font-weight:800;font-size:12px;cursor:pointer;color:var(--ink-soft)}
.speedsel button[aria-pressed="true"]{background:var(--purple);color:#fff}
.scene{position:relative;overflow:hidden}
.sliders{padding:10px 14px;display:flex;flex-direction:column;gap:8px;border-top:2px solid var(--line-soft)}
.slider{display:grid;grid-template-columns:1fr auto;gap:2px 8px;font-weight:800;font-size:13px}
.slider input{grid-column:1/-1;accent-color:var(--purple);width:100%}
.slider output{font-family:var(--font-m);color:var(--purple);grid-row:1;grid-column:2}
.serial{margin:0 14px 14px;border:2px dashed var(--line);border-radius:14px;background:#fcfdff;font-family:var(--font-m);font-size:12px;padding:8px 10px;height:94px;overflow:auto;color:#3d4668}
.serial b{font-family:var(--font-b);color:var(--ink-soft);font-size:11px;text-transform:uppercase;letter-spacing:.05em;display:block;margin-bottom:3px}
.serial div{white-space:pre-wrap}
.notes{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.fnote{position:absolute;bottom:26%;font-size:30px;font-weight:900;animation:floatup 1.3s ease-out forwards;text-shadow:0 2px 0 rgba(255,255,255,.7)}
@keyframes floatup{0%{transform:translateY(0) scale(.6);opacity:0}15%{opacity:1}100%{transform:translateY(-130px) scale(1.15) rotate(12deg);opacity:0}}

/* Peeko */
.pk-scene{position:relative;height:292px;display:grid;place-items:end center;background:linear-gradient(#ffe9d6,#ffd1e0);padding-bottom:26px}
.pk-bot{--tilt:0deg;transform:rotate(var(--tilt));transform-origin:50% 100%;transition:transform .22s cubic-bezier(.3,1.5,.5,1)}
.pk-antenna{width:8px;height:30px;background:#d94c40;margin:0 auto -2px;border-radius:4px;position:relative}
.pk-antenna::after{content:"";position:absolute;top:-12px;left:-8px;width:24px;height:24px;border-radius:50%;background:#ffd93b;border:4px solid #e0a800}
.pk-head{width:262px;height:176px;border-radius:58px;background:linear-gradient(#ff8c80,#ff6b5e);border:7px solid #d94c40;box-shadow:0 8px 0 #b73c32,0 18px 24px rgba(120,40,40,.25);display:grid;place-items:center}
.pk-screen{width:210px;height:106px;border-radius:20px;background:#050b14;border:6px solid #1b2236;overflow:hidden;box-shadow:inset 0 0 18px rgba(130,200,255,.18)}
.pk-screen canvas{width:100%;height:100%;display:block}

/* Chip Bot */
.cb-scene{--T:1s;position:relative;height:292px;background:linear-gradient(#bfe6ff,#e9f8ff 70%)}
.cb-sun{position:absolute;right:26px;top:22px;width:54px;height:54px;border-radius:50%;background:#ffd93b;box-shadow:0 0 0 10px rgba(255,217,59,.3)}
.cb-ground{position:absolute;left:0;right:0;bottom:0;height:76px;background:#7bd389;border-top:6px solid #5cbf6e;overflow:hidden}
.cb-track{position:absolute;inset:auto 0 18px 0;height:8px;background:repeating-linear-gradient(90deg,#fff 0 28px,transparent 28px 60px);opacity:.85;background-size:60px 8px}
.moving-f .cb-track{animation:trackf var(--T) linear infinite}
.moving-b .cb-track{animation:trackb var(--T) linear infinite}
@keyframes trackf{to{background-position:-60px 0}}
@keyframes trackb{to{background-position:60px 0}}
.cb-obstacle{position:absolute;bottom:70px;font-size:50px;transition:left .35s ease;transform:translateX(-50%)}
.cb-bot{position:absolute;left:17%;bottom:58px;width:92px;display:flex;flex-direction:column;align-items:center;transform-origin:50% 100%}
.cb-body{width:88px;height:78px;border-radius:26px;background:linear-gradient(#3fd0bf,#2bb3a3);border:5px solid #1e8e80;box-shadow:0 5px 0 #17756a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.cb-eyes{display:flex;gap:14px}
.cb-eyes i{width:22px;height:22px;border-radius:50%;background:#fff;border:3px solid #17756a;display:block;position:relative}
.cb-eyes i::after{content:"";position:absolute;width:8px;height:8px;border-radius:50%;background:#17302d;left:5px;top:5px}
.cb-mouth{width:26px;height:8px;border-radius:0 0 14px 14px;border:3px solid #17756a;border-top:0}
.cb-legs{display:flex;gap:18px;margin-top:-2px}
.cb-leg{width:20px;height:26px;border-radius:8px 8px 12px 12px;background:#1e8e80;display:block;transform-origin:50% 0}
.walking .cb-leg.l{animation:legL var(--T) ease-in-out infinite}
.walking .cb-leg.r{animation:legR var(--T) ease-in-out infinite}
.moving-b .walking .cb-leg.l{animation-direction:reverse}
@keyframes legL{0%,100%{transform:rotate(22deg)}50%{transform:rotate(-22deg)}}
@keyframes legR{0%,100%{transform:rotate(-22deg)}50%{transform:rotate(22deg)}}
.walking .cb-body{animation:bob calc(var(--T) / 2) ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.turn-l{animation:turnl var(--T) ease-in-out infinite}
.turn-r{animation:turnr var(--T) ease-in-out infinite}
@keyframes turnl{0%,100%{transform:rotate(0)}50%{transform:rotate(-14deg) scaleX(.82)}}
@keyframes turnr{0%,100%{transform:rotate(0)}50%{transform:rotate(14deg) scaleX(.82)}}
.dancing .cb-body{animation:dance0 var(--T) ease-in-out infinite}
.dancing.dance-1 .cb-body{animation-name:dance1}
.dancing.dance-2 .cb-body{animation-name:dance2}
.dancing.dance-3 .cb-body{animation-name:dance3}
.dancing .cb-leg.l{animation:legL calc(var(--T) / 2) ease-in-out infinite}
.dancing .cb-leg.r{animation:legR calc(var(--T) / 2) ease-in-out infinite}
@keyframes dance0{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
@keyframes dance1{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}
@keyframes dance2{0%,100%{transform:rotate(-10deg) translateX(-6px)}50%{transform:rotate(10deg) translateX(6px)}}
@keyframes dance3{0%,100%{transform:scale(1)}25%{transform:scale(1.08,.92)}75%{transform:scale(.94,1.06)}}
.cb-dist{position:absolute;left:12px;top:12px;background:#fff;border:2px solid #cfe6f7;border-radius:14px;padding:3px 10px;font-weight:800;font-size:13px}

/* Jarvis */
.jv-scene{position:relative;height:292px;background:linear-gradient(#d9f4ff,#fff6d6)}
.jv-scene svg{width:100%;height:100%;display:block}
.jv-scene .plant{transition:transform .5s ease}
.jv-scene .soil{transition:fill .5s ease}
.jv-scene .jv-sun{transition:opacity .4s, transform .4s}

/* Presentations */
body{background:#1d1b2e;overflow-x:hidden}
.card{background:var(--card);border:2px solid var(--line);border-radius:20px;box-shadow:0 4px 0 var(--line)}
.lock{display:grid;place-items:center;padding:60px 16px;min-height:100vh;background:var(--bg)}
.lockcard{width:min(420px,100%);padding:26px 24px 22px;text-align:center}
.lockico{font-size:44px}
.lockcard h1{font-family:var(--font-d);font-weight:500;font-size:26px;margin:6px 0 4px}
.lockcard p{margin:0 0 14px;color:var(--ink-soft);font-weight:700}
.lockcard label{display:block;text-align:left;font-weight:800;font-size:12px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.05em;margin-bottom:4px}
.lockcard input{width:100%;border:3px solid var(--line);border-radius:14px;padding:11px 14px;font-size:22px;font-weight:800;letter-spacing:.3em;text-align:center;margin-bottom:14px}
.lockmsg{min-height:22px;margin-top:10px;font-weight:800;color:#d94a63}

/* deck list */
.decks{min-height:100vh;background:var(--bg);padding:24px 18px 50px}
.dtop{max-width:1100px;margin:0 auto 18px;position:relative;padding-left:56px}
.dtop .homebtn{position:absolute;left:0;top:4px;background:#7c4dff}
.dtop h1{font-family:var(--font-d);font-weight:500;font-size:32px;margin:0}
.dtop p{margin:4px 0 0;color:var(--ink-soft);font-weight:700}
.dgrid{max-width:1100px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:16px}
.dcard{--c:#7c4dff;background:#fff;border:3px solid var(--c);border-radius:24px;overflow:hidden;box-shadow:0 5px 0 rgba(0,0,0,.1);display:flex;flex-direction:column}
.dcard .dart{background:var(--c);height:150px;display:grid;place-items:center}
.dcard .dart .art{width:110px;height:110px}
.dcard .dart .art.emoji{font-size:80px;width:auto;height:auto}
.dcard .dbody{padding:14px 16px 16px;display:flex;flex-direction:column;gap:6px;flex:1}
.dcard h2{font-family:var(--font-d);font-weight:500;font-size:22px;margin:0}
.dcard .dsub{font-weight:700;color:var(--ink-soft);font-size:14px}
.dcard .dmeta{font-size:12px;font-weight:800;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.05em}
.dcard .dact{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:8px}

/* the show */
.show{position:fixed;inset:0;background:#1d1b2e}
.viewport{position:absolute;inset:0;display:grid;place-items:center;overflow:hidden}
.stage{position:absolute;width:1280px;height:720px;flex:none;transform-origin:center center;background:#fff;border-radius:6px;overflow:hidden;font-family:var(--font-b);color:var(--ink)}
.slide{--c:#7c4dff;--d:#4b2fc4;position:absolute;inset:0;padding:64px 80px;display:flex;flex-direction:column;justify-content:center;animation:slin .35s ease-out;background:
  radial-gradient(circle at 92% 8%,color-mix(in srgb,var(--c) 22%,#fff) 0 120px,transparent 121px),
  radial-gradient(circle at 4% 96%,color-mix(in srgb,var(--c) 16%,#fff) 0 170px,transparent 171px),#fff}
@keyframes slin{from{opacity:0;transform:translateY(18px) scale(.985)}to{opacity:1;transform:none}}
.slide h1,.slide h2{font-family:var(--font-d);font-weight:500;margin:0}
.slide .art{flex:none}
.slide .art svg{width:100%;height:100%;display:block}
.slide .art.emoji{display:grid;place-items:center;font-size:150px;line-height:1}
.slide .kicker{font-family:var(--font-d);font-size:26px;letter-spacing:.06em;text-transform:uppercase;color:var(--d);margin-bottom:8px}
.slide b{color:var(--d)}
.slide .row{display:flex;align-items:center;gap:56px}
.slide .grow{flex:1;min-width:0}
.pop{animation:pop .45s cubic-bezier(.3,1.6,.5,1) both}
@keyframes pop{from{opacity:0;transform:scale(.7) translateY(14px)}to{opacity:1;transform:none}}

.s-title,.s-end{background:linear-gradient(135deg,var(--c),var(--d));color:#fff}
.s-title .kicker,.s-end .kicker{color:rgba(255,255,255,.85)}
.s-title h1{font-size:104px;line-height:1.02;letter-spacing:-.02em}
.s-title .sub,.s-end .sub{font-size:38px;font-weight:800;margin-top:18px;opacity:.95}
.s-title .art,.s-end .art{width:340px;height:340px;filter:drop-shadow(0 14px 0 rgba(0,0,0,.18));animation:bob 3s ease-in-out infinite}
.s-title .art.emoji,.s-end .art.emoji{font-size:230px}
@keyframes bob{50%{transform:translateY(-14px) rotate(2deg)}}
.s-end h1{font-size:92px;line-height:1.05}
.s-end b,.s-title b{color:#fff}

.s-story h1{font-size:60px;color:var(--d);margin-bottom:22px}
.s-story .line{font-size:46px;font-weight:800;line-height:1.25;margin:14px 0;animation:pop .5s cubic-bezier(.3,1.6,.5,1) both}
.s-story .art{width:330px;height:330px}
.s-story .art.emoji{font-size:200px}

.s-big{background:var(--d);color:#fff;text-align:left}
.s-big .big{font-family:var(--font-d);font-weight:500;font-size:96px;line-height:1.05;letter-spacing:-.02em}
.s-big .small{font-size:38px;font-weight:700;margin-top:22px;max-width:820px;opacity:.95}
.s-big .art{width:260px;height:260px}
.s-big .art.emoji{font-size:170px}
.s-big b{color:#ffe27a}

.s-list h1,.s-steps h1,.s-parts h1,.s-activity h1,.s-demo h1,.s-code h1,.s-crew h1{font-size:58px;color:var(--d);margin-bottom:26px}
.items{display:flex;flex-direction:column;gap:16px}
.item{display:flex;align-items:center;gap:22px;background:#fff;border:4px solid var(--c);border-radius:26px;padding:16px 26px;box-shadow:0 6px 0 rgba(0,0,0,.08);animation:pop .5s cubic-bezier(.3,1.6,.5,1) both}
.item .em{width:78px;height:78px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-family:var(--font-d);font-size:34px;flex:none;line-height:1;text-align:center;overflow:hidden}
.item .em.sm{font-size:22px}
.item .em.emo{font-size:42px;background:color-mix(in srgb,var(--c) 22%,#fff)}
.item h3{margin:0;font-family:var(--font-d);font-weight:500;font-size:34px;line-height:1.1}
.item p{margin:4px 0 0;font-size:26px;font-weight:700;color:#4a5072;line-height:1.25}
.s-list .art{width:250px;height:250px}
.s-list .art.emoji{font-size:150px}

.stepsl{counter-reset:s;display:flex;flex-direction:column;gap:14px;padding:0;margin:0;list-style:none}
.stepsl li{counter-increment:s;display:flex;align-items:center;gap:20px;font-size:31px;font-weight:800;line-height:1.2;animation:pop .5s cubic-bezier(.3,1.6,.5,1) both}
.stepsl li::before{content:counter(s);flex:none;width:58px;height:58px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-family:var(--font-d);font-size:30px;box-shadow:0 4px 0 var(--d)}
.s-steps .art{width:250px;height:250px}
.s-steps .art.emoji{font-size:150px}
.s-steps.long .stepsl li{font-size:27px}

.pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.pcard{background:#fff;border:4px solid var(--c);border-radius:26px;padding:22px 20px;text-align:center;box-shadow:0 6px 0 rgba(0,0,0,.08);animation:pop .5s cubic-bezier(.3,1.6,.5,1) both}
.pcard .pe{font-size:68px;line-height:1.1}
.pcard h3{font-family:var(--font-d);font-weight:500;font-size:30px;margin:6px 0 2px}
.pcard p{margin:0;font-size:23px;font-weight:700;color:#4a5072}

.s-activity .badge{position:absolute;right:70px;top:54px;background:var(--d);color:#fff;border:0;border-radius:30px;padding:10px 24px;font-family:var(--font-d);font-size:40px;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.2)}
.s-activity .badge.run{background:#3fb950}
.s-activity .badge.done{background:#ff6680;animation:bob .6s infinite}
.s-activity .art{width:240px;height:240px}
.s-activity .art.emoji{font-size:140px}

.s-demo .row{align-items:center}
.s-demo p.lead{font-size:34px;font-weight:800;line-height:1.25;margin:0 0 24px}
.s-demo .open{display:inline-block;background:var(--c);color:#fff;font-family:var(--font-d);font-size:30px;text-decoration:none;padding:14px 30px;border-radius:22px;box-shadow:0 6px 0 var(--d)}
.demo{width:520px;flex:none;border:4px solid var(--c);border-radius:26px;overflow:hidden;background:#fff;box-shadow:0 6px 0 rgba(0,0,0,.1)}
.demo .scene{overflow:hidden}
.demo .sliders{padding:8px 14px;display:flex;flex-direction:column;gap:6px;border-top:2px solid var(--line-soft)}
.s-demo .art{width:330px;height:330px}
.s-demo .art.emoji{font-size:200px}

.s-question .q{font-family:var(--font-d);font-weight:500;font-size:62px;line-height:1.12;color:var(--d);margin-bottom:34px}
.opts{display:flex;flex-direction:column;gap:14px}
.opt{display:flex;align-items:center;gap:20px;text-align:left;background:#fff;border:4px solid var(--c);border-radius:24px;padding:14px 26px;font-size:34px;font-weight:800;cursor:pointer;color:var(--ink);font-family:var(--font-b);box-shadow:0 5px 0 rgba(0,0,0,.08);animation:pop .5s cubic-bezier(.3,1.6,.5,1) both}
.opt i{font-style:normal;flex:none;width:54px;height:54px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;font-family:var(--font-d);font-size:28px}
.opt.picked{background:var(--c);color:#fff}
.opt.picked i{background:#fff;color:var(--d)}
.s-question .art{width:240px;height:240px}
.s-question .art.emoji{font-size:150px}

.s-code pre{margin:0 0 20px;background:#2b2f4a;color:#e8f6ff;border-radius:22px;padding:26px 32px;font-family:var(--font-m);font-size:38px;line-height:1.45;box-shadow:0 6px 0 rgba(0,0,0,.2)}
.s-code p{font-size:32px;font-weight:800;margin:0}

.cgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:26px}
.ccard{background:#fff;border:4px solid var(--c);border-radius:30px;padding:22px;text-align:center;box-shadow:0 6px 0 rgba(0,0,0,.08);animation:pop .5s cubic-bezier(.3,1.6,.5,1) both}
.ccard .art{width:190px;height:190px;margin:0 auto}
.ccard h3{font-family:var(--font-d);font-weight:500;font-size:40px;margin:8px 0 2px}
.ccard p{margin:0;font-size:26px;font-weight:700;color:#4a5072}

.conf{position:absolute;font-size:44px;pointer-events:none;animation:cf 2.4s ease-in forwards}
@keyframes cf{0%{transform:translateY(-60px) rotate(0);opacity:1}100%{transform:translateY(800px) rotate(540deg);opacity:.9}}

/* hud, notes, grid */
.hud{position:absolute;left:0;right:0;bottom:6px;display:flex;align-items:center;gap:8px;padding:6px 14px;opacity:0;transition:opacity .25s;z-index:5}
.show:hover .hud,.hud:focus-within{opacity:1}
.hud .count{margin-left:auto;color:#fff;font-weight:800;font-size:14px;text-shadow:0 1px 2px rgba(0,0,0,.6)}
.hbtn{border:0;background:rgba(255,255,255,.9);color:var(--ink);border-radius:12px;min-width:38px;height:36px;font-size:18px;cursor:pointer;text-decoration:none;display:grid;place-items:center;padding:0 10px;font-family:var(--font-d)}
.hbtn:hover{background:#fff}
.hbtn.on{background:#ffd93b}
.acts{display:flex;gap:6px}
.acts .hbtn{font-size:14px}
.bar{position:absolute;left:0;right:0;bottom:0;height:5px;background:rgba(255,255,255,.12);z-index:6}
.bar i{display:block;height:100%;width:0;background:#ffd93b;transition:width .25s}
.speaker{position:absolute;left:0;right:0;bottom:0;max-height:36vh;overflow:auto;background:rgba(20,18,38,.96);color:#fff;padding:16px 28px 28px;font-size:19px;font-weight:700;line-height:1.45;z-index:8;border-top:3px solid #ffd93b}
.speaker small{display:block;color:#ffd93b;font-size:12px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:4px}
.grid{position:absolute;inset:0;background:rgba(20,18,38,.97);z-index:9;overflow:auto;padding:24px;display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;align-content:start}
.grid button{border:3px solid transparent;background:#2f2c4a;color:#fff;border-radius:16px;padding:12px 14px;text-align:left;font-family:var(--font-b);font-weight:800;font-size:15px;cursor:pointer;min-height:70px}
.grid button small{display:block;color:#ffd93b;font-size:11px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:2px}
.grid button.cur{border-color:#ffd93b}
@media print{body{background:#fff}.hud,.bar,.speaker,.grid{display:none!important}}
.item .em.sm{font-size:20px;width:auto;min-width:78px;border-radius:39px;padding:0 16px}

</style>
</head>

<script>
/* The on-screen robots. Peeko's faces are drawn the same way as in the Peeko sketch. */
(function (root, factory) {
  root.CampStages = factory();
})(typeof self !== 'undefined' ? self : this, function () {
  'use strict';
  const $ = (el, sel) => el.querySelector(sel);

  /* ---------- shared: tiny sound + floating notes ---------- */
  const Sound = {
    on: false, ctx: null,
    beep(hz, secs) {
      if (!this.on) return;
      try {
        this.ctx = this.ctx || new (window.AudioContext || window.webkitAudioContext)();
        const o = this.ctx.createOscillator(), g = this.ctx.createGain(), t = this.ctx.currentTime;
        o.type = 'square'; o.frequency.value = hz;
        g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.06, t + 0.01);
        g.gain.exponentialRampToValueAtTime(0.0001, t + Math.max(0.05, secs));
        o.connect(g); g.connect(this.ctx.destination); o.start(t); o.stop(t + secs + 0.05);
      } catch (e) { /* no audio, no problem */ }
    }
  };
  function floatNote(layer, hz) {
    const n = document.createElement('span');
    n.className = 'fnote'; n.textContent = ['♪', '♫', '♩'][Math.floor(Math.random() * 3)];
    n.style.left = (30 + Math.random() * 40) + '%';
    n.style.color = 'hsl(' + Math.round((hz % 500) / 500 * 300) + ',80%,55%)';
    layer.appendChild(n);
    setTimeout(() => n.remove(), 1400);
  }

  /* ---------- Peeko ---------- */
  function peeko(mount, sensors) {
    mount.innerHTML =
      '<div class="pk-scene"><div class="pk-bot"><div class="pk-antenna"></div><div class="pk-head">' +
      '<div class="pk-screen"><canvas width="256" height="128"></canvas></div></div></div><div class="notes"></div></div>';
    const bot = $(mount, '.pk-bot'), cv = $(mount, 'canvas'), notes = $(mount, '.notes');
    const g = cv.getContext('2d');
    const FG = '#e8f6ff', BG = '#050b14';
    const d = {
      clear() { g.setTransform(2, 0, 0, 2, 0, 0); g.fillStyle = BG; g.fillRect(0, 0, 128, 64); },
      fillCircle(cx, cy, r) { g.fillStyle = FG; g.beginPath(); g.arc(cx + 0.5, cy + 0.5, r + 0.5, 0, 6.2832); g.fill(); },
      drawCircle(cx, cy, r) { g.strokeStyle = FG; g.lineWidth = 1; g.beginPath(); g.arc(cx + 0.5, cy + 0.5, r, 0, 6.2832); g.stroke(); },
      line(x0, y0, x1, y1) { g.strokeStyle = FG; g.lineWidth = 1.1; g.beginPath(); g.moveTo(x0 + 0.5, y0 + 0.5); g.lineTo(x1 + 0.5, y1 + 0.5); g.stroke(); },
      pixel(x, y) { g.fillStyle = FG; g.fillRect(x, y, 1, 1); },
      rect(x, y, w, h) { g.fillStyle = FG; g.fillRect(x, y, w, h); },
      text(str) {
        const size = str.length <= 10 ? 2 : 1;
        g.fillStyle = FG; g.font = 'bold ' + (10 * size) + 'px "Courier New", monospace'; g.textBaseline = 'top';
        g.fillText(str, (128 - str.length * 6 * size) / 2, (64 - 8 * size) / 2 - size);
      }
    };
    // --- the same shapes as the tested sketch (drawRoundEye, drawHappyEye, ...)
    const eyes = (r) => { d.fillCircle(40, 28, r); d.fillCircle(88, 28, r); };
    const happyEye = (cx, cy) => { d.line(cx - 9, cy + 5, cx, cy - 5); d.line(cx - 9, cy + 6, cx, cy - 4); d.line(cx, cy - 5, cx + 9, cy + 5); d.line(cx, cy - 4, cx + 9, cy + 6); };
    const sadEye = (cx, cy) => { d.line(cx - 9, cy - 3, cx, cy + 6); d.line(cx - 9, cy - 2, cx, cy + 7); d.line(cx, cy + 6, cx + 9, cy - 3); d.line(cx, cy + 7, cx + 9, cy - 2); };
    const angryEye = (cx, cy) => { d.rect(cx - 8, cy - 2, 16, 6); if (cx < 64) d.line(cx - 9, cy - 12, cx + 9, cy - 6); else d.line(cx + 9, cy - 12, cx - 9, cy - 6); };
    const smile = (yb, w) => { for (let x = 64 - w; x <= 64 + w; x += 2) { const y = yb + Math.trunc(((x - 64) * (x - 64)) / 55); d.pixel(x, y); d.pixel(x, y + 1); } };
    const frown = (yb, w) => { for (let x = 64 - w; x <= 64 + w; x += 2) { const y = yb - Math.trunc(((x - 64) * (x - 64)) / 55); d.pixel(x, y); d.pixel(x, y + 1); } };
    const oMouth = (cx, cy, r) => { d.drawCircle(cx, cy, r); d.drawCircle(cx, cy, r - 1); };
    const F = {
      neutral() { d.clear(); eyes(9); },
      closed() { d.clear(); d.rect(31, 26, 18, 4); d.rect(79, 26, 18, 4); },
      happy1() { d.clear(); eyes(9); },
      happy2() { d.clear(); happyEye(40, 28); happyEye(88, 28); smile(46, 12); },
      happy3() { d.clear(); happyEye(40, 28); happyEye(88, 28); smile(44, 20); },
      sad2() { d.clear(); sadEye(40, 28); sadEye(88, 28); frown(54, 18); },
      sad3() { d.clear(); sadEye(40, 28); sadEye(88, 28); frown(54, 18); d.fillCircle(34, 40, 3); },
      surprised2() { d.clear(); eyes(15); oMouth(64, 50, 6); },
      angry2() { d.clear(); angryEye(40, 28); angryEye(88, 28); frown(52, 14); }
    };

    let busy = 0, lastActive = performance.now(), stage;
    const tilt = (angle) => { bot.style.setProperty('--tilt', ((angle - 90) * 0.4) + 'deg'); };
    const note = (hz, secs) => { floatNote(notes, hz); Sound.beep(hz, secs); };
    const happyFace = async (sleep) => { F.happy1(); await sleep(0.15); F.happy2(); await sleep(0.15); F.happy3(); };

    stage = {
      reset() { busy = 0; F.neutral(); tilt(90); notes.innerHTML = ''; lastActive = performance.now(); },
      note, print: (t) => sensors.print(t),
      head(angle) { tilt(angle); },
      async say(text, secs, sleep) {
        busy++;
        try { d.clear(); d.text(text); await sleep(secs); F.neutral(); } finally { busy--; lastActive = performance.now(); }
      },
      async react(cmd, sleep) {
        busy++;
        try {
          const C = 90, L = 50, R = 130;
          switch (cmd) {
            case 'happy': await happyFace(sleep); tilt(C + 15); note(523, 0.15); await sleep(0.16); note(659, 0.15); await sleep(0.16); note(784, 0.25); await sleep(0.26); tilt(C); break;
            case 'sad': F.happy1(); await sleep(0.15); F.sad2(); await sleep(0.2); F.sad3(); tilt(C - 20); note(400, 0.3); await sleep(0.32); note(300, 0.3); await sleep(0.32); note(200, 0.5); await sleep(0.52); tilt(C); break;
            case 'surprised': F.happy1(); await sleep(0.1); F.surprised2(); tilt(C - 25); note(1200, 0.12); await sleep(0.13); await sleep(0.2); tilt(C); break;
            case 'angry': F.happy1(); await sleep(0.1); F.angry2(); for (let i = 0; i < 3; i++) { tilt(L + 20); await sleep(0.08); tilt(R - 20); await sleep(0.08); } tilt(C); note(150, 0.4); await sleep(0.42); break;
            case 'sleepy': F.closed(); await sleep(0.6); F.neutral(); break;
            case 'left': tilt(L); await sleep(0.4); tilt(C); break;
            case 'right': tilt(R); await sleep(0.4); tilt(C); break;
            case 'neutral': F.neutral(); tilt(C); break;
            case 'celebrate':
              for (let i = 0; i < 2; i++) { await happyFace(sleep); tilt(L + 20); note(784, 0.1); await sleep(0.12); tilt(R - 20); note(988, 0.1); await sleep(0.12); }
              tilt(C); break;
          }
        } finally { busy--; lastActive = performance.now(); }
      }
    };
    F.neutral(); tilt(90);
    const blink = setInterval(() => {
      if (!mount.isConnected) { clearInterval(blink); return; }
      if (busy === 0 && performance.now() - lastActive > 4000) { F.closed(); setTimeout(() => { if (busy === 0) F.neutral(); }, 150); lastActive = performance.now(); }
    }, 500);
    return { stage, controls: '' };
  }

  /* ---------- Chip Bot ---------- */
  function chipbot(mount, sensors) {
    mount.innerHTML =
      '<div class="cb-scene"><div class="cb-sun"></div><div class="cb-ground"><div class="cb-track"></div></div>' +
      '<div class="cb-obstacle"><span>📦</span></div>' +
      '<div class="cb-bot"><div class="cb-body"><div class="cb-eyes"><i></i><i></i></div><div class="cb-mouth"></div></div>' +
      '<div class="cb-legs"><b class="cb-leg l"></b><b class="cb-leg r"></b></div></div>' +
      '<div class="cb-dist">📏 <b>50</b> cm</div><div class="notes"></div></div>';
    const scene = $(mount, '.cb-scene'), bot = $(mount, '.cb-bot'), notes = $(mount, '.notes');
    const obs = $(mount, '.cb-obstacle'), distEl = $(mount, '.cb-dist b');
    const apply = () => {
      const dcm = sensors.distance;
      distEl.textContent = Math.round(dcm);
      obs.style.left = (30 + (dcm / 50) * 52) + '%';
    };
    sensors.on('distance', apply); apply();
    const clear = () => { scene.className = 'cb-scene'; bot.className = 'cb-bot'; };
    const stage = {
      reset() { clear(); notes.innerHTML = ''; scene.style.setProperty('--T', '1s'); },
      idle() { clear(); },
      walk(dir, T) { clear(); scene.style.setProperty('--T', T + 's'); scene.classList.add(dir === 'fwd' ? 'moving-f' : 'moving-b'); bot.classList.add('walking'); },
      turn(dir, T) { clear(); scene.style.setProperty('--T', T + 's'); bot.classList.add(dir === 'left' ? 'turn-l' : 'turn-r'); },
      dance(m, per) { clear(); scene.style.setProperty('--T', Math.max(0.5, per) + 's'); bot.classList.add('dancing', 'dance-' + (Number(m) % 4)); },

      reset() { stage.led('off'); notes.innerHTML = ''; },
      led(color) { const c = LED[color] || LED.off; bulb.setAttribute('fill', c); glow.setAttribute('fill', c); glow.setAttribute('opacity', color === 'off' ? 0 : 0.85); },

      },

      '<label class="slider"><span>☀️ Light</span><input type="range" min="0" max="100" step="1" data-s="light"><output></output></label>';
    return { stage, controls };
  }

  return { make: { peeko, chipbot, jarvis }, Sound };

(function () {

      $('#lockView').hidden = true; route();

    if (s.t === 'demo') mountDemo();
    if (s.t === 'end') confetti();
    if (s.t === 'question') $$('.opt', st).forEach((o) => { o.onclick = () => o.classList.toggle('picked'); });
    if (s.t === 'activity') timer(s.minutes);
    void cs;
  }
  function confetti() {
    const st = $('#stage'), em = ['🎉', '✨', '⭐', '💜', '🟡', '🟢', '🔵'];
    for (let i = 0; i < 26; i++) { const e = document.createElement('span'); e.className = 'conf'; e.textContent = em[i % em.length]; e.style.left = (Math.random() * 96) + '%'; e.style.animationDelay = (Math.random() * 1.4) + 's'; st.appendChild(e); setTimeout(() => e.remove(), 4200); }
  }
  function timer(mins) {
    const b = $('#timer'); if (!b) return;
    let left = mins * 60, on = false;
    const show = () => { b.textContent = '⏱ ' + Math.floor(left / 60) + ':' + String(left % 60).padStart(2, '0'); };
    b.onclick = () => {
      if (left <= 0) { left = mins * 60; b.classList.remove('done'); show(); return; }
      on = !on; b.classList.toggle('run', on); clearInterval(timerId);
      if (on) timerId = setInterval(() => { left--; show(); if (left <= 0) { clearInterval(timerId); on = false; b.classList.remove('run'); b.classList.add('done'); } }, 1000);
    };
  }
  function go(n) { idx = Math.max(0, Math.min(deck.slides.length - 1, n)); render(); }

  /* ---------- scale the 1280x720 stage to the window ---------- */
  function fit() {
    const st = $('#stage'); if (!st) return;
    const s = Math.min(window.innerWidth / 1280, window.innerHeight / 720);
    st.style.left = '50%'; st.style.top = '50%'; st.style.transform = 'translate(-50%,-50%) scale(' + s + ')';
  }
  window.addEventListener('resize', fit);

  /* ---------- chrome ---------- */
  function buildHud() {
    const a = $('#acts'); a.innerHTML = '';
    deck.acts.forEach((x) => { const b = document.createElement('button'); b.className = 'hbtn'; b.textContent = x.name; b.onclick = () => go(x.from); a.appendChild(b); });
  }
  function buildGrid() {
    const g = $('#grid'); g.innerHTML = '';
    deck.slides.forEach((s, i) => {
      const b = document.createElement('button'); b.className = i === idx ? 'cur' : '';
      b.innerHTML = '<small>' + (i + 1) + ' · ' + esc(s.t) + '</small>' + fmt(slideTitle(s)); b.onclick = () => { g.hidden = true; go(i); }; g.appendChild(b);
    });
  }
  function toggle(id, btn) { const n = $(id); n.hidden = !n.hidden; if (btn) btn.classList.toggle('on', !n.hidden); }
  $('#hNotes').onclick = () => toggle('#notes', $('#hNotes'));
  $('#hGrid').onclick = () => { buildGrid(); toggle('#grid'); };
  $('#hFull').onclick = () => { if (document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen && document.documentElement.requestFullscreen(); };
  document.addEventListener('keydown', (e) => {
    if ($('#showView').hidden || e.target.matches('input,textarea')) return;
    const k = e.key;
    if (k === 'ArrowRight' || k === 'PageDown' || k === ' ' || k === 'Enter') { e.preventDefault(); go(idx + 1); }
    else if (k === 'ArrowLeft' || k === 'PageUp' || k === 'Backspace') { e.preventDefault(); go(idx - 1); }
    else if (k === 'Home') go(0);
    else if (k === 'End') go(deck.slides.length - 1);
    else if (k === 'n' || k === 'N') $('#hNotes').click();
    else if (k === 'g' || k === 'G') $('#hGrid').click();
    else if (k === 'f' || k === 'F') $('#hFull').click();
    else if (k === 'Escape') { $('#grid').hidden = true; }
  });
  let tx = 0;
  $('#viewport').addEventListener('pointerdown', (e) => { tx = e.clientX; });
  $('#viewport').addEventListener('pointerup', (e) => {
    if (e.target.closest('a,button,input,.demo')) return;
    const dx = e.clientX - tx;
    if (Math.abs(dx) > 60) go(idx + (dx < 0 ? 1 : -1));
    else go(idx + (e.clientX > window.innerWidth / 2 ? 1 : -1));
  });

  /* ---------- routing ---------- */
  function route() {
    if (!data) return;
    const m = location.hash.match(/^#([\w-]+)(?:\/(\d+))?$/), d = m && data.decks.find((x) => x.id === m[1]);
    if (!d) { renderIndex(); return; }
    deck = d; idx = Math.max(0, Math.min(d.slides.length - 1, (Number(m[2]) || 1) - 1));
    $('#indexView').hidden = true; $('#showView').hidden = false;
    $('#notes').hidden = true; $('#grid').hidden = true; $('#hNotes').classList.remove('on');
    buildHud(); fit(); render();
  }
  window.addEventListener('hashchange', route);
  let saved = null; try { saved = sessionStorage.getItem(PIN_KEY); } catch (e) { /* fine */ }
  if (saved) attempt(saved, true);
})();

</script>
</body>
