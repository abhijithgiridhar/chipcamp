<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Circuit Lab · Chip Camp</title>
<style>
@import url("https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600&family=Nunito:wght@600;800;900&family=JetBrains+Mono:wght@400;700&display=swap");
:root{
  --ink:#2b2f4a; --ink-soft:#69709a; --bg:#e8f0ff; --card:#ffffff; --line:#d3def6; --line-soft:#e6edfb;
  --purple:#7c4dff; --blue:#4c97ff; --green:#3fb950; --green-d:#2c8f3b; --events:#FFBF00;
  --font-d:"Fredoka","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --font-b:"Nunito","Segoe UI","Trebuchet MS",system-ui,sans-serif;
  --font-m:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --nh:6px; --nx:16px; --nw:26px;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-b);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
[hidden]{display:none!important}

/* ---------- top bar ---------- */
.topbar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 18px;background:linear-gradient(90deg,#7c4dff,#4c97ff);color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.12);}
.brand{font-family:var(--font-d);font-size:24px;font-weight:600;letter-spacing:.2px;display:flex;align-items:center;gap:8px;margin-right:6px}
.brand .logo{display:inline-grid;grid-template-columns:repeat(2,12px);gap:3px;transform:rotate(-8deg)}
.brand .logo i{width:12px;height:12px;border-radius:4px;display:block}
.ptabs{display:flex;gap:8px;flex-wrap:wrap}
.ptab{border:0;cursor:pointer;font-family:var(--font-d);font-size:17px;font-weight:500;padding:8px 16px;border-radius:16px;background:rgba(255,255,255,.2);color:#fff;display:flex;align-items:center;gap:7px;transition:transform .12s, background .15s;}
.ptab:hover{background:rgba(255,255,255,.32);transform:translateY(-1px)}
.ptab[aria-selected="true"]{background:#fff;color:var(--pc);box-shadow:0 4px 0 rgba(0,0,0,.18);transform:translateY(-1px)}
.ptab .em{font-size:20px}
.spacer{flex:1}
.viewtabs{display:flex;background:rgba(0,0,0,.18);border-radius:18px;padding:4px;gap:4px}
.vtab{border:0;cursor:pointer;font-family:var(--font-d);font-size:17px;padding:8px 18px;border-radius:14px;background:transparent;color:#fff;display:flex;align-items:center;gap:6px}
.vtab[aria-selected="true"]{background:#fff;color:var(--purple);box-shadow:0 3px 0 rgba(0,0,0,.18)}

.btn{border:0;cursor:pointer;font-family:var(--font-d);font-weight:500;font-size:15px;padding:8px 14px;border-radius:14px;background:#fff;color:var(--ink);box-shadow:0 3px 0 #c9d6f2;border:2px solid #d3def6;display:inline-flex;align-items:center;gap:6px;transition:transform .08s, box-shadow .08s;white-space:nowrap}
.btn:hover{transform:translateY(-1px);box-shadow:0 4px 0 #c9d6f2}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #c9d6f2}
.btn.go{background:var(--green);border-color:var(--green-d);color:#fff;box-shadow:0 4px 0 var(--green-d)}
.btn.go:hover{box-shadow:0 5px 0 var(--green-d)}
.btn.go:active{box-shadow:0 1px 0 var(--green-d)}
.btn.stop{background:#ff6680;border-color:#d94a63;color:#fff;box-shadow:0 4px 0 #d94a63}
.btn.big{font-size:19px;padding:12px 22px;border-radius:18px}
.btn.small{font-size:13px;padding:5px 10px;border-radius:11px}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* ---------- blocks ---------- */
.blk{--c:#9966FF;position:relative;filter:drop-shadow(0 2px 0 rgba(0,0,0,.2));user-select:none;touch-action:none}
.dz>.blk+.blk,.blk+.blk{margin-top:calc(var(--nh) * -1)}
.blk>.row,.blk>.foot{background:var(--c);color:#fff;font-family:var(--font-d);font-weight:500;font-size:15px;text-shadow:0 1px 0 rgba(0,0,0,.18)}
.blk>.row{display:flex;align-items:center;flex-wrap:wrap;gap:6px;min-height:46px;padding:8px 10px calc(8px + var(--nh)) 12px;
  clip-path:polygon(0 0,var(--nx) 0,calc(var(--nx) + 4px) var(--nh),calc(var(--nx) + var(--nw) - 4px) var(--nh),calc(var(--nx) + var(--nw)) 0,100% 0,100% calc(100% - var(--nh)),calc(var(--nx) + var(--nw)) calc(100% - var(--nh)),calc(var(--nx) + var(--nw) - 4px) 100%,calc(var(--nx) + 4px) 100%,var(--nx) calc(100% - var(--nh)),0 calc(100% - var(--nh)));
  cursor:grab}
.blk.c>.row{clip-path:polygon(0 0,var(--nx) 0,calc(var(--nx) + 4px) var(--nh),calc(var(--nx) + var(--nw) - 4px) var(--nh),calc(var(--nx) + var(--nw)) 0,100% 0,100% 100%,0 100%);padding-bottom:8px;border-radius:12px 12px 0 0}
.blk.c>.row.else{clip-path:none;border-radius:0;min-height:34px;padding-top:6px;padding-bottom:6px}
.blk:not(.c)>.row{border-radius:12px 12px 12px 12px}
.blk>.foot{height:calc(26px + var(--nh));border-radius:0 0 12px 12px;display:flex;align-items:center;padding:0 12px var(--nh) 12px;gap:8px;
  clip-path:polygon(0 0,100% 0,100% calc(100% - var(--nh)),calc(var(--nx) + var(--nw)) calc(100% - var(--nh)),calc(var(--nx) + var(--nw) - 4px) 100%,calc(var(--nx) + 4px) 100%,var(--nx) calc(100% - var(--nh)),0 calc(100% - var(--nh)))}
.cslot{display:flex;background:var(--c)}
.cslot::before{content:"";width:16px;flex:none;background:var(--c)}
.cslot>.dz{flex:1;background:#f7f9ff;border-radius:10px 0 0 10px;min-height:44px;margin:0;box-shadow:inset 0 3px 0 rgba(0,0,0,.08)}
.blk .x{margin-left:auto;border:0;background:rgba(255,255,255,.28);color:#fff;width:22px;height:22px;border-radius:50%;cursor:pointer;font-size:12px;line-height:1;padding:0;opacity:.0;transition:opacity .12s}
.blk:hover>.row .x,.blk>.row .x:focus-visible{opacity:1}
.blk .x:hover{background:rgba(255,255,255,.5)}
.blk .tag{font-size:11px;font-weight:700;background:rgba(0,0,0,.16);border-radius:10px;padding:2px 8px;font-family:var(--font-b);text-shadow:none}
.elsebtn{border:0;cursor:pointer;background:rgba(255,255,255,.28);color:#fff;font-family:var(--font-d);font-size:13px;border-radius:10px;padding:3px 10px}
.elsebtn:hover{background:rgba(255,255,255,.45)}
.blk.running>.row,.blk.running>.foot{animation:glow .6s ease-in-out infinite alternate}
@keyframes glow{from{filter:brightness(1)}to{filter:brightness(1.35) saturate(1.2)}}
.blk.pop{animation:pop .38s cubic-bezier(.3,1.7,.5,1)}
@keyframes pop{0%{transform:scale(.6) rotate(-4deg);opacity:.2}100%{transform:scale(1) rotate(0);opacity:1}}
.blk.lifting{opacity:.3}
.ghost{position:fixed;z-index:1000;pointer-events:none;transform:rotate(2deg) scale(1.04);filter:drop-shadow(0 10px 12px rgba(40,40,80,.35));opacity:.96}
.ghost .x{display:none}

/* parameter fields (Scratch style) */
.pill{display:inline-flex;align-items:center;border-radius:16px;background:#fff;color:var(--ink);text-shadow:none;font-family:var(--font-b);font-weight:800;font-size:14px;padding:0;overflow:hidden;box-shadow:inset 0 -2px 0 rgba(0,0,0,.1)}
.pill input{border:0;background:transparent;outline:0;font-weight:800;color:var(--ink);padding:3px 9px;min-width:0;text-align:center;font-family:var(--font-b)}
.pill input[type=number]{width:58px;-moz-appearance:textfield}
.pill input[type=number]::-webkit-outer-spin-button,.pill input[type=number]::-webkit-inner-spin-button{opacity:.55}
.pill input[type=text]{width:116px}
.pill:focus-within{outline:3px solid rgba(255,255,255,.75);outline-offset:1px}
.drop{display:inline-flex;align-items:center;border-radius:14px;background:rgba(0,0,0,.2);color:#fff;font-family:var(--font-b);font-weight:800;font-size:14px;text-shadow:none;padding:0;position:relative}
.drop select{appearance:none;-webkit-appearance:none;border:0;background:transparent;color:#fff;font-weight:800;padding:4px 24px 4px 10px;cursor:pointer;outline:0;border-radius:14px;font-family:var(--font-b)}
.drop select option{color:var(--ink);background:#fff}
.drop::after{content:"▾";position:absolute;right:9px;pointer-events:none;font-size:12px}
.drop:focus-within{outline:3px solid rgba(255,255,255,.75);outline-offset:1px}
.static{display:inline-flex;align-items:center;border-radius:14px;padding:2px 9px;font-weight:800;font-size:13px;font-family:var(--font-b);text-shadow:none}
.static.p{background:#fff;color:var(--ink)}
.static.d{background:rgba(0,0,0,.2);color:#fff}
.palette-blk{margin-bottom:10px;cursor:grab}
.palette-blk>.row{cursor:grab}
.palette-blk.c>.foot{height:calc(18px + var(--nh))}

.dz{display:flex;flex-direction:column;min-height:40px;position:relative}
.dz.over{outline:3px dashed var(--purple);outline-offset:-3px;border-radius:12px;background:rgba(124,77,255,.07)}
.dz:empty::before,.dz.empty::before{content:"drop blocks here";display:flex;align-items:center;justify-content:center;min-height:44px;color:#9aa4c7;font-weight:800;font-size:13px;border-radius:10px;border:2px dashed #cfd9f3;margin:4px}
.dropline{height:0;position:relative;z-index:5}
.dropline::after{content:"";position:absolute;left:-2px;right:-2px;top:-3px;height:6px;border-radius:4px;background:var(--purple);box-shadow:0 0 0 2px #fff}
/* ---------- misc ---------- */
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:#2b2f4a;color:#fff;font-family:var(--font-d);padding:10px 18px;border-radius:16px;opacity:0;pointer-events:none;transition:all .25s;z-index:3000;box-shadow:0 8px 20px rgba(0,0,0,.25)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.modalback{position:fixed;inset:0;background:rgba(43,47,74,.5);display:grid;place-items:center;z-index:2000;padding:16px}
.modal{background:#fff;border-radius:22px;width:min(560px,100%);max-height:86vh;overflow:auto;padding:18px 20px;box-shadow:0 20px 50px rgba(0,0,0,.3);border:3px solid var(--line)}
.modal h2{font-family:var(--font-d);font-weight:500;margin:0 0 10px;font-size:22px}
.modal textarea{width:100%;height:120px;border:2px solid var(--line);border-radius:12px;padding:8px;font-family:var(--font-m);font-size:12px}
.saverow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:2px solid var(--line-soft)}
.saverow .who{flex:1;font-weight:800}
.saverow .who small{display:block;font-weight:600;color:var(--ink-soft)}
.conf{position:fixed;z-index:2500;font-size:26px;pointer-events:none;animation:conf 1.1s ease-out forwards}
@keyframes conf{0%{transform:translate(0,0) rotate(0) scale(.6);opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(var(--r)) scale(1.2);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}

.homebtn{display:inline-grid;place-items:center;width:42px;height:42px;border-radius:14px;background:rgba(255,255,255,.22);color:#fff;text-decoration:none;font-size:21px;box-shadow:0 3px 0 rgba(0,0,0,.14);transition:transform .12s,background .15s;flex:none}
.homebtn:hover{background:rgba(255,255,255,.36);transform:translateY(-1px)}
.homebtn:focus-visible{outline:3px solid #fff;outline-offset:2px}

/* Circuit Lab */
body{background:var(--bg);margin:0}
.ptabs{display:flex;gap:8px;flex-wrap:wrap}
.ptab{border:0;cursor:pointer;font-family:var(--font-d);font-size:16px;font-weight:500;padding:7px 14px;border-radius:15px;background:rgba(255,255,255,.2);color:#fff;display:flex;align-items:center;gap:6px}
.ptab:hover{background:rgba(255,255,255,.32)}
.ptab[aria-selected="true"]{background:#fff;color:var(--pc);box-shadow:0 4px 0 rgba(0,0,0,.18)}
.lab{display:grid;grid-template-columns:minmax(0,1fr) 330px;grid-template-areas:"bin bin" "canvas check";gap:14px;padding:14px 18px 36px;max-width:1700px;margin:0 auto;align-items:start}
@media (max-width:980px){.lab{grid-template-columns:1fr;grid-template-areas:"bin" "canvas" "check"}}
.binrow{grid-area:bin;padding:10px 14px}
.binhead{display:flex;align-items:baseline;gap:10px;margin-bottom:8px;font-family:var(--font-d);font-size:17px}
.binhead span{font-family:var(--font-b);font-size:13px;font-weight:700;color:var(--ink-soft)}
.bin{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:flex;align-items:center;gap:8px;background:#fff;border:2px solid var(--line);border-radius:14px;padding:6px 12px 6px 8px;cursor:grab;user-select:none;touch-action:none;box-shadow:0 3px 0 var(--line);font-weight:800;font-size:14px;transition:transform .1s}
.chip:hover{transform:translateY(-1px)}
.chip .em{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-size:20px;background:var(--cc,#eef2ff)}
.chip small{display:block;font-weight:700;color:var(--ink-soft);font-size:11.5px}
.chip.used{opacity:.4;cursor:default;box-shadow:none}
.chip.pulse{animation:pulsechip .7s ease-in-out 4}
@keyframes pulsechip{50%{box-shadow:0 0 0 6px rgba(124,77,255,.35);border-color:var(--purple)}}
.chipghost{position:fixed;z-index:1000;pointer-events:none;background:#fff;border:2px solid var(--purple);border-radius:14px;padding:6px 12px;font-weight:800;box-shadow:0 10px 20px rgba(40,40,80,.3)}
.canvascard{grid-area:canvas;padding:10px;min-width:0}
.toolrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.toolrow .spacer{flex:1}
.hintline{min-height:26px;font-weight:800;font-size:14.5px;color:#4a2a9a;background:#f0ebff;border:2px solid #d9ccff;border-radius:12px;padding:5px 12px;margin-bottom:8px}
.hintline:empty{display:none}
.hintline.bad{background:#fff0f3;border-color:#ffb3c0;color:#a62a45}
.hintline.good{background:#effbf1;border-color:#9bdca4;color:#1d6b2b}
.svgwrap{overflow:auto;border-radius:16px;border:2px solid var(--line);background:#f4f8ff;max-height:74vh;touch-action:none}
#svg{display:block;width:100%;height:auto;user-select:none;-webkit-user-select:none;background:radial-gradient(#d4def5 1.1px,transparent 1.1px) 0 0/24px 24px,#f8fbff}
#svg text{font-family:var(--font-b);pointer-events:none}
#svg .term{cursor:crosshair}
#svg .part{cursor:grab}
#svg .part.sel>.hl{opacity:1}
#svg .hl{opacity:0;fill:none;stroke:#7c4dff;stroke-width:3;stroke-dasharray:6 4}
#svg .wire{fill:none;stroke-linecap:round;stroke-width:5}
#svg .wirehit{fill:none;stroke:transparent;stroke-width:16;cursor:pointer}
#svg .wire.sel{stroke-width:7;filter:drop-shadow(0 0 4px #7c4dff)}
#svg .pulse{fill:none;stroke:#7c4dff;stroke-width:4;animation:ring 1s ease-out infinite}
@keyframes ring{0%{r:6;opacity:1}100%{r:26;opacity:0}}
#svg .snap{fill:rgba(124,77,255,.18);stroke:#7c4dff;stroke-width:3}
#svg .xbtn{cursor:pointer}
#svg.alive .horn{animation:horn .8s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 50%}
@keyframes horn{from{transform:rotate(-30deg)}to{transform:rotate(30deg)}}
#svg .eyes{opacity:0}
#svg.alive .eyes{opacity:1}
#svg.alive .sonar{animation:sonar 1.2s ease-out infinite}
@keyframes sonar{0%{opacity:.9;transform:scale(.4)}100%{opacity:0;transform:scale(1.6)}}
#svg .sonar{opacity:0;transform-box:fill-box;transform-origin:50% 50%}
#svg.alive .ledglow{animation:ledcycle 1.8s linear infinite}
@keyframes ledcycle{0%{fill:#ff3b3b}33%{fill:#35d07f}66%{fill:#3b82ff}100%{fill:#ff3b3b}}
#svg .ledglow{fill:#59606e}
.checkcard{grid-area:check;padding:14px;position:sticky;top:12px}
.prog{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.bar{flex:1;height:14px;border-radius:9px;background:#e6edfb;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#59c059,#3fb950);border-radius:9px;transition:width .3s}
#progtext{font-family:var(--font-d);font-size:15px;white-space:nowrap}
.grp{margin:12px 0 4px;font-family:var(--font-d);font-size:14px;color:var(--ink-soft);text-transform:none}
.citem{display:grid;grid-template-columns:24px 1fr;gap:8px;align-items:start;padding:6px 8px;border-radius:12px;cursor:pointer;font-weight:800;font-size:14px}
.citem:hover{background:#f3f6ff}
.citem .ic{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:13px;background:#e6edfb;color:var(--ink-soft)}
.citem.ok .ic{background:var(--green);color:#fff}
.citem.ok{color:#23702f}
.citem.bad .ic{background:#e5484d;color:#fff}
.citem.bad{color:#a62a45;background:#fff5f6}
.citem.opt .ic{background:#ffe9a8;color:#7a5b00}
.citem .why{display:block;font-weight:700;font-size:12.5px;color:#7a5b9a;margin-top:2px}
.citem.bad .why{color:#a62a45}
.citem.hint{outline:3px solid rgba(124,77,255,.35)}
.problem{background:#fff0f3;border:2px solid #ffb3c0;color:#a62a45;border-radius:12px;padding:8px 10px;font-weight:800;font-size:13.5px;margin-bottom:8px}
.facil{margin-top:16px;border:2px dashed var(--line);border-radius:12px;padding:8px 10px;font-size:13px}
.facil summary{cursor:pointer;font-family:var(--font-d);font-size:14px;color:var(--ink-soft)}
.facil p{margin:8px 0;color:var(--ink-soft);font-weight:700}
.facilbtns{display:flex;gap:6px;flex-wrap:wrap}
.cardh{margin:0 0 10px;font-family:var(--font-d);font-weight:500;font-size:18px}
.celebrate{background:linear-gradient(135deg,#effbf1,#e8f3ff);border:2px solid #9bdca4;border-radius:14px;padding:10px 12px;margin-bottom:10px;font-weight:800;color:#1d6b2b}
.celebrate a{display:inline-block;margin-top:8px}

</style>
</head>
<body>
<header class="topbar">
  <a class="homebtn" href="index.html" title="Back to the Chip Camp welcome screen" aria-label="Home">🏠</a>
  <div class="brand"><span class="logo" aria-hidden="true"><i style="background:#FFAB19"></i><i style="background:#4C97FF"></i><i style="background:#59C059"></i><i style="background:#e5484d"></i></span>Circuit Lab</div>
  <nav class="ptabs" id="ptabs" aria-label="Choose a robot"></nav>
  <div class="spacer"></div>
  <button class="btn small" id="undoBtn" title="Undo the last change">↶ Undo</button>
</header>

<main class="lab">
  <section class="card binrow" aria-label="Your kit">
    <div class="binhead"><b>Your kit</b><span>Drag parts onto the board, or tap them.</span></div>
    <div class="bin" id="bin"></div>
  </section>

  <section class="card canvascard" aria-label="Circuit board">
    <div class="toolrow">
      <button class="btn small" id="hintBtn">💡 Hint</button>
      <button class="btn small" id="delBtn" disabled>🗑 Delete</button>
      <button class="btn small" id="flipBtn" hidden>⟲ Flip plug</button>
      <span class="spacer"></span>
      <button class="btn small" id="zoomOut" aria-label="Zoom out">−</button>
      <button class="btn small" id="zoomFit" aria-label="Fit to screen">Fit</button>
      <button class="btn small" id="zoomIn" aria-label="Zoom in">＋</button>
      <button class="btn go" id="powerBtn">⚡ Power on!</button>
    </div>
    <div class="hintline" id="hintline" role="status" aria-live="polite"></div>
    <div class="svgwrap" id="svgwrap"><svg id="svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" role="img" aria-label="Circuit board canvas"></svg></div>
  </section>

  <aside class="card checkcard" aria-label="Build checklist">
    <h2 class="cardh">Build checklist</h2>
    <div class="prog"><div class="bar"><i id="barfill"></i></div><span id="progtext"></span></div>
    <div id="problems"></div>
    <div id="checklist"></div>
    <details class="facil">
      <summary>For facilitators</summary>
      <p>Show the finished wiring to compare, or clear the board.</p>
      <div class="facilbtns"><button class="btn small" id="solveBtn">🎓 Show finished circuit</button><button class="btn small" id="clearBtn">🧹 Clear board</button></div>
    </details>
  </aside>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* Chip Camp: what each student has chosen and finished, shared by every page (kept in this browser only). */
(function (root) {
  'use strict';
  const KEY = 'chipcamp.v1';
  const ROBOTS = ['chipbot', 'peeko', 'jarvis'];
  function read() { try { return JSON.parse(localStorage.getItem(KEY)) || {}; } catch (e) { return {}; } }
  function write(d) { try { localStorage.setItem(KEY, JSON.stringify(d)); } catch (e) { /* private window: just don't remember */ } }
  function clean(s) { return String(s == null ? '' : s).replace(/[^A-Za-z0-9 .,!?'_-]/g, '').replace(/\s+/g, ' ').trim().slice(0, 16); }

  root.ChipCamp = {
    ROBOTS,
    get() {
      const d = read();

      const n = d.moved ? nearestTerm(pt, 14, d.from) : null;
      if (n) { const w = Lab.addWire(S.st, d.from, n.id); if (w) pushUndo(d.before); }
    } else if (d.kind === 'plug') {
      const p = d.part;
      if (!d.moved && p.plug && p.type !== 'usb') { p.plug.flip = !p.plug.flip; pushUndo(d.before); }
      if (d.moved) {
        if (p.type === 'usb') { p.plug = dist(pt, { x: L.usb.x - 20, y: L.usb.y }) < 46 ? { to: 'USB', flip: false } : null; }
        else { const h = nearestHeader(pt, 34); p.plug = h ? { to: h.pin, flip: false } : null; }
        if (!p.plug) p.plugPos = { x: pt.x, y: pt.y };
        pushUndo(d.before);
      }
    } else if (d.kind === 'part') {
      const p = d.part;
      if (!d.moved && p.type === 'resistor') { p.ohms = Lab.OHMS[(Lab.OHMS.indexOf(p.ohms) + 1) % Lab.OHMS.length]; pushUndo(d.before); }
      if (d.moved) { if (Lab.legsKind(p.type)) trySeat(p); else p.seat = null; pushUndo(d.before); }
    }
    render();
  });
  function removePart(id) {
    const before = snapshot(), p = getPart(id); if (!p) return;
    S.st.parts = S.st.parts.filter((q) => q.id !== id);
    S.st.wires = S.st.wires.filter((w) => !w.a.startsWith(id + '.') && !w.b.startsWith(id + '#') && !w.a.startsWith(id + '#') && !w.b.startsWith(id + '.'));
    if (p.type === 'breadboard') S.st.parts.forEach((q) => { if (q.seat && q.seat.bb === id) q.seat = null; });
    S.sel = null; pushUndo(before); render();
  }
  function deleteSelection() {
    if (!S.sel) return;
    if (S.sel.kind === 'part') removePart(S.sel.id);
    else { const before = snapshot(); S.st.wires = S.st.wires.filter((w) => w.id !== S.sel.id); S.sel = null; pushUndo(before); render(); }
  }
  window.addEventListener('keydown', (e) => { if ((e.key === 'Delete' || e.key === 'Backspace') && !/INPUT|TEXTAREA|SELECT/.test((e.target || {}).tagName || '')) { e.preventDefault(); deleteSelection(); } });
  $('#delBtn').onclick = deleteSelection;
  $('#flipBtn').onclick = () => { const p = S.sel && getPart(S.sel.id); if (p && p.plug) { const b = snapshot(); p.plug.flip = !p.plug.flip; pushUndo(b); render(); } };
  $('#undoBtn').onclick = () => { const prev = S.undo.pop(); if (!prev) return; S.st = sanitize(S.proj, JSON.parse(prev)); S.sel = null; render(); };

  /* ---------- the checklist, hints and power-on ---------- */
  let lastResult = null, wasComplete = false;
  function renderCheck() {
    const r = lastResult = Lab.check(S.proj, S.st);
    $('#barfill').style.width = (r.total ? (r.done / r.total * 100) : 0) + '%'; $('#progtext').textContent = r.done + ' of ' + r.total;
    const pr = $('#problems'); pr.innerHTML = r.problems.map((p) => '<div class="problem">' + esc(p.msg) + '</div>').join('');
    const firstTodo = r.items.find((i) => i.status === 'todo' && !i.optional);
    const box = $('#checklist'); box.innerHTML = '';
    if (r.complete) box.appendChild(el('div', 'celebrate', '🎉 Everything is wired correctly! Press <b>⚡ Power on!</b>' + '<br><a class="btn small go" href="blocks.html" style="text-decoration:none">Next: build the code ➜</a>'));
    let group = null;
    r.items.forEach((it) => {
      if (it.group !== group) { group = it.group; box.appendChild(el('div', 'grp', esc(group))); }
      const cls = it.status === 'optional' ? 'opt' : it.status;
      const c = el('div', 'citem ' + cls, '<span class="ic">' + (it.status === 'ok' ? '✓' : it.status === 'bad' ? '!' : it.status === 'optional' ? '★' : '') + '</span><span>' + esc(it.text) + (it.status === 'bad' || (it === firstTodo && it.msg) ? '<span class="why">' + esc(it.msg) + '</span>' : '') + '</span>');
      c.onclick = () => showHint(it);
      box.appendChild(c);
    });
    if (r.complete && !wasComplete) { wasComplete = true; ChipCamp.circuitDone(S.proj); }
    if (!r.complete) wasComplete = false;
  }
  function pulseFor(it) {
    S.pulses = []; $$('.chip.pulse').forEach((c) => c.classList.remove('pulse'));
    (it.focus || []).forEach((f) => {
      if (f.indexOf('bin:') === 0) { const c = $('.chip[data-key="' + f.slice(4) + '"]'); if (c) c.classList.add('pulse'); }
      else if (f.indexOf('header:') === 0) { const pos = Lab.headerCenter(f.slice(7)); if (pos) S.pulses.push(pos); }
      else { const pos = Lab.termPos(f, S.st); if (pos) S.pulses.push(pos); }
    });
    renderOver(); clearTimeout(S.hintT); S.hintT = setTimeout(() => { S.pulses = []; renderOver(); $$('.chip.pulse').forEach((c) => c.classList.remove('pulse')); }, 4200);
  }
  function showHint(it) {
    const h = $('#hintline'); h.className = 'hintline' + (it.status === 'bad' ? ' bad' : ''); h.textContent = (it.status === 'ok' ? '✓ ' : '💡 ') + (it.msg || it.text);
    pulseFor(it);
  }
  $('#hintBtn').onclick = () => {
    const r = lastResult || Lab.check(S.proj, S.st);
    if (r.problems.length) { const h = $('#hintline'); h.className = 'hintline bad'; h.textContent = r.problems[0].msg; return; }
    const it = r.items.find((i) => i.status === 'bad') || r.items.find((i) => i.status === 'todo' && !i.optional);
    if (!it) { const h = $('#hintline'); h.className = 'hintline good'; h.textContent = '✓ Nothing left to fix. Press Power on!'; return; }
    showHint(it);
  };
  $('#powerBtn').onclick = (e) => {
    const r = Lab.check(S.proj, S.st), h = $('#hintline');
    if (r.complete) {
      h.className = 'hintline good'; h.textContent = '⚡ It’s alive! Your circuit is wired correctly. Now go and teach it what to do in the Code Builder.';
      svg.classList.add('alive'); const b = e.currentTarget.getBoundingClientRect(); confetti(b.left + 40, b.top);
      ChipCamp.circuitDone(S.proj); setTimeout(() => svg.classList.remove('alive'), 7000);
    } else if (r.problems.length) { h.className = 'hintline bad'; h.textContent = r.problems[0].msg; }
    else {
      const it = r.items.find((i) => i.status === 'bad') || r.items.find((i) => i.status === 'todo' && !i.optional);
      h.className = 'hintline bad'; h.textContent = '🔌 Not quite yet. ' + (it ? (it.msg || it.text) : ''); if (it) pulseFor(it);
    }
  };
  (function () { const b = $('#solveBtn'); let armed = false, t = 0; b.onclick = () => { if (!armed) { armed = true; b.textContent = 'Replace the board? Click again'; t = setTimeout(() => { armed = false; b.textContent = '🎓 Show finished circuit'; }, 3000); return; } clearTimeout(t); armed = false; b.textContent = '🎓 Show finished circuit'; const before = snapshot(); S.st = sanitize(S.proj, Lab.solution(S.proj)); pushUndo(before); S.sel = null; render(); toast('Here is a finished circuit. Compare it with yours.'); }; })();
  (function () { const b = $('#clearBtn'); let armed = false, t = 0; b.onclick = () => { if (!armed) { armed = true; b.textContent = 'Clear everything? Click again'; t = setTimeout(() => { armed = false; b.textContent = '🧹 Clear board'; }, 3000); return; } clearTimeout(t); armed = false; b.textContent = '🧹 Clear board'; const before = snapshot(); S.st = Lab.newState(S.proj); pushUndo(before); S.sel = null; $('#hintline').className = 'hintline'; $('#hintline').textContent = ''; render(); }; })();

  /* ---------- zoom ---------- */
  function setZoom(z) { S.zoom = Math.min(2.4, Math.max(0.8, z)); svg.style.width = (S.zoom * 100) + '%'; }
  $('#zoomIn').onclick = () => setZoom(S.zoom + 0.25); $('#zoomOut').onclick = () => setZoom(S.zoom - 0.25); $('#zoomFit').onclick = () => setZoom(1);

  /* ---------- robot tabs ---------- */
  function renderTabs() {
    const nav = $('#ptabs'); nav.innerHTML = '';
    ROBOTS.forEach((r) => {
      const b = el('button', 'ptab', '<span>' + r[1] + '</span>' + r[2]); b.style.setProperty('--pc', r[3]); b.setAttribute('aria-selected', r[0] === S.proj ? 'true' : 'false');
      b.onclick = () => { if (r[0] === S.proj) return; S.proj = r[0]; ChipCamp.setRobot(r[0]); S.st = load(S.proj); S.sel = null; S.undo = []; S.pulses = []; $('#hintline').className = 'hintline'; $('#hintline').textContent = ''; renderTabs(); render(); };
      nav.appendChild(b);
    });
  }

  initSvg(); renderTabs(); render();
  window.__lab = { S, Lab, render, toSvg };
})();

</script>
